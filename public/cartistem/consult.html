const CASES = [{"id":1,"tag":"CASE 01","color":"#c0392b","title":"줄기세포는 실손보험 지급이 거부될 수 있다","subtitle":"줄기세포 치료 전반에 대한 포괄적 거절","severity":3,"denialLogic":"줄기세포를 이용한 치료는 보험사 내부 기준상 지급 거절 대상에 해당할 수 있으며, 실손보험 약관상 보상 범위에 포함되지 않는다.","counterPoints":[{"point":"카티스템은 식약처 정식 품목허가 의약품 (2012년, 품목기준코드 201200401)","detail":"카티스템은 2012년 1월 식약처로부터 품목허가를 취득한 전문의약품입니다. 3상 임상시험(Level I evidence)을 거쳤고, 6년간 615명 대상 시판 후 조사를 통과하여 재심사도 완료했습니다. 무허가 줄기세포 시술과는 법적으로 완전히 구분됩니다."},{"point":"실손보험 표준약관에 '줄기세포 제외' 조항 없음 — 포괄주의 원칙","detail":"실손의료보험은 포괄주의(negative list) 방식을 채택하여, '보상하지 않는 사항'을 약관에 열거하고 그 외 의료비는 보상하는 구조입니다. 표준약관의 면책 사항에 '줄기세포 치료'를 특정하여 배제하는 조항은 존재하지 않습니다."},{"point":"약관규제법 제5조 제2항 — 작성자 불이익의 원칙 적용","detail":"약관의 뜻이 명백하지 아니한 경우에는 고객에게 유리하게 해석되어야 합니다. 약관에 명시적 제외 조항이 없는 상황에서 보험사가 임의로 지급을 거절하면, 이 원칙에 의해 피보험자에게 유리하게 해석해야 합니다."}],"evidence":["식약처 품목허가서 (카티스템, 2012년 1월)","실손보험 표준약관 원문 (면책 사항 부분)","임상 3상 논문 (Lim et al., 2021, OJSM)","약관규제법 조문"],"laws":["약관규제법 제5조 제2항 (작성자 불이익의 원칙)","약관규제법 제6조 (불공정약관 조항 무효)","약관규제법 제3조 (설명의무 위반 시 주장 불가)","의정부지방법원 판결 — 주치의 진단 우선 인정"],"winRate":90,"cumulative":"가장 먼저, 가장 강하게 반박할 수 있는 사유입니다. 식약처 품목허가서 사본과 실손보험 표준약관의 면책 조항 목록을 함께 첨부하면 보험사가 스스로 번복하는 경우가 많습니다."},{"id":2,"tag":"CASE 02","color":"#d35400","title":"카티스템은 고령 환자에게 적합하지 않다","subtitle":"연령을 이유로 한 적응증 외 치료 주장","severity":3,"denialLogic":"카티스템 수술은 고령 환자에게 적합하지 않은 치료이며, 해당 환자의 연령을 고려할 때 적응증에서 벗어난 시술로 보험금 지급이 불가하다.","counterPoints":[{"point":"카티스템 허가사항에 연령 제한 없음","detail":"식약처 품목허가 사항에 연령 상한 또는 하한이 명시되어 있지 않습니다. 허가 적응증은 '퇴행성 또는 반복적 외상으로 인한 골관절염 환자'이며, 특정 연령대를 배제하는 문구가 없습니다."},{"point":"임상시험 평균 연령 55.9세 — 고령 환자 유효성 확인","detail":"3상 임상시험(Lim et al., 2021) 평균 환자 연령 55.9세. Park et al.(2017) 7년 장기 추적에서 KL Grade 3 환자 안전성·유효성 확인."},{"point":"의사의 재량권 — 대법원 94다13046","detail":"대법원 법리: '의사는 환자의 상황과 당시 의료 수준, 전문적 지식과 경험에 따라 적절하다고 판단되는 진료방법을 선택할 수 있다.'"}],"evidence":["식약처 허가 사항 원문 (연령 제한 조항 부재 확인)","3상 임상시험 논문 (Lim et al., 2021)","고령 환자 장기추적 논문 (Park et al., 2017)","담당의 소견서"],"laws":["대법원 94다13046 (의사의 진료방법 선택 재량권)","약관규제법 제6조 제2항 제1호","약관규제법 제5조"],"winRate":92,"cumulative":"식약처 허가 사항을 출력하여 '연령 제한 없음'을 직접 확인시켜 주십시오."},{"id":3,"tag":"CASE 03","color":"#1a6aa5","title":"MRI상 ICRS 등급·결손 크기가 불분명하다","subtitle":"ICRS 등급 경계 모호성을 이유로 한 지급 거절","severity":3,"denialLogic":"MRI 영상 판독 결과, 연골 결손 등급이 ICRS 3등급과 4등급의 경계에 있어 4등급으로 단정하기 어려우며, 결손 크기 역시 기준(2cm²)에 미달할 수 있다.","counterPoints":[{"point":"관절경 소견이 MRI보다 우선 — Gold Standard","detail":"ICRS 등급 분류의 gold standard는 관절경 직접 육안 소견입니다. MRI의 연골 손상 등급 평가 정확도는 60~85% 수준이며, 특히 Grade III와 IV 구분에서 불일치가 발생할 수 있습니다."},{"point":"결손 크기는 수술 중 직접 계측 — 가장 정확한 기록","detail":"카티스템 시술 과정에서 결손 부위를 노출하고 직접 측정하므로, 수술기록지에 기재된 결손 면적은 직접 관찰에 의한 기록입니다."},{"point":"보험사 측 재판독은 '사후 추정'에 불과","detail":"보험사 자문의는 환자를 직접 진찰하지 않고 서류만으로 판단합니다. 관절경으로 직접 관찰한 수술의의 소견보다 정확도가 떨어집니다."}],"evidence":["수술기록지 (ICRS 4등급 및 결손 크기 명시)","관절경 수술 중 사진·영상 자료","수술 전 MRI 판독 소견서","집도의 ICRS 등급 판단 근거 추가 소견서"],"laws":["의료법 제22조 (진료기록부 작성 의무 및 법적 효력)","약관규제법 제5조","ICRS Cartilage Injury Evaluation Package"],"winRate":78,"cumulative":"수술기록지가 핵심 무기입니다. 집도의에게 'ICRS 4등급 확인 및 결손 크기 재확인 소견서'를 별도 발급받아 첨부하면 보험사의 MRI 재판독 주장을 무력화할 수 있습니다."},{"id":4,"tag":"CASE 04","color":"#6c3483","title":"KL 3등급을 제3기관이 4등급(말기)으로 판정","subtitle":"보험사 측 자문의가 KL 4등급 판정 → 적응증 외 주장","severity":3,"denialLogic":"진료 기관은 KL 3등급으로 진단했으나, 보험사가 의뢰한 제3기관이 KL 4등급(말기)으로 판정하여 카티스템 적응증에서 제외된다.","counterPoints":[{"point":"KL Grade와 ICRS Grade는 완전히 다른 평가 체계","detail":"KL Grade는 X-ray 기반 골관절염 전반적 진행 정도를, ICRS Grade는 관절경 기반 국소 연골 결손 심각도를 평가합니다."},{"point":"KL 3↔4 경계는 판독자 간 신뢰도 차이가 큰 영역 (kappa 0.5~0.7)","detail":"KL 등급은 반정량적 지표로, 동일 영상이라도 판독자에 따라 3등급 또는 4등급으로 달리 해석될 수 있습니다."},{"point":"보험사 자문의 이해충돌 — 10건 중 7건 이상 미지급 통계","detail":"2025년 통계에 따르면 생명보험 의료자문 건 중 10건 중 7건 이상에서 보험금이 일부 또는 전부 미지급되었습니다."}],"evidence":["수술 전 X-ray 영상 및 원본 판독 소견서","집도의 KL 등급 판단 근거 소견서","독립 제3기관(대학병원) 재판독 소견서","KL 분류 판독자 간 신뢰도 관련 의학 문헌"],"laws":["약관규제법 제5조","민사소송법 제202조 (자유심증주의)","의정부지법 판결 — 주치의 진단 우선 인정","부산지법 판결 — 미지급 보험금 1,068만 원 지급"],"winRate":70,"cumulative":"독립적인 대학병원 영상의학과에 재판독을 의뢰하여 KL 3등급 확인서를 받으면 보험사 주장에 정면 대응할 수 있습니다."},{"id":5,"tag":"CASE 05","color":"#117a65","title":"사용량(바이알 수)에 대한 지급 보류","subtitle":"카티스템 투여량이 과다하다는 주장","severity":2,"denialLogic":"사용된 카티스템의 바이알 수 또는 투여 용량이 기준을 초과하거나 의학적 근거 없이 과다 사용되었다.","counterPoints":[{"point":"용량은 결손 면적에 의해 객관적으로 결정 — 허가 용법·용량","detail":"카티스템의 허가 투여량은 결손 면적 1cm²당 500μL이며, 최대 3바이알 세트까지 사용 가능합니다."},{"point":"다발성 결손 시 총 면적 합계에 따라 바이알 수 증가는 합리적","detail":"한 무릎 관절 내에 내측과, 슬개골, 활차구 등 다발성 결손이 존재할 수 있습니다."},{"point":"식약처 허가 용법·용량이 유일한 공식 기준","detail":"현재 학회 차원의 용량 기준이 확립 전이므로, 식약처 허가 용법·용량이 유일한 공식 기준입니다."}],"evidence":["수술기록지 (결손 부위별 면적 및 카티스템 사용량)","식약처 허가사항 원문 — 용법·용량 항목","진료비 세부내역서","집도의 사용량 결정 근거 소견서"],"laws":["약관규제법 제5조","실손보험 표준약관 (실제 발생 의료비 보상 원칙)","3상 임상시험 프로토콜 (NCT01041001)"],"winRate":73,"cumulative":"수술기록지에 결손 크기와 투여량이 함께 기재되어 있는지 반드시 확인하십시오."},{"id":6,"tag":"CASE 06","color":"#2980b9","title":"건강보험 비급여 항목이라 지급 대상이 아니다","subtitle":"비급여 = 실손 보상 제외라는 잘못된 약관 해석","severity":2,"denialLogic":"카티스템이 건강보험 비급여 항목에 해당하므로, 실손보험 약관상 지급 대상이 아니다.","counterPoints":[{"point":"실손보험의 핵심 목적 자체가 비급여 의료비 보상","detail":"실손의료보험은 건강보험이 보장하지 않는 비급여 항목까지 보장하기 위해 존재합니다."},{"point":"세대별 비급여 보장 비율 확인 — 0% 보상 약관은 존재하지 않음","detail":"1세대(~2009): 비급여 거의 100% 보장, 2세대: 80~90%, 3세대: 80%, 4세대: 70%, 5세대: 50%."},{"point":"카티스템은 식약처 허가 의약품 — 비인가 시술이 아님","detail":"카티스템은 식약처 품목허가를 받은 전문의약품이므로, 보상 대상인 '치료 목적의 의료비'에 해당합니다."}],"evidence":["보험 가입 약관 원본","진료비 세부내역서","실손보험 표준약관 제3조","금융위원회(2025) 비급여 분쟁조정기준"],"laws":["실손보험 표준약관 (비급여 의료비 보상 원칙)","약관규제법 제5조 제2항","금소법 제19조"],"winRate":82,"cumulative":"약관 원본을 보험사에 서면으로 교부 요청하십시오."},{"id":7,"tag":"CASE 07","color":"#8e44ad","title":"제3의료기관 자문으로 보험사 측에 유리한 지급거부 증가","subtitle":"보험사 의뢰 의료자문이 집도의 소견을 일방적으로 부정하는 구조적 문제","severity":3,"denialLogic":"보험사가 의뢰한 제3의료기관(자문의)의 의견에 따르면, 해당 환자의 카티스템 시술은 적응증에 부합하지 않거나 의학적 필요성이 인정되지 않으므로 보험금 지급이 불가하다.","counterPoints":[{"point":"보험사 의료자문의 구조적 이해충돌 — 10건 중 7건 이상 미지급","detail":"보험사가 자문의를 선정하고, 자문료를 지급하며, 질문 항목도 보험사가 설계하는 구조에서 자문 결과가 보험사에 유리하게 나오는 것은 구조적으로 예견된 결과입니다."},{"point":"자문의는 환자를 직접 진찰하지 않은 '서류 심사'에 불과","detail":"집도의는 환자의 임상 증상, 이학적 검사, MRI, 관절경 직접 소견을 종합하여 치료를 결정했습니다. 법적·의학적으로 직접 진찰·수술한 의사의 판단이 서류 심사보다 높은 증거력을 가집니다."},{"point":"보험사가 자문의에게 불리한 자료를 선택적으로 미전달하는 사례 다수","detail":"관절경 사진, 수술 중 영상, 집도의 상세 소견서 등 환자에게 유리한 자료를 누락하는 경우가 빈번합니다."},{"point":"법원 판례: 주치의 진단이 보험사 자문의보다 우선","detail":"의정부지법, 부산지법 모두 일관되게 직접 진료한 의사의 판단을 서류 자문보다 신뢰합니다."}],"evidence":["보험사 손해사정결과 안내서","의료자문 회신서 원본","자문 의뢰 시 전달 자료 목록","집도의 반박 소견서","관절경 사진·수술 중 영상","독립 제3기관 재판독 소견서"],"laws":["보험업법 제95조의3 (의료자문 남용 방지 의무)","약관규제법 제5조","민사소송법 제202조","의정부지법 판결","부산지법 판결","보험협회 의료자문 표준내부통제기준"],"winRate":72,"cumulative":"① 의료자문 회신서 원본과 전달 자료 목록을 서면으로 요청 ② 집도의에게 항목별 반박 소견서 ③ 누락 자료 보완 제출"},{"id":8,"tag":"CASE 08","color":"#2c3e50","title":"카티스템은 실험적·연구적 치료에 해당한다","subtitle":"약관상 '실험적 치료' 면책 조항을 근거로 한 거절","severity":3,"denialLogic":"카티스템은 아직 충분히 검증되지 않은 실험적·연구적 치료에 해당하며, 약관상 면책 조항에 의거하여 보험금 지급이 불가하다.","counterPoints":[{"point":"카티스템은 3상 임상시험 완료 + 식약처 허가 = 실험적 치료가 아님","detail":"카티스템은 Phase 1/2/3 임상시험을 모두 거쳐 2012년 정식 허가를 받았으며, 이후 시판 후 조사(PMS)와 재심사까지 완료했습니다."},{"point":"누적 3만 명 이상 시술 — 13년간 상용화된 치료","detail":"2012년 허가 이후 13년간 누적 3만 명 이상의 환자에게 시술된 상용 의약품입니다."},{"point":"약관상 '실험적 치료' 정의에 식약처 허가 의약품은 포함 불가","detail":"'실험적 치료'란 통상 '관련 기관의 승인을 받지 않은 치료'를 의미합니다. 카티스템은 식약처 승인을 받은 전문의약품입니다."}],"evidence":["식약처 품목허가서 (2012년)","시판 후 조사(PMS) 완료 보고서","3상 임상시험 논문","보험 약관 원문"],"laws":["약관규제법 제5조 제2항","약관규제법 제3조","약관규제법 제6조"],"winRate":88,"cumulative":"보험사에 '실험적 치료의 정의'를 서면으로 제시하도록 요청하십시오."},{"id":9,"tag":"CASE 09","color":"#16a085","title":"미세천공술로 충분 — 카티스템은 과잉진료다","subtitle":"더 저렴한 치료로 충분하다는 의학적 필요성 부정","severity":3,"denialLogic":"해당 환자의 연골 결손은 미세천공술로 충분히 치료 가능하며, 고가의 카티스템 사용은 과잉진료에 해당한다.","counterPoints":[{"point":"3상 RCT에서 카티스템이 미세천공술 대비 통계적으로 우월","detail":"Lim et al.(2021) RCT 114명: ICRS 등급 개선율 카티스템 97.7% vs 미세천공술 71.7% (p=0.001)."},{"point":"미세천공술은 결손 면적 2cm² 이상에서 효과 급감","detail":"ICRS 국제 가이드라인에서 미세천공술의 효과는 결손 면적 2cm² 이상에서 급격히 떨어집니다."},{"point":"치료법 선택은 의사의 재량권 — 보험사가 대체 치료를 강제할 수 없음","detail":"대법원 94다13046 판결에 따라, 의사는 적절한 진료방법을 선택할 재량이 있습니다."}],"evidence":["3상 RCT 논문 (Lim et al., 2021)","ICRS 국제 가이드라인","집도의 소견서","수술기록지"],"laws":["대법원 94다13046","약관규제법 제5조","실손보험 표준약관"],"winRate":80,"cumulative":"핵심은 '미세천공술로 충분하지 않은 의학적 이유'를 구체적으로 제시하는 것입니다."},{"id":10,"tag":"CASE 10","color":"#b71c1c","title":"MRI로 측정한 병변 크기가 적응증 기준 미달이라는 주장","subtitle":"MRI 결손 면적 기준 2cm² 미달 판정 → 적응증 외 주장 (최신 이슈)","severity":3,"denialLogic":"수술 전 MRI에서 측정한 연골 결손 면적이 카티스템 적응증 기준인 2cm²에 미달하므로 적응증 외 사용에 해당한다.","counterPoints":[{"point":"MRI는 결손 크기를 평균 65~78% 과소평가 — 국제 논문 다수 확인","detail":"Gomoll et al.(2013): 65% 과소평가, 85%에서 실제가 더 큼. Campbell et al.(2013): 평균 70% 더 큼. Rohren et al.(2023): 전층 결손 78.3% 과소평가."},{"point":"정확한 결손 크기는 관절경 데브리드먼트 후 직접 계측이 gold standard","detail":"카티스템 시술 시 손상된 연골을 데브리드먼트하여 건강한 연골 경계까지 정리한 후 실제 결손 면적을 직접 계측합니다."},{"point":"MRI의 부분층 손상은 연골 변성을 반영하지 못함","detail":"MRI에서 Grade II~III로 판독되는 부분층 손상이 수술 시 데브리드먼트하면 전층 결손으로 드러나는 경우가 매우 흔합니다."},{"point":"보험사는 MRI 측정 한계를 알면서 이를 거절 근거로 악용","detail":"MRI의 결손 크기 과소평가는 영상의학계에서 널리 알려진 사실입니다."}],"evidence":["수술기록지 — 데브리드먼트 후 결손 면적","관절경 수술 중 사진·영상","수술 전 MRI 판독 소견서","집도의 소견서","Gomoll, Campbell, Rohren 논문 사본"],"laws":["약관규제법 제5조","의료법 제22조","대법원 94다13046","약관규제법 제6조"],"winRate":82,"cumulative":"핵심은 '수술기록지의 데브리드먼트 후 결손 면적'이 MRI 측정치보다 우선한다는 점입니다."},{"id":11,"tag":"CASE 11","color":"#7B241C","title":"3세대 보험 '비급여 주사료 250만 원 한도'를 적용하여 삭감","subtitle":"카티스템을 일반 비급여 주사로 분류하여 연간 250만 원 한도 적용 (3세대 이슈)","severity":3,"denialLogic":"카티스템은 주사제에 해당하므로, 3세대 실손보험의 '3대 비급여 특약 — 비급여 주사료' 항목에 따라 연간 250만 원 한도가 적용된다. 따라서 250만 원을 초과하는 금액은 보상하지 않는다.","counterPoints":[{"point":"카티스템은 약관상 '항암제' 그룹에 해당하여 250만 원 한도 예외","detail":"3세대·4세대 실손보험 특별약관 제3조 ②항에는 '항암제, 항생제(항진균제 포함), 희귀의약품을 위해 사용된 비급여 주사료는 주계약의 질병 비급여에서 보상한다'는 예외 규정이 있습니다. 여기서 '항암제'는 암 치료제만을 의미하는 것이 아니라, 식약처 의약품 분류표상 '종양용약' 및 '조직세포의 치료 및 진단 목적제제'를 포함합니다. 카티스템의 복지부 분류코드는 439번('기타의 조직세포성장인자 제제')으로, 이 정의에 정확히 부합합니다."},{"point":"카티스템은 '일반 주사제'가 아닌 '첨단재생바이오의약품'으로 분류","detail":"250만 원 한도가 적용되는 '비급여 주사료'란 도수치료, 체외충격파, 증식치료, 영양 주사, 통증 주사 등 과잉 진료 우려가 있는 항목을 관리하기 위한 것입니다. 카티스템은 식약처에서 '첨단바이오의약품'으로 허가된 전문의약품이며, 투여 방식이 주사 형태일 뿐 분류 기준상 일반 주사제와는 완전히 다른 카테고리입니다. 복지부 분류번호 439번은 250만 원 한도 대상인 '도수·체외충격파·증식치료·주사료' 어디에도 속하지 않습니다."},{"point":"카티스템은 주계약 '질병 비급여'에서 보상 — 한도 연간 5,000만 원","detail":"카티스템이 250만 원 한도의 '3대 비급여 특약'에서 제외되면, 보상은 주계약의 '질병 비급여' 항목으로 넘어갑니다. 이 항목의 연간 한도는 대부분 5,000만 원이며, 비급여 비용의 70%(3~4세대 기준)를 보상합니다. 예를 들어 카티스템 수술비가 1,500만 원이라면 약 1,050만 원을 보상받을 수 있습니다."},{"point":"단, 반드시 '입원 치료'로 진행되어야 주계약 한도가 적용됨","detail":"주계약의 질병 비급여 5,000만 원 한도는 '입원 치료'에 적용됩니다. 통원(외래)으로 처리되면 회당 20만 원 내외의 통원 한도가 적용되어 실질적 보상이 거의 불가능합니다. 카티스템 시술이 반드시 입원 상태에서 진행되고, 서류상으로도 '입원 치료'로 기록되어야 합니다."}],"evidence":["보험 가입 약관 원본 — 특별약관 제3조 ②항 예외 규정 확인","식약처 카티스템 품목허가 사항 — 분류코드 439번 확인","복지부 의약품 분류표 — '기타의 조직세포성장인자 제제' 해당 확인","진료비 세부내역서 — 입원 치료 기록 확인","보험사에 약관상 '항암제' 정의 서면 요청"],"laws":["실손보험 특별약관 제3조 ②항 (항암제 등 예외 규정)","약관규제법 제5조 제2항 (불명확 시 고객 유리 해석)","약관규제법 제3조 (설명의무 위반 시 주장 불가)","금소법 제19조 (설명의무 위반 시 입증책임 전환)"],"winRate":85,"cumulative":"핵심은 보험사에 '카티스템이 약관상 250만 원 한도 대상이 되는 근거 조항을 서면으로 제시하라'고 요청하는 것입니다. 카티스템의 복지부 분류코드 439번은 특약 대상인 '도수·체외충격파·증식치료·주사료'에 해당하지 않으며, 약관의 '항암제' 예외 규정(특별약관 제3조 ②항)에 의해 주계약 질병 비급여(5,000만 원 한도)에서 보상받아야 합니다. 반드시 입원 치료로 진행하십시오."},{"id":12,"tag":"CASE 12","color":"#4A235A","title":"제3의료기관 자문에서 '수술 부적정' 소견 → 과잉진료 주장","subtitle":"보험사 의뢰 자문 정형외과 전문의가 '카티스템 수술은 과잉 진료이며 의학적으로 타당하지 않다'고 소견","severity":3,"denialLogic":"보험사가 의뢰한 제3의료기관 정형외과 전문의 자문 결과, '제출된 의무기록을 바탕으로 검토한 결과, 해당 환자의 상태에 카티스템 수술은 과잉 진료이며 의학적으로 타당하지 않다'는 소견이 나왔으므로 보험금 지급이 불가하다.","counterPoints":[{"point":"자문의는 '서류 검토'만 했을 뿐, 환자를 직접 진찰하거나 관절경을 확인하지 않음","detail":"보험사 자문의는 보험사가 전달한 의무기록과 영상 일부만으로 '부적정' 소견을 내렸습니다. 환자를 직접 진찰하지 않았고, 관절경으로 연골 상태를 직접 확인하지도 않았습니다. 반면, 집도의는 환자의 병력·이학적 검사·MRI·관절경 직접 소견을 종합적으로 검토하여 카티스템이 필요하다고 판단했습니다. 의정부지방법원은 보험사 감정의 의견이 '확정적 감정이 아니라 가까워 보인다는 취지에 불과하다'고 판단하여 주치의 진단을 우선 인정한 바 있습니다."},{"point":"'과잉진료' 주장의 의학적 근거가 불충분 — 자문의의 대안 치료 제시 여부 확인 필요","detail":"자문의가 '과잉진료'라고 주장하려면, ① 해당 환자에게 카티스템이 아닌 어떤 치료가 적절했는지, ② 그 대안 치료가 카티스템과 동등하거나 더 나은 결과를 보인다는 의학적 근거를 함께 제시해야 합니다. 단순히 '타당하지 않다'는 결론만 있고 대안 치료와 그 근거가 없다면, 이는 구체적 의학적 판단이 아닌 보험사에 유리한 결론을 위한 자문입니다. 카티스템은 3상 RCT에서 미세천공술 대비 ICRS 개선율 97.7% vs 71.7%(p=0.001)로 우월성이 입증되었습니다(Lim et al., 2021)."},{"point":"자문 의뢰 시 보험사가 전달한 자료의 완전성 검증 필요","detail":"보험사가 자문 의뢰 시 관절경 사진, 수술 중 영상, 집도의 상세 소견서 등 환자에게 유리한 자료를 누락하고 MRI 영상과 기본 진료기록만 전달한 경우가 다수 보고되어 있습니다. 자문 의뢰 시 전달 자료 목록을 보험사에 서면 요청하여, 어떤 자료가 자문의에게 전달되었는지 확인해야 합니다. 불완전한 자료에 기반한 '부적정' 소견은 신뢰도가 떨어집니다."},{"point":"의료자문의 구조적 이해충돌 — 보험업법 제95조의3 남용 방지 의무","detail":"2025년 통계에 따르면 생명보험 의료자문 건 중 10건 중 7건 이상에서 보험금이 일부 또는 전부 미지급되었습니다. 보험사가 자문의를 선정하고, 자문료를 지급하며, 질문 항목도 보험사가 설계하는 구조입니다. 보험협회 의료자문 표준내부통제기준 자체가 '보험금 부지급 또는 삭감 수단으로 남용되지 않도록' 경고하고 있습니다."},{"point":"집도의의 항목별 반박 소견서가 자문의 의견을 무력화","detail":"가장 효과적인 대응은 집도의에게 자문의 소견서 원본을 보여주고, 항목별로 반박하는 소견서를 받는 것입니다. 예: '자문의는 OO라고 판단하였으나, 본인이 관절경으로 직접 확인한 결과 ICRS 4등급 전층 결손이 확인되었으며, 결손 면적 OOcm²로 카티스템 적응증에 정확히 부합합니다. 환자의 연령·전신 상태·기저질환을 종합 고려하여 카티스템이 가장 적절한 치료라고 판단하였습니다.'"}],"evidence":["보험사 손해사정결과 안내서 (자문 결과 원문)","의료자문 회신서 원본 (보험사에 서면 교부 요청)","자문 의뢰 시 전달 자료 목록 (누락 자료 확인)","집도의 반박 소견서 — 자문의 '부적정' 의견에 대한 항목별 반박","수술기록지 (관절경 소견, ICRS 등급, 결손 면적)","관절경 사진·수술 중 영상","3상 RCT 논문 (Lim et al., 2021) — 의학적 필요성 근거"],"laws":["보험업법 제95조의3 (의료자문 남용 방지 의무)","약관규제법 제5조 (불명확 시 피보험자 유리 해석)","대법원 94다13046 (의사의 진료방법 선택 재량권)","민사소송법 제202조 (자유심증주의)","의정부지법 판결 — 주치의 진단 우선 인정","부산지법 판결 — 미지급 보험금 지급 명령"],"winRate":70,"cumulative":"대응의 핵심은 4단계입니다. ① 보험사에 의료자문 회신서 원본과 자문 의뢰 시 전달 자료 목록을 서면으로 요청합니다. ② 자문의가 '과잉진료'라고 판단한 구체적 근거(대안 치료 제시 여부, 의학적 논거)를 확인합니다. ③ 집도의에게 자문의 소견에 대한 항목별 반박 소견서를 받습니다. ④ 관절경 사진 등 자문 시 누락된 자료를 보완 제출합니다. 자문 자체의 공정성과 완전성에 의문을 제기하면 보험사가 재심사에 응하는 경우가 많습니다."}];

function faqHTML(f, openFirst){

  return '<article class="faq" id="faq-'+f.n+'" data-cat="'+f.cat+'" data-k="'+(f.k||'')+'">'
    +'<details'+(openFirst?' open':'')+'><summary>'
    +'<div class="num">'+f.n+'</div>'
    +'<div class="qt"><span class="ctag">'+(CATLABEL[f.cat]||'')+'</span> '+hot+'<div class="qx">'+f.q+'</div></div>'
    +'<div class="ar">›</div></summary>'
    +'<div class="ans">'+f.a+'</div>'+note
    +'</details></article>';
}

/* ===== 통합검색 패널 ===== */
function staffHay(c){return [c.id,c.k,c.q,c.script,(c.follow||[]).map(function(f){return f.join(' ');}).join(' '),c.no,c.esc,c.deep,c.reason].join(' ').toLowerCase();}
function nfc(s){try{return (s||'').normalize('NFC');}catch(e){return s||'';}}
function augment(hay){
  SYN.forEach(function(g){ if(g.some(function(w){return hay.indexOf(w)>-1;})){ g.forEach(function(w){ if(hay.indexOf(w)<0) hay+=' '+w; }); } });
  return hay;
}
var STAFF_HAY=DATA.map(function(c){return nfc(augment(staffHay(c)));});
var FAQ_HAY=FAQ.map(function(f){return nfc(augment((f.q+' '+(f.k||'')+' '+stripHTML(f.a)+' '+(f.note||'')).toLowerCase()));});
var CASE_HAY=CASES.map(function(c){var h=nfc(augment((c.tag+' '+c.title+' '+c.subtitle+' '+c.denialLogic+' '+c.counterPoints.map(function(p){return p.point+' '+p.detail;}).join(' ')+' '+c.evidence.join(' ')+' '+c.laws.join(' ')+' '+c.cumulative+' 거절 지급거절 부지급 삭감 실손').toLowerCase()));return h+' '+h.split(' ').join('');});
var GEN_HAY=GENERATIONS.map(function(g){return nfc(augment((g.g+' '+g.name+' '+g.period+' '+g.burden+' '+g.nonpay+' '+g.renew+' '+g.feat+' '+g.cati+' 실손 세대 보장 자기부담').toLowerCase()));});
var TERM_HAY=INS_TERMS.map(function(t){return nfc(augment((t.t+' '+t.d+' 실손 용어').toLowerCase()));});

/* 문장형/키워드 토크나이저 (조사·물음표·불용어 처리) */
function depunct(s){var p='?!.,~·…()[]{}:;/「」『』“”‘’、。，？！＂｜=+*&^%$#@<>';for(var i=0;i<p.length;i++){s=s.split(p[i]).join(' ');}return s;}
var STOP={'그':1,'저':1,'이':1,'것':1,'수':1,'좀':1,'제':1,'저희':1,'우리':1,'및':1,'등':1,'또':1,'또는':1,'그리고':1,'무엇':1,'뭐':1,'뭔':1,'왜':1,'언제':1,'어디':1,'얼마':1,'어떻게':1,'어떤':1,'어떠':1,'무슨':1,'관해':1,'대해':1,'관련':1,'대한':1,'경우':1,'때':1,'중':1,'시':1,'거':1,'게':1,'건':1,'데':1,'요':1,'은':1,'는':1,'가':1,'을':1,'를':1,'에':1,'의':1,'도':1,'만':1,'로':1,'고':1,'면':1,'나요':1,'인가요':1,'되나요':1,'될까요':1,'있나요':1,'없나요':1,'하나요':1,'할까요':1,'가능':1,'궁금':1,'알려줘':1,'알려':1,'주세요':1,'해줘':1,'되는':1,'하는':1,'인지':1,'있어':1,'있을':1,'받을':1,'받나':1,'하면':1};
var END2=['으로','에서','에게','한테','까지','부터','이나','라도','이라','이는','에는','보다','처럼','만큼','이고','하고','라면','나요','까요','가요','은데','는데','인지','인가','어요','아요','해요','돼요','될까','되나','이야','예요','이에','부턴'];
var END1=['은','는','이','가','을','를','에','의','도','만','로','와','과','나','면','요','고','임','함','서','랑'];
function stemQ(t){var i,j;for(i=0;i<END2.length;i++){if(t.length>=4&&t.slice(-2)===END2[i])return t.slice(0,-2);}for(j=0;j<END1.length;j++){if(t.length>=3&&t.slice(-1)===END1[j])return t.slice(0,-1);}return t;}
function tokenizeQ(raw){var parts=depunct(raw).split(' ').filter(Boolean),out=[];parts.forEach(function(p){if(STOP[p])return;var st=stemQ(p);if(STOP[st]||st.length<2)return;if(out.indexOf(st)<0)out.push(st);});return out;}

function renderSearch(term){
  var raw=nfc((term||'')).toLowerCase().trim();
  var box=document.getElementById('panel-search');
  if(!raw){ box.innerHTML='<p class="modehint">한 번에 검색 — <b>키워드</b>(예: 실비)도, <b>문장</b>(예: 실비 보험 받을 수 있나요?)도 검색됩니다. 같은 주제에 대해 <b>상담원 응대</b>·<b>환자 FAQ</b>·<b>실손 정보</b>·<b>거절 대응</b>을 함께 보여줍니다.</p><div class="searchhint">검색창에 환자 질문이나 키워드를 입력하세요.<br>예: 실비 · 성공률 · 인공관절 · 부작용 · 거절 · 5세대 · 도수치료<br><span style="font-size:12px">문장으로 물어도 됩니다 — 조사·물음표는 자동 처리됩니다.</span></div>'; return; }
  var toks=tokenizeQ(raw);
  if(!toks.length){ toks=raw.split(' ').filter(Boolean); }
  var need=toks.length;
  function sc(hay){var n=0;for(var i=0;i<toks.length;i++){if(hay.indexOf(toks[i])>-1)n++;}return n;}
  function rank(arr,hays,skip){var out=[],i;for(i=0;i<arr.length;i++){if(skip&&skip(arr[i]))continue;var s=sc(hays[i]);if(s>0)out.push({it:arr[i],s:s});}out.sort(function(a,b){return b.s-a.s;});return out;}
  var staffR=rank(DATA,STAFF_HAY,function(c){return c.topic==='실손 거절 대응 · 6슬롯';});
  var faqR=rank(FAQ,FAQ_HAY,null);
  var genR=rank(GENERATIONS,GEN_HAY,null);
  var termR=rank(INS_TERMS,TERM_HAY,null);
  var denR=rank(CASES,CASE_HAY,null);
  var anyFull=[staffR,faqR,genR,termR,denR].some(function(R){return R.some(function(o){return o.s>=need;});});
  function pick(R){if(!R.length)return [];var full=R.filter(function(o){return o.s>=need;});var base=full.length?full:R;return base.slice(0,12).map(function(o){return o.it;});}
  var staffM=pick(staffR), faqM=pick(faqR), genM=pick(genR), termM=pick(termR), denialM=pick(denR);
  var partial=(need>1)&&!anyFull;
  var html='';
  if(!staffM.length && !faqM.length && !genM.length && !termM.length && !denialM.length){ box.innerHTML='<div class="empty" style="display:block">"'+term+'" 검색 결과가 없습니다.<br><span style="font-size:12px;color:var(--faint)">다른 단어로 시도해 보세요(동의어·구어체도 일부 지원).</span></div>'; return; }
  if(partial){ html+='<p class="modehint">입력하신 단어를 모두 포함한 결과가 없어, <b>관련도가 높은 순</b>으로 보여드립니다.</p>'; }
  if(staffM.length){
    html+='<div class="reslabel"><span class="badge staff">🩺 상담원 응대</span><span>'+staffM.length+'건 — 어떻게 답하고 무엇을 피할지</span><span class="ln"></span></div>';
    html+=staffM.map(function(c){return cardHTML(c,true);}).join('');
  }
  if(faqM.length){
    html+='<div class="reslabel"><span class="badge pt">💬 환자 안내·공유</span><span>'+faqM.length+'건 — 환자에게 보낼 답변</span><span class="ln"></span></div>';
    html+=faqM.map(function(f){return faqHTML(f,false);}).join('');
  }
  if(genM.length||termM.length){
    html+='<div class="reslabel"><span class="badge info">📘 실손 정보</span><span>'+(genM.length+termM.length)+'건 — 세대별 특징·용어 (실손정보 탭)</span><span class="ln"></span></div>';
    html+=genM.map(genHTML).join('');
    if(termM.length) html+='<div class="terms">'+termM.map(termHTML).join('')+'</div>';
  }
  if(denialM.length){
    html+='<div class="reslabel"><span class="badge dn">🚨 실손 거절 대응</span><span>'+denialM.length+'건 — 거절 사유별 반박·증거·법적 근거</span><span class="ln"></span></div>';
    html+=denialM.map(caseHTML).join('');
  }
  box.innerHTML=html;
}

 product:tsvg('<rect x="2.5" y="8.5" width="19" height="7" rx="3.5"/><line x1="12" y1="8.5" x2="12" y2="15.5"/>'),

 faq:tsvg('<path d="M20 11.5a7.5 7.5 0 0 1-10.8 6.7L4 20l1.8-5.2A7.5 7.5 0 1 1 20 11.5z"/>'),

};
function faqSub(cat){return FAQ.filter(function(f){return f.cat===cat;}).map(function(f){var t=f.q.length>24?f.q.slice(0,23)+'…':f.q;return {t:t,act:['faq',f.n]};});}

   {t:'비임상 안전성',act:['pacc',2]},
   {t:'임상시험 결과',act:['pacc',3],sub:[{t:'1년 결과(ICRS)',act:['pacc',3]},{t:'5년 결과(VAS·IKDC·WOMAC)',act:['pacc',3]}]},
   {t:'적응증·용량/용법',act:['pacc',4]},
   {t:'수술 방법·재활',act:['pacc',5]},
   {t:'단계별 치료',act:['pacc',6]},
   {t:'제조사(메디포스트)',act:['pacc',7]},
   {t:'공식 제품 설명자료 44p',act:['material','product-deck.html']}
 ]},
 {id:'staff',ic:TICON.staff,t:'상담원 가이드',sub:SECTOR_ORDER.map(function(s){return {t:CATLABEL[s],act:['staff',s]};}).concat([{t:'환자 감정 응대',act:['staff','emo']}])},
 {id:'faq',ic:TICON.faq,t:'상담실 FAQ',sub:(function(){return Object.keys(CATLABEL).filter(function(c){return FAQ.some(function(f){return f.cat===c;});}).map(function(c){return {t:CATLABEL[c],act:['faqcat',c],sub:faqSub(c)};});})()},
 {id:'ptmat',ic:TICON.ptmat,t:'환자 설명자료',sub:[
   {t:'작용 기전',act:['material','material-mechanism.html']},

   {t:'실손 상담 전술',act:['material','material-insurance-playbook.html']}
 ]},
 {id:'denial',ic:TICON.denial,t:'실손정보',sub:[
   {t:'실손 정보 안내',act:['denial','info']},
   {t:'지급거절·클레임',act:['denial','claim']}
 ]},
 {id:'search',ic:TICON.search,t:'통합검색',act:['tab','search']}

function treeNodeHTML(n,lv){
  var has=n.sub&&n.sub.length, attrs=' data-lv="'+lv+'"';
  if(n.id) attrs+=' data-tab="'+n.id+'"';
  if(n.act) attrs+=" data-act='"+JSON.stringify(n.act)+"'";
  var h='<div class="tnode lv'+lv+'"><button class="trow"'+attrs+'>'
   +(n.ic?'<span class="tic">'+n.ic+'</span>':'')+'<span class="tlbl">'+n.t+'</span>'
   +(has?'<span class="tcar">▸</span>':'')+'</button>';
  if(has) h+='<div class="tchildren">'+n.sub.map(function(s){return treeNodeHTML(s,lv+1);}).join('')+'</div>';
  return h+'</div>';
}
function renderTree(){var el=document.getElementById('treeNav'); if(el) el.innerHTML=TREE.map(function(n){return treeNodeHTML(n,1);}).join('');}
function openDrawer(){var b=document.getElementById('treeBar'),k=document.getElementById('treeBackdrop');if(b)b.classList.add('open');if(k)k.classList.add('show');}
function closeDrawer(){var b=document.getElementById('treeBar'),k=document.getElementById('treeBackdrop');if(b)b.classList.remove('open');if(k)k.classList.remove('show');}
function syncTree(name){
  document.querySelectorAll('#treeNav > .tnode').forEach(function(nd){
    var r=nd.querySelector(':scope > .trow'); var on=r&&r.getAttribute('data-tab')===name;
    if(on){ nd.classList.add('open'); }
    else { nd.classList.remove('open'); nd.querySelectorAll('.tnode.open').forEach(function(d){d.classList.remove('open');}); }
  });
  document.querySelectorAll('#treeNav .trow').forEach(function(r){ r.classList.toggle('cur', r.getAttribute('data-tab')===name); });
}
/* 고정 헤더에 가려지지 않도록 헤더 높이만큼 띄워서 스크롤 */
function scrollToEl(el){
  if(!el) return;
  var hd=document.querySelector('header');
  var off=(hd?hd.getBoundingClientRect().height:0)+16;
  var y=el.getBoundingClientRect().top + window.pageYOffset - off;
  window.scrollTo({top:(y<0?0:y), behavior:'smooth'});
}
function treeNav(act){
  if(!act)return; var k=act[0];
  function S(sel){scrollToEl(document.querySelector(sel));}
  if(k==='scroll'){showTab('product');setTimeout(function(){S(act[1]);},70);}
  else if(k==='tab'){showTab(act[1]);}
  else if(k==='pacc'){showTab('product');setTimeout(function(){var l=document.querySelectorAll('#panel-product .pacc'),el=l[act[1]];if(el){el.open=true;setTimeout(function(){scrollToEl(el);},30);}},70);}
  else if(k==='staff'){showTab('staff');setTimeout(function(){S('#panel-staff .sec[data-sec="'+act[1]+'"]');},70);}
  else if(k==='faqcat'){showTab('faq');var c=document.querySelector('#panel-faq .filters .chip[data-f="'+act[1]+'"]');if(c)c.click();}
  else if(k==='faq'){showTab('faq');var a=document.querySelector('#panel-faq .filters .chip[data-f="all"]');if(a)a.click();setTimeout(function(){var el=document.getElementById('faq-'+act[1]);if(el){var d=el.querySelector('details');if(d)d.open=true;setTimeout(function(){scrollToEl(el);},30);}},70);}
  else if(k==='denial'){showTab('denial');var t=document.querySelector('#panel-denial .instile[data-view="'+act[1]+'"]');if(t)t.click();}
  else if(k==='material'){var a=document.querySelector('a[href="'+act[1]+'"]');if(a)a.click();else location.href=act[1];}
}
document.addEventListener('click',function(e){
  var row=e.target.closest&&e.target.closest('#treeNav .trow'); if(!row) return;
  var node=row.closest('.tnode'), kids=node.querySelector(':scope > .tchildren'), willOpen=false;
  if(kids){
    willOpen=!node.classList.contains('open');
    /* 같은 레벨 형제는 닫는다(단일 열림 아코디언) */
    Array.prototype.forEach.call(node.parentNode.children,function(sib){
      if(sib!==node && sib.classList && sib.classList.contains('tnode')){
        sib.classList.remove('open'); sib.querySelectorAll('.tnode.open').forEach(function(d){d.classList.remove('open');});
      }
    });
    if(willOpen){ node.classList.add('open'); }
    else { node.classList.remove('open'); node.querySelectorAll('.tnode.open').forEach(function(d){d.classList.remove('open');}); }
  }
  var tab=row.getAttribute('data-tab'), act=row.getAttribute('data-act');
  if(act){ treeNav(JSON.parse(act)); }
  else if(tab && (!kids || willOpen)){ showTab(tab); }
  if(!kids && window.matchMedia && window.matchMedia('(max-width:999px)').matches) closeDrawer();
});

buildProduct(); buildStaff(); buildFAQ(); buildPtMat(); buildDenial(); renderSearch('');

window.NAV_POP=false; window.ACTIVE_TAB='product';
if(history.replaceState) history.replaceState({tab:'product'},'');
window.addEventListener('popstate',function(e){
  window.NAV_POP=true;
  if(typeof closeDrawer==='function') closeDrawer();
  if(typeof isDocOpen==='function' && isDocOpen()){ if(typeof closeDoc==='function') closeDoc(); window.NAV_POP=false; return; }
  var st=e.state||{}; showTab(st.tab||'product');
  window.NAV_POP=false;
});
syncTree('product');
if(/^#(product|staff|faq|ptmat|search|denial)$/.test(location.hash)){showTab(location.hash.slice(1));}
