<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#15538a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="카티스템 상담">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%2315538a'/><rect x='26' y='9' width='12' height='19' rx='6' fill='%23fff'/><rect x='26' y='36' width='12' height='19' rx='6' fill='%23fff'/><rect x='21' y='28' width='22' height='8' rx='4' fill='%2348c9b0'/></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%2315538a'/><rect x='26' y='9' width='12' height='19' rx='6' fill='%23fff'/><rect x='26' y='36' width='12' height='19' rx='6' fill='%23fff'/><rect x='21' y='28' width='22' height='8' rx='4' fill='%2348c9b0'/></svg>">
<title>카티스템 상담 자료</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ffffff; --bg:#e9edf1; --ink:#15202e; --sub:#5c6775; --faint:#8b95a1; --line:#e4e9ee;
    --a:#2563eb; --a-soft:#eef3ff; --a-bar:#3b74e8;
    --b:#c87214; --b-soft:#fdf4e6; --b-bar:#df8a1d;
    --e:#6354cf; --e-soft:#edeafb; --e-bar:#7a6ae0;
    --ok:#168f57; --ok-soft:#e7f6ef;
    --no:#cf3636; --no-soft:#fdecec;
    --esc:#5a4bd4; --esc-soft:#edeafb;
    --turn:#475569; --turn-soft:#eef1f5;
    --note:#9a6b14; --note-soft:#fbf3df;
    --radius:18px;
    --shadow:0 1px 2px rgba(16,28,44,.06),0 8px 24px rgba(16,28,44,.07);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'IBM Plex Sans KR',sans-serif;
    background:
      radial-gradient(circle at 12% -5%,#f3f6f9 0%,transparent 45%),
      radial-gradient(circle at 100% 0%,#eaf0f6 0%,transparent 40%),
      var(--bg);
    color:var(--ink); line-height:1.6; -webkit-font-smoothing:antialiased; padding:0 0 70px;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  .wrap{max-width:780px;margin:0 auto;}

  header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:16px 20px 12px;}
  .brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
  .brand h1{font-size:18px;font-weight:700;letter-spacing:-.01em;}
  .brand .tag{font-size:11px;font-weight:500;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:#fff;}
  .brand .edumark{font-size:11.5px;font-weight:700;color:#fff;background:var(--brand,#16243B);border:1px solid var(--hair,#C2A36B);border-radius:999px;padding:3px 11px;letter-spacing:.02em;white-space:nowrap;}
  .brand .ver{font-size:11px;color:var(--faint);margin-left:auto;}
  .search{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 16px;transition:border-color .15s,box-shadow .15s;}
  .search:focus-within{border-color:var(--a);box-shadow:0 0 0 4px rgba(37,99,235,.10);}
  .search svg{flex:none;color:var(--faint);}
  .search input{border:0;outline:0;font:inherit;font-size:15px;width:100%;background:transparent;color:var(--ink);}
  .search input::placeholder{color:var(--faint);}
  .search .clr{cursor:pointer;color:var(--faint);font-size:18px;line-height:1;padding:0 2px;display:none;}
  .filters{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap;}
  .chip{font-size:13px;font-weight:500;cursor:pointer;border:1.5px solid var(--line);background:#fff;color:var(--sub);border-radius:999px;padding:6px 14px;transition:all .15s;user-select:none;}
  .chip:hover{border-color:#cfd7df;}
  .chip[data-active="true"]{background:var(--ink);color:#fff;border-color:var(--ink);}
  .chip.a[data-active="true"]{background:var(--a);border-color:var(--a);}
  .chip.b[data-active="true"]{background:var(--b);border-color:var(--b);}
  .chip.emo[data-active="true"]{background:var(--e);border-color:var(--e);}

  main{max-width:780px;margin:22px auto 0;padding:0 20px;}

  /* 황금 규칙 배너 */
  .golden{background:linear-gradient(135deg,#1b2433,#243246);color:#fff;border-radius:var(--radius);padding:18px 22px;margin-bottom:24px;box-shadow:var(--shadow);}
  .golden h2{font-size:14px;font-weight:600;letter-spacing:.02em;display:flex;align-items:center;gap:8px;margin-bottom:4px;}
  .golden .gsub{font-size:12px;color:#aab6c6;margin-bottom:12px;}
  .golden ol{list-style:none;display:grid;gap:9px;}
  .golden li{font-size:13.5px;line-height:1.55;display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:11px;padding:10px 13px;}
  .golden li b{color:#fff;}
  .golden .num{font-family:'IBM Plex Mono',monospace;font-weight:600;color:#7fb0ff;flex:none;}
  .golden .x{color:#ff9c9c;} .golden .o{color:#86e3b3;}

  /* 빠른 이동 */
  .qnav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:22px;}
  .qnav a{font-size:12px;color:var(--sub);text-decoration:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;transition:all .15s;}
  .qnav a:hover{border-color:var(--a);color:var(--a);}

  /* 섹션 헤더 */
  .sec{display:flex;align-items:center;gap:10px;margin:30px 0 14px;scroll-margin-top:150px;}
  .sec .bar{width:4px;height:18px;border-radius:3px;}
  .sec.a .bar{background:var(--a-bar);} .sec.b .bar{background:var(--b-bar);} .sec.emo .bar{background:var(--e-bar);}
  .sec h3{font-size:15px;font-weight:600;letter-spacing:-.01em;}
  .sec .cnt{font-size:11px;color:var(--faint);font-family:'IBM Plex Mono',monospace;}

  /* 실손 6슬롯 인트로 박스 */
  .intro{background:#fff;border:1px solid var(--line);border-left:5px solid var(--b-bar);border-radius:14px;padding:15px 17px;margin-bottom:18px;font-size:13px;color:#5a4a30;line-height:1.62;}
  .intro b{color:var(--b);} .intro .hl{font-weight:600;color:var(--ink);}
  .rtable{width:100%;border-collapse:collapse;margin-bottom:20px;font-size:12.5px;background:#fff;border-radius:12px;overflow:hidden;box-shadow:var(--shadow);}
  .rtable th{background:#f4f6f9;color:var(--sub);font-weight:600;text-align:left;padding:9px 11px;font-size:11.5px;border-bottom:1px solid var(--line);}
  .rtable td{padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:top;color:#3c4651;}
  .rtable tr:last-child td{border-bottom:0;}
  .rtable .s{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--b);}
  .rtable .yes{color:var(--ok);font-weight:600;} .rtable .lo{color:var(--no);font-weight:600;}

  /* 카드 */
  .card{background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px;position:relative;border:1px solid #edf1f5;animation:rise .45s cubic-bezier(.2,.7,.3,1) both;}
  @keyframes rise{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;}
  .card.a::before{background:linear-gradient(var(--a-bar),#5b8ef0);}
  .card.b::before{background:linear-gradient(var(--b-bar),#eaa64a);}
  .card.emo::before{background:linear-gradient(var(--e-bar),#9a8cf0);}
  .chead{padding:18px 22px 14px 26px;border-bottom:1px solid var(--line);}
  .crow{display:flex;align-items:center;gap:9px;margin-bottom:11px;flex-wrap:wrap;}
  .cid{font-size:12px;font-weight:600;letter-spacing:.03em;}
  .card.a .cid{color:var(--a);} .card.b .cid{color:var(--b);} .card.emo .cid{color:var(--e);}
  .mtag{font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;}
  .mtag.a{background:var(--a-soft);color:var(--a);} .mtag.b{background:var(--b-soft);color:var(--b);} .mtag.emo{background:var(--e-soft);color:var(--e);}
  .risk{margin-left:auto;font-size:11px;font-weight:600;color:var(--no);background:var(--no-soft);padding:3px 10px;border-radius:999px;}
  .q{font-size:18px;font-weight:600;letter-spacing:-.01em;line-height:1.45;}
  .q .quote{color:var(--faint);font-weight:400;}
  .reason{margin-top:8px;font-size:12.5px;color:var(--sub);background:#f6f8fa;border:1px solid var(--line);border-radius:9px;padding:7px 11px;}
  .reason b{color:var(--b);font-weight:600;}
  .cbody{padding:6px 22px 16px 26px;}
  .sig{padding:13px 0;border-bottom:1px dashed var(--line);}
  .sig:last-child{border-bottom:0;}
  .slabel{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;margin-bottom:7px;letter-spacing:.01em;}
  .dot{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:12px;flex:none;}
  .ok .dot{background:var(--ok-soft);} .ok .slabel{color:var(--ok);}
  .no .dot{background:var(--no-soft);} .no .slabel{color:var(--no);}
  .esc .dot{background:var(--esc-soft);} .esc .slabel{color:var(--esc);}
  .turn .dot{background:var(--turn-soft);} .turn .slabel{color:var(--turn);}
  .script{background:var(--ok-soft);border-radius:12px;padding:13px 15px;font-size:15px;line-height:1.62;color:#13352a;border:1px solid #d4ecdf;}
  .qa{font-size:13.5px;color:var(--sub);margin:5px 0;}
  .qa b{color:var(--ink);font-weight:600;}
  .nolist{font-size:14px;color:#7d2b2b;background:var(--no-soft);border-radius:10px;padding:11px 14px;border:1px solid #f4d3d3;}
  .esctext{font-size:14px;color:#3b3470;background:var(--esc-soft);border-radius:10px;padding:11px 14px;border:1px solid #ddd7f5;}
  .esctext b{font-weight:600;}
  .note{margin-top:12px;background:var(--note-soft);border:1px solid #f0e0b8;border-radius:10px;padding:11px 14px;}
  .note .nl{font-size:11px;font-weight:700;color:var(--note);letter-spacing:.02em;margin-bottom:4px;}
  .note p{font-size:12.5px;color:#6b4f12;line-height:1.55;}
  .more{margin-top:12px;}
  .more summary{cursor:pointer;list-style:none;font-size:12px;font-weight:600;color:var(--sub);display:flex;align-items:center;gap:7px;padding:9px 13px;border-radius:10px;background:#f3f6f9;border:1px solid var(--line);transition:background .15s;user-select:none;}
  .more summary::-webkit-details-marker{display:none;}
  .more summary:hover{background:#eaeff4;}
  .more summary .ar{margin-left:auto;transition:transform .2s;font-size:11px;color:var(--faint);}
  .more[open] summary .ar{transform:rotate(90deg);}
  .more .mc{font-size:13px;color:#46505c;line-height:1.62;padding:12px 14px 4px;}
  .more .mc b{color:var(--ink);font-weight:600;}
  .deep{margin-top:12px;border:1px solid var(--line);border-left:3px solid #94a3b8;border-radius:10px;background:#f7f9fb;padding:11px 14px;}
  .deep .dl{font-size:11px;font-weight:700;color:#475569;letter-spacing:.04em;margin-bottom:6px;}
  .deep .mc{font-size:13px;color:#46505c;line-height:1.64;}
  .deep .mc b{color:var(--ink);font-weight:600;}

  /* 부록 (라우팅/만능문장) */
  .appx{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px 22px;margin-bottom:18px;box-shadow:var(--shadow);}
  .appx h4{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
  .magic{display:grid;gap:9px;}
  .magic div{font-size:13.5px;background:#f6f8fa;border:1px solid var(--line);border-radius:10px;padding:10px 13px;line-height:1.55;}
  .magic .mk{font-weight:600;color:var(--a);}

  footer{max-width:780px;margin:26px auto 0;padding:0 20px;}
  .disc{font-size:11.5px;color:var(--faint);line-height:1.7;border-top:1px solid var(--line);padding-top:16px;}
  .disc b{color:var(--sub);}
  .empty{text-align:center;color:var(--faint);font-size:14px;padding:48px 0;display:none;}
  .hide{display:none !important;}


body{padding-bottom:78px}
header .brand h1{font-size:22px}
.appbar{display:flex;align-items:center;gap:10px}
.modehint{font-size:12px;color:var(--sub);margin:2px 0 16px}
.panel{display:none} .panel.active{display:block}
#view{max-width:780px;margin:18px auto 0;padding:0 20px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;border:0;background:transparent;padding:8px 4px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--faint);font:inherit;font-size:11px;font-weight:600;cursor:pointer;transition:color .15s}
.tabbar button .ic{font-size:19px;line-height:1}
.tabbar button .tsub{font-size:8.5px;font-weight:500;line-height:1;margin-top:1px;opacity:.75}
.tabbar button[data-active="true"]{color:var(--a)}
.tabbar button[data-active="true"].b{color:var(--b)}
.tabbar button[data-active="true"].r{color:var(--no)}
.tabbar button[data-active="true"].g{color:var(--ok)}
.tabbar button[data-active="true"].p{color:#0d7490}
/* 활성 탭 강조: 색 + 연한 배경 + 상단 인디케이터(현재 위치 표시) */
.tabbar button{font-size:10.5px;padding:10px 2px 8px;position:relative;margin:0 1px;transition:color .15s,background .18s}
.tabbar button[data-active="true"]{background:var(--a-soft)}
.tabbar button[data-active="true"].p{background:#e0f2f7}
.tabbar button[data-active="true"].b{background:var(--b-soft)}
.tabbar button[data-active="true"].g{background:var(--ok-soft)}
.tabbar button[data-active="true"].r{background:var(--no-soft)}
.tabbar button[data-active="true"]::before{content:"";position:absolute;top:2px;left:50%;transform:translateX(-50%);width:22px;height:3px;border-radius:3px;background:currentColor}
.tabbar button .ic{font-size:18px}
.tabbar button .tsub{font-size:8px}
@media(max-width:380px){.tabbar button{font-size:9.5px} .tabbar button .ic{font-size:16px}}

/* 제품정보 패널 */
.pwrap{}
.phero{background:linear-gradient(135deg,#0c2a3a,#10485e);color:#fff;border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.phero .pb{display:inline-block;font-size:10.5px;font-weight:700;color:#a9e2f0;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:3px 10px;margin-bottom:9px}
.phero h2{font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.35}
.phero p{font-size:12.5px;color:#bcd5e0;margin-top:7px;line-height:1.6}
.pfacts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px}
@media(max-width:520px){.pfacts{grid-template-columns:1fr}}
.pfact{background:#fff;border:1px solid var(--line);border-left:4px solid #0e8aaa;border-radius:12px;padding:11px 13px;box-shadow:var(--shadow)}
.pfact .fl{font-size:10.5px;font-weight:700;color:#0d7490;letter-spacing:.02em}
.pfact .fv{font-size:13.5px;font-weight:600;color:var(--ink);margin-top:3px;line-height:1.5}
.pfact .fv b{color:#0d7490}
.pacc{background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
.pacc>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 16px;font-size:14.5px;font-weight:700}
.pacc>summary::-webkit-details-marker{display:none}
.pacc>summary .pi{font-size:17px}
.pacc>summary .ar{margin-left:auto;font-size:12px;color:var(--faint);transition:transform .2s}
.pacc[open]>summary .ar{transform:rotate(90deg)}
.pacc .pin{padding:2px 16px 15px}
.pacc .row{font-size:13px;color:#3c4651;line-height:1.62;padding:6px 0 6px 15px;position:relative;border-top:1px dashed #eef2f6}
.pacc .row:first-child{border-top:0}
.pacc .row::before{content:"•";position:absolute;left:2px;color:#0e8aaa;font-weight:700}
.pacc .row b{color:var(--ink);font-weight:600}
.pacc .row .k{display:inline-block;min-width:84px;color:var(--faint);font-weight:600}
.dosetbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
.dosetbl th{background:#eaf4f7;color:#0d7490;font-weight:700;text-align:left;padding:7px 9px;font-size:11.5px;border-bottom:1px solid var(--line)}
.dosetbl td{padding:7px 9px;border-bottom:1px solid var(--line);color:#3c4651}
.dosetbl tr:last-child td{border-bottom:0}
.dosetbl .v{font-family:'IBM Plex Mono',monospace;font-weight:600;color:#0d7490}
.pdeckbtn{display:flex;align-items:center;gap:13px;text-decoration:none;color:inherit;background:linear-gradient(135deg,#0d7490,#0e8aaa);border-radius:14px;padding:15px 17px;box-shadow:var(--shadow);margin:6px 0 16px}
.pdeckbtn .di{font-size:26px}
.pdeckbtn .dt{color:#fff}
.pdeckbtn .dt b{font-size:15px;font-weight:700;display:block}
.pdeckbtn .dt span{font-size:12px;color:#cdeaf2}
.pdeckbtn .dar{margin-left:auto;color:#fff;font-size:18px}
.prelink{display:grid;gap:8px;margin-bottom:6px}
.prl{display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 14px;box-shadow:var(--shadow);transition:border-color .15s}
.prl:hover{border-color:#bce3ee}
.prl .ri{font-size:18px}
.prl .rt{font-size:13.5px;font-weight:600}
.prl .rs{font-size:11.5px;color:var(--faint);margin-top:1px}
.prl .rar{margin-left:auto;color:#0d7490;font-size:14px}
.pdisc{font-size:11.5px;color:var(--faint);line-height:1.7;background:#f7f9fb;border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-top:8px}
.pdisc b{color:var(--sub)}

/* 환자 상담 시각자료 (의료진용) 갤러리 */
.pmintro{background:linear-gradient(#ecf8f1,#fff);border:1px solid #cfe9da;border-left:5px solid var(--ok);border-radius:14px;padding:14px 16px;margin-bottom:8px}
.pmintro .pmh{font-size:13px;font-weight:700;color:var(--ok);margin-bottom:6px;display:flex;align-items:center;gap:7px}
.pmintro .pmb{font-size:13px;color:#28453a;line-height:1.66}
.pmintro .pmb b{color:#13352a;font-weight:600}
.pmgrid{display:grid;gap:13px;margin-top:6px}
.pmcard{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid #e6ecf2;border-radius:16px;box-shadow:var(--shadow);overflow:hidden;animation:rise .4s cubic-bezier(.2,.7,.3,1) both;transition:transform .15s,box-shadow .15s,border-color .15s}
.pmcard:hover{transform:translateY(-2px);border-color:#bfe3cf;box-shadow:0 10px 26px -10px rgba(22,143,87,.4)}
.pmcard:active{transform:scale(.99)}
.pmthumb{height:108px;background-size:cover;background-position:center;position:relative;border-bottom:1px solid #eef2f6}
.pmthumb .pmnum{position:absolute;left:12px;top:12px;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:12px;color:#fff;background:rgba(20,32,46,.62);backdrop-filter:blur(3px);padding:4px 10px;border-radius:999px}
.pmthumb .pmtag{position:absolute;right:12px;top:12px;font-size:10.5px;font-weight:700;color:#fff;background:rgba(22,143,87,.92);padding:4px 10px;border-radius:999px}
.pmbody{padding:13px 16px 15px}
.pmtitle{font-size:16px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.pmtitle .arr{margin-left:auto;color:var(--ok);font-size:15px}
.pmdesc{font-size:12.5px;color:var(--sub);line-height:1.6;margin-top:6px}
.pmmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pmmeta span{font-size:11px;color:#46505c;background:#f3f6f9;border:1px solid var(--line);border-radius:8px;padding:4px 9px}
.badge{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;margin-bottom:8px}
.badge.staff{background:var(--a-soft);color:var(--a)} .badge.pt{background:var(--b-soft);color:var(--b)}
.hot{font-size:10.5px;font-weight:700;color:#b5450e;background:#fde7d3;border:1px solid #f6cda6;padding:2px 8px;border-radius:999px}
.faq{background:#fff;border:1px solid var(--line);border-left:5px solid var(--b-bar);border-radius:16px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;animation:rise .4s cubic-bezier(.2,.7,.3,1) both}
.faq details{display:block}
.faq summary{list-style:none;display:flex;gap:11px;align-items:flex-start;padding:15px 16px;cursor:pointer}
.faq summary::-webkit-details-marker{display:none}
.faq .num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--b-soft);color:var(--b);display:grid;place-items:center;font-weight:700;font-size:13px;font-family:'IBM Plex Mono',monospace;margin-top:1px}
.faq .qt{flex:1;min-width:0}
.faq .ctag{display:inline-block;font-size:10.5px;font-weight:700;color:var(--b);background:var(--b-soft);border-radius:999px;padding:2px 8px;margin-bottom:5px}
.faq .qx{font-size:15.5px;font-weight:600;line-height:1.45;letter-spacing:-.01em}
.faq .ar{flex:none;color:var(--faint);font-size:13px;margin-top:4px;transition:transform .2s}
.faq details[open] .ar{transform:rotate(90deg)}
.faq .ans{border-top:1px solid #eef2f7;padding:14px 16px 16px;color:#334155;font-size:15px;line-height:1.65}
.faq .ans p{margin:0 0 10px} .faq .ans p:last-child{margin:0}
.faq .ans b{color:#0f2747;font-weight:600}
.url{color:#0052a3;word-break:break-all;font-size:13px}
.faq .ptnote{margin:12px 16px 0;background:var(--note-soft);border:1px solid #f0e0b8;border-radius:10px;padding:10px 13px}
.faq .ptnote .nl{font-size:10.5px;font-weight:700;color:var(--note);margin-bottom:3px}
.faq .ptnote p{font-size:12px;color:#6b4f12;line-height:1.55;margin:0}
.faq .copyrow{display:flex;justify-content:flex-end;gap:8px;padding:0 16px 15px}
.faq .copy{border:1px solid var(--b);background:var(--b-soft);color:var(--b);border-radius:11px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer}
.faq .copy:active{transform:scale(.97)}
.toast{position:fixed;left:16px;right:16px;bottom:92px;z-index:60;background:var(--ink);color:#fff;border-radius:14px;padding:13px;text-align:center;font-weight:700;font-size:14px;opacity:0;transform:translateY(12px);pointer-events:none;transition:.25s}
.toast.show{opacity:1;transform:none}
.searchhint{color:var(--faint);font-size:13px;text-align:center;padding:30px 10px}
.reslabel{font-size:12px;font-weight:700;color:var(--sub);margin:18px 0 10px;display:flex;align-items:center;gap:7px}
.reslabel .ln{flex:1;height:1px;background:var(--line)}
.know{background:linear-gradient(#f2f7fe,#fff);border:1px solid #d7e6fb;border-left:5px solid var(--a-bar);border-radius:14px;padding:13px 16px;margin:0 0 14px}
.know .kh{font-size:12px;font-weight:700;color:var(--a);margin-bottom:6px;letter-spacing:.01em}
.know .kb{font-size:13px;color:#33415a;line-height:1.66}
.know .kb b{color:#12294b;font-weight:600}
.badge.dn{background:var(--no-soft);color:var(--no)}
.badge.info{background:#e1f0f4;color:#0e7490}
.mtag.obj{background:#fdeede;color:#c2570c}
.stagebar{display:flex;align-items:flex-start;gap:9px;border-radius:12px;padding:10px 13px;margin-bottom:13px}
.stagebar .sb-ic{font-size:16px;line-height:1.3;flex:none}
.stagebar .sb-t{font-size:12.5px;line-height:1.55}
.stagebar.st{background:var(--b-soft);border:1px solid #d6e4f0}
.stagebar.st .sb-t,.stagebar.st .sb-t b{color:var(--b)}
.stagebar.pt{background:var(--ok-soft);border:1px solid #d4ecdf}
.stagebar.pt .sb-t{color:#1f4a3a}
.stagebar.pt .sb-t b{color:#13352a}
/* 검색 결과: 상담원 카드 접힘(환자 FAQ와 동일한 스캔 리듬) */
.card details.cwrap>summary{list-style:none;cursor:pointer;display:block;position:relative;border-bottom:1px solid var(--line);}
.card details.cwrap>summary::-webkit-details-marker{display:none;}
.card details.cwrap>summary .car{position:absolute;right:18px;top:18px;color:var(--faint);font-size:14px;transition:transform .2s;}
.card details.cwrap[open]>summary{border-bottom:1px solid var(--line);}
.card details.cwrap[open]>summary .car{transform:rotate(90deg);}
.card details.cwrap>summary .q{font-size:15.5px;padding-right:18px;}
/* 적응증 요약 */
.indik{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
@media(max-width:560px){.indik{grid-template-columns:repeat(2,1fr)}}
.ind{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px 10px;text-align:center;box-shadow:var(--shadow)}
.ind .ii{font-size:22px;line-height:1}
.ind .il{font-size:11px;color:var(--faint);margin-top:5px}
.ind .iv{font-size:14px;font-weight:700;color:var(--b);margin:2px 0 5px}
.ind .idt{font-size:11px;color:var(--sub);line-height:1.45}
/* 대응 절차 */
.steps{margin-bottom:22px}
.stp{display:flex;gap:12px;padding-bottom:14px;position:relative}
.stp:not(:last-child)::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.stn{flex:none;width:28px;height:28px;border-radius:50%;background:var(--b);color:#fff;display:grid;place-items:center;font-size:9px;font-weight:700;font-family:'IBM Plex Mono',monospace;z-index:1;text-align:center;line-height:1.1}
.stc{flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 13px;box-shadow:var(--shadow)}
.stt{font-size:14px;font-weight:600}
.std{font-size:12.5px;color:var(--sub);line-height:1.5;margin-top:2px}
.stday{font-size:11px;color:var(--b);font-weight:600;margin-top:5px}
/* 거절 케이스 카드 */
.case{background:#fff;border:1px solid #edf1f5;border-left:5px solid var(--cc,var(--b-bar));border-radius:16px;box-shadow:var(--shadow);margin-bottom:13px;overflow:hidden;animation:rise .4s cubic-bezier(.2,.7,.3,1) both}
.case>details>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:flex-start;gap:10px}
.case>details>summary::-webkit-details-marker{display:none}
.chead2{flex:1;min-width:0}
.chead2 .crow{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.ctag2{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:12px;color:var(--cc)}
.sev{font-size:10px;color:#cf3636;letter-spacing:1px}
.wr{margin-left:auto;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.ctitle{font-size:15px;font-weight:700;line-height:1.42;letter-spacing:-.01em}
.csub{font-size:12.5px;color:var(--sub);margin-top:4px;line-height:1.45}
.car{flex:none;color:var(--faint);font-size:14px;margin-top:4px;transition:transform .2s}
.case>details[open] .car{transform:rotate(90deg)}
.cbody2{padding:2px 16px 16px}
.deny{background:var(--no-soft);border:1px solid #f4d3d3;border-radius:11px;padding:11px 13px;margin:8px 0 4px;font-size:13.5px;color:#7d2b2b;line-height:1.6}
.deny .dl{display:block;font-size:10.5px;font-weight:700;color:var(--no);margin-bottom:4px;letter-spacing:.02em}
.bl{display:block;font-size:12px;font-weight:700;color:var(--ink);margin:15px 0 8px}
.cps .cp{background:var(--ok-soft);border:1px solid #d4ecdf;border-radius:11px;padding:10px 12px;margin-bottom:8px}
.cpp{font-size:13.5px;font-weight:600;color:#13352a;line-height:1.5}
.cpd{font-size:12.5px;color:#3c5247;line-height:1.62;margin-top:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipx{font-size:11.5px;background:#f3f6f9;border:1px solid var(--line);border-radius:8px;padding:5px 9px;color:#46505c;line-height:1.4}
.chipx.law{background:var(--esc-soft);border-color:#ddd7f5;color:var(--esc)}
.strat{background:var(--note-soft);border:1px solid #f0e0b8;border-radius:11px;padding:11px 13px;margin-top:15px;font-size:13px;color:#6b4f12;line-height:1.62}
.strat .bl{color:var(--note);margin-top:0}
/* 실손 정보 대시보드 */
.insdash{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.instile{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;cursor:pointer;box-shadow:var(--shadow);transition:all .18s;font-family:inherit}
.instile .iti{font-size:20px}
.instile .itt{font-size:14px;font-weight:700;color:var(--ink)}
.instile .its{font-size:11px;color:var(--faint);line-height:1.4}
.instile.active{border-color:var(--b);background:var(--b-soft);box-shadow:0 4px 14px -6px var(--b)}
.instile.active .itt{color:var(--b)}
.insview{display:none}
.insview.active{display:block;animation:rise .35s cubic-bezier(.2,.7,.3,1) both}
.subnote{font-size:12.5px;color:var(--sub);line-height:1.6;background:#f7f9fb;border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:14px}
/* 세대별 카드 */
.genc{background:#fff;border:1px solid #edf1f5;border-left:5px solid var(--cc);border-radius:15px;padding:14px 15px;box-shadow:var(--shadow);margin-bottom:11px;animation:rise .4s cubic-bezier(.2,.7,.3,1) both}
.gh{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.gg{font-size:17px;font-weight:800;letter-spacing:-.02em}
.gp{font-size:11.5px;color:var(--faint);font-family:'IBM Plex Mono',monospace}
.gn{font-size:13px;font-weight:600;color:var(--sub);margin:1px 0 9px}
.grow{display:flex;gap:8px;font-size:12.5px;padding:3px 0;border-top:1px dashed #eef2f6}
.gl{flex:none;width:74px;color:var(--faint);font-weight:600}
.gv{flex:1;color:var(--ink);line-height:1.5}
.gfeat{font-size:12px;color:var(--sub);line-height:1.6;margin-top:9px;padding-top:9px;border-top:1px solid #f0f3f6}
.gcati{font-size:12px;color:#155e44;background:var(--ok-soft);border:1px solid #d4ecdf;border-radius:9px;padding:8px 10px;margin-top:9px;line-height:1.55}
/* 용어 미니사전 */
.terms{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.term{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 13px;box-shadow:var(--shadow)}
.term .tt{font-size:13.5px;font-weight:700;color:var(--b)}
.term .td{font-size:12.5px;color:var(--sub);line-height:1.58;margin-top:3px}
/* 헤더 도구(인쇄·글자크기) */
.tools{display:flex;gap:6px;align-self:center;margin-left:auto}
.tbtn{font-family:inherit;font-size:12.5px;font-weight:500;border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:9px;padding:5px 9px;cursor:pointer;line-height:1;white-space:nowrap}
.tbtn:hover{background:#f3f6f9;color:var(--ink)}
/* 인쇄 */
@media print{
  header .search,.tools,nav.tabbar,.toast,.car,.stagebar{display:none !important}
  header{position:static;backdrop-filter:none}
  #view{zoom:1 !important;max-width:100% !important;margin:0 !important;padding:0 !important}
  .panel:not(.active){display:none}
  details>*{display:block !important}
  details>summary{cursor:default}
  .card,.faq,.case,.genc,.know,.term{break-inside:avoid;box-shadow:none}
}


/* ===== PREMIUM SKIN · quiet luxury medical (override, appended) ===== */
:root{
  --ink:#14181D; --paper:#FBFAF8; --bg:#F1EDE7; --sub:#565D64; --faint:#6A7079;
  --line:rgba(20,24,29,.10);
  --brand:#16243B; --navy:#16243B; --hair:#C2A36B;
  --accent:#7C5E2E; --accent-soft:#F3ECDD; --accent-bar:#B9975B;
  --a:#16243B; --a-bar:#26304A; --a-soft:#ECEFF3;
  --b:#7E5F2E; --b-bar:#B9975B; --b-soft:#F4EEE1;
  --e:#3B4252; --e-bar:#4A5160; --e-soft:#EDEEF1;
  --ok:#3F6B57; --ok-soft:#E9EFEB;
  --no:#A8392F; --no-soft:#F6EAE7;
  --staff:#16243B; --staff-soft:#ECEFF3; --warn:#8A6A39; --warn-soft:#F4EEE1;
  --teal:#16243B; --esc:#3B4252; --esc-soft:#EDEEF1; --turn:#565D64; --turn-soft:#EEEEEC;
  --note:#8A6A39; --note-soft:#F4EEE1;
  --radius:16px;
  --shadow:0 1px 2px rgba(20,24,29,.05),0 14px 34px -16px rgba(20,24,29,.16);
}
body{
  font-family:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  background:
    radial-gradient(55rem 55rem at 108% -12%, #F8F3EB 0%, transparent 55%),
    radial-gradient(48rem 48rem at -12% -4%, #F6F1E9 0%, transparent 52%),
    var(--bg);
}
h1,h2,h3,.brand h1,.hero h1,.phero h2{ font-family:'Noto Serif KR','Nanum Myeongjo',serif; letter-spacing:-.02em; font-weight:600; }
.mono,.ver,.pg,.gp,.cnt,.s,.stn{ font-variant-numeric:tabular-nums; }
::selection{ background:rgba(185,151,91,.25); }
button,a,.tile,.pmcard,.mcard,.instile,.prl,.card,.faq{ transition:color .18s ease,background .18s ease,border-color .18s ease,box-shadow .18s ease,transform .18s ease; }
@media (prefers-reduced-motion: reduce){ *{ transition:none!important; animation:none!important; scroll-behavior:auto!important; } }

/* 헤더 글래스(랜딩 히어로 header.hero는 제외) */
header:not(.hero){ background:rgba(251,250,248,.82)!important; border-bottom:1px solid var(--line)!important; box-shadow:0 1px 0 rgba(185,151,91,.18); }

/* 골든룰/핵심 메시지/히어로 — 딥네이비 */
.golden,.phero,.keymsg,.usenote{ background:linear-gradient(135deg,#101826,#1C2C46)!important; border:1px solid rgba(185,151,91,.18); }
.pdeckbtn{ background:linear-gradient(135deg,#16243B,#23364F)!important; }

/* 하단 탭바 — 네이비 1색 + 샴페인 언더라인 */
.tabbar{ background:rgba(251,250,248,.9)!important; border-top:1px solid var(--line)!important; -webkit-backdrop-filter:saturate(140%) blur(12px); backdrop-filter:saturate(140%) blur(12px); }
.tabbar button{ color:var(--faint); }
.tabbar button[data-active="true"],
.tabbar button[data-active="true"].b,.tabbar button[data-active="true"].g,
.tabbar button[data-active="true"].r,.tabbar button[data-active="true"].p{ color:var(--ink)!important; background:transparent!important; }
.tabbar button[data-active="true"]::before{ background:var(--accent-bar)!important; width:26px!important; height:2px!important; top:0!important; }

/* 제품정보 히어로/스펙 */
.phero .pb{ color:#E7D6B0!important; background:rgba(185,151,91,.14)!important; border-color:rgba(185,151,91,.34)!important; }
.pfact{ border-left:2px solid var(--accent-bar)!important; }
.pfact .fl{ color:var(--accent)!important; } .pfact .fv b{ color:var(--brand)!important; }
.pmthumb .pmtag{ background:rgba(22,36,59,.92)!important; }
.pmcard:hover,.prl:hover,.tile:hover,.instile:hover{ border-color:var(--hair)!important; }

/* 섹션 바 — 샴페인 */
.sec .bar,.seclabel .bar{ background:var(--accent-bar)!important; }

/* 배지(브론즈 텍스트, AA) */
.hero .badge,.pmintro .pmh,.legend .ll,.feature .fl{ color:var(--accent)!important; }

/* 이미지 액자(임상사진 색 변형 없음 — 프레이밍만) */
.slide{ border:1px solid var(--line)!important; box-shadow:var(--shadow)!important; border-radius:14px; }
.casec,.trial{ border-radius:16px; }

/* 공식자료 목차 활성칩 — 네이비(대비 AA) */
.toc a.active{ background:var(--brand)!important; color:#fff!important; border-color:var(--brand)!important; box-shadow:0 2px 10px -3px rgba(22,36,59,.5)!important; }

/* 랜딩 — 샴페인 액센트 1색 */
.tile::before{ background:var(--accent-bar)!important; }
.tile .tt{ color:var(--brand); }
.mcard .ic{ background:#F1ECE2!important; }
.cta{ box-shadow:0 10px 26px -10px rgba(0,0,0,.5),0 0 0 1px rgba(185,151,91,.4)!important; }

/* 라인 SVG 아이콘 크기 */
.tabbar .ic svg.nic{ width:21px; height:21px; display:block; margin:0 auto; }
.tile .ic svg.nic{ width:24px; height:24px; }
.mcard .ic svg.nic{ width:22px; height:22px; }

/* 인쇄 — 레터헤드 톤 */
@media print{
  header,.tabbar,nav.tabbar,.search,.tools,#docview{ display:none!important; }
  body{ background:#fff!important; }
  .golden,.phero,.keymsg,.pdeckbtn,.usenote{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
}


/* ===== 좌측 로직 트리 메뉴 (대주제 → 중주제 → 소주제) ===== */
.menubtn{display:inline-flex;align-items:center;justify-content:center;align-self:center;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;flex:none}
.menubtn:hover{background:var(--accent-soft)}
.treebackdrop{position:fixed;inset:0;background:rgba(16,24,40,.42);z-index:59;opacity:0;pointer-events:none;transition:opacity .2s}
.treebackdrop.show{opacity:1;pointer-events:auto}
.treebar{position:fixed;top:0;left:0;bottom:0;width:300px;max-width:86vw;background:var(--paper);border-right:1px solid var(--line);z-index:60;display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .24s cubic-bezier(.4,0,.2,1);box-shadow:0 20px 50px -20px rgba(16,24,40,.45)}
.treebar.open{transform:none}
.treehd{position:relative;padding:18px 18px 14px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,#101826,#1C2C46);color:#fff}
.treehd .treettl{font-family:'Noto Serif KR','Nanum Myeongjo',serif;font-size:18px;font-weight:600;letter-spacing:-.01em}
.treehd .treesub{margin-top:8px}
.treehd .treemark{font-size:10.5px;font-weight:700;color:#fff;background:rgba(185,151,91,.22);border:1px solid rgba(185,151,91,.55);border-radius:999px;padding:3px 10px;letter-spacing:.02em}
.treeclose{position:absolute;right:12px;top:12px;width:30px;height:30px;border-radius:8px;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:13px;cursor:pointer}
.treenav{flex:1;overflow-y:auto;padding:10px 10px 28px;-webkit-overflow-scrolling:touch}
.trow{width:100%;display:flex;align-items:center;gap:10px;padding:11px 12px;border:0;background:transparent;border-radius:10px;font:inherit;font-size:15.5px;font-weight:600;color:var(--ink);cursor:pointer;text-align:left;line-height:1.35}
.trow:hover{background:var(--accent-soft)}
.trow.cur{background:var(--accent-soft);color:var(--brand);font-weight:700}
.trow .tic{flex:none;width:20px;height:20px;color:var(--brand)}
.trow .tic svg{width:20px;height:20px;display:block}
.trow .tlbl{flex:1;min-width:0}
.trow .tcar{flex:none;font-size:10px;color:var(--faint);transition:transform .18s}
.tnode.open>.trow .tcar{transform:rotate(90deg)}
.tchildren{display:none;margin:1px 0 3px}
.tnode.open>.tchildren{display:block}
.tnode.lv2>.trow{font-size:14px;font-weight:500;color:var(--sub);padding-left:38px}

{id:'A-1-7',mod:'a',topic:'제품 정보 & 시술',k:'뭐부터 시작 절차 예약 검사 순서 어떻게',
 q:'"뭐부터 해야 해요?" (시작 절차)',
 script:`먼저 <b>진료 예약</b>을 잡으시면, 무릎 상태 확인을 위한 <b>검사(MRI 등)</b>를 진행하고, 그 결과로 <b>의사 선생님이 카티스템 적합 여부를 판단</b>하십니다. 적합하면 시술·입원·재활 일정을 안내받으십니다. 지금 진료 예약 도와드릴까요?`,
 follow:[['검사부터 돈 들어요?','검사 비용은 항목에 따라 다르므로 예약 시 안내드리겠습니다. [본원 검사 비용 확인]']],
 no:`"검사 안 해도 돼요" · 적합 여부 사전 단정`,
 esc:`검사 종류·판독 → 의료진 / 예약·수납 → 원무`,
 deep:`이 카드는 상담의 '관문' 카드. 막연한 문의를 진료 예약으로 안전하게 전환시키고 적합성 판정을 의사에게 넘기는 표준 경로.`},

/* ===== 줄기세포의 이해 ===== */
{id:'A-2-1',mod:'a',topic:'줄기세포의 이해',k:'줄기세포 무엇 종류 배아 성체 제 세포',
 q:'"줄기세포가 뭐예요? 종류가 있나요?"',
 script:`줄기세포는 우리 몸의 여러 조직으로 자랄 수 있는 '기본 세포'입니다. 크게 <b>배아줄기세포, 성체줄기세포, 역분화(유도만능)줄기세포</b>로 나뉘는데, 카티스템에 쓰이는 건 <b>제대혈에서 얻은 성체 줄기세포(중간엽 줄기세포)</b>입니다.`,
 follow:[['제 세포를 쓰는 거예요?','아니요, <b>다른 사람의 제대혈에서 얻은 세포(동종)</b>를 사용합니다. 내 조직을 떼어낼 필요 없이 한 번에 시술합니다.']],
 no:`종교·윤리 논쟁 단정 · "배아줄기세포보다 우월" 비교 단정`,
 esc:`세포 분화·작용기전 심화 → <b>의료진</b>`,
 deep:`중간엽 줄기세포(MSC)는 연골·뼈·지방 등으로 분화 가능한 성체 줄기세포. 제대혈 MSC는 비교적 '어린' 세포라 재생능이 좋고, 출산 시 폐기되는 제대혈 기반이라 윤리적 부담이 적다는 점이 특징(사실 설명용, 우열 단정 금지).`},

{id:'A-2-2',mod:'a',topic:'줄기세포의 이해',k:'제대혈 장점 단점 좋은점 나쁜점',
 q:'"제대혈 줄기세포의 장점/단점은?"',
 script:`<b>장점</b>은 ① 내 몸에서 세포를 떼어낼 필요가 없어 한 번에 끝나고, ② 비교적 어린 세포라 재생 능력이 좋다는 점입니다. <b>고려사항</b>은 ① 비급여라 비용 부담이 있고, ② 모든 단계의 관절염에 쓰는 건 아니며, ③ 효과에 개인차가 있다는 점입니다. 적합 여부는 검사 후 의사 선생님이 판단합니다.`,
 no:`"단점이 전혀 없다" · "부작용 없는 천연 치료"`,
 esc:`면역·안전성 세부 → <b>의료진</b>`,
 deep:`동종 사용 가능 = 대량 생산·표준화 가능 → '기성품'처럼 바로 시술(자가세포는 배양 대기). 단점 축엔 '비용'과 '적응증 제한'을 균형 있게 제시.`},

{id:'A-2-3',mod:'a',topic:'줄기세포의 이해',k:'거부반응 남의 세포 동종 면역',
 q:'"남의 세포인데 거부반응 없나요?"',
 script:`제대혈 유래 중간엽 줄기세포는 면역 거부반응이 상대적으로 낮은 것으로 알려져 동종(타인) 세포로도 사용됩니다. 다만 부작용 가능성을 0으로 단정할 수는 없어, 시술 전 의료진이 안전성과 주의사항을 직접 안내드립니다.`,
 no:`"거부반응 절대 없음" · "100% 안전"`,
 esc:`본인 면역질환·알레르기 이력 → <b>의료진</b>`,
 deep:`MSC는 면역원성이 낮은 세포로 알려져 동종 이식이 가능. 단 '낮다'와 '없다'는 다름 — 환자에겐 항상 '낮은 편'까지만.`},

/* ===== 퇴행성 관절염 ===== */
{id:'A-3-1',mod:'a',topic:'퇴행성 관절염',k:'단계 받을 수 있나 적합 몇기 가능',risk:'적응증 판정 금지',
 q:'"제 무릎이 카티스템 받을 수 있는 단계인가요?"',
 script:`카티스템은 <b>퇴행성·외상성 골관절염으로 인한 무릎 연골결손</b>에 사용하도록 허가된 치료제입니다. <b>적합 단계인지는 영상검사(MRI 등)와 진료로 의사 선생님이 판단</b>하셔야 정확합니다. 진료 예약 도와드릴까요?`,
 follow:[['저는 몇 기예요?','단계는 검사 결과로 의사 선생님이 진단하십니다. 상담원이 판정해 드릴 수는 없어요.'],['너무 심하면 못 받나요?','말기로 손상이 큰 경우 다른 치료가 고려될 수 있고, 이 판단도 진료에서 이뤄집니다.']],
 no:`"받으시면 돼요/안 돼요" (상담원 적응증 판정 = 무면허 의료행위 소지)`,
 esc:`본인 적합성 판단 일체 → <b>의사 진료</b>`,
 deep:`허가 적응증은 ICRS grade IV 연골결손. 주 타깃은 K&L 2~3등급(경증~중등증). 이 등급 기준은 상담원이 환자에게 적용·판정하지 않는다.`},

{id:'A-3-2',mod:'a',topic:'퇴행성 관절염',k:'퇴행성 관절염 무엇 연골 닳아',
 q:'"퇴행성 관절염이 뭐예요?"',
 script:`나이·사용·외상 등으로 무릎 연골이 닳아 통증과 운동 제한이 생기는 질환입니다. 연골은 한번 닳으면 스스로 잘 회복되지 않아, 진행 단계에 따라 약물·주사·재생치료·수술 등을 의사 선생님과 상의해 선택합니다.`,
 no:`"방치하면 큰일 난다"식 공포 조장`,
 esc:`본인 진단·치료 계획 → <b>의료진</b>`,
 deep:`연골은 혈관이 없어 자연 재생이 어려움 → 재생치료의 존재 이유. K&L 등급은 X-ray 기반 중증도, ICRS 등급은 연골결손 정도 — 둘 다 의사가 판정.`},

{id:'A-3-3',mod:'a',topic:'퇴행성 관절염',k:'나이 연세 많은데 적은데 가능 노인',
 q:'"연세가 많은데(또는 적은데) 받을 수 있나요?"',
 script:`나이만으로 가능/불가능이 정해지진 않습니다. 카티스템은 인공관절 수술과 달리 나이보다 <b>연골 손상 정도와 전반적 상태</b>를 보고 판단하는 편이라, 검사 후 의사 선생님이 적합 여부를 결정하십니다.`,
 no:`"나이 상관없이 다 돼요" · 특정 나이 컷오프 단정`,
 esc:`본인 연령·상태 적합성 → <b>의료진</b>`,
 deep:`"인공관절 대비 나이·손상 정도에 비교적 구애받지 않는다"는 장점이 언급되나, 이는 '나이 무관'이 아니라 '연골 상태 중심 판단'이라는 의미. 최종 판단은 의사.`},

/* ===== 인공관절 ===== */
{id:'A-4-1',mod:'a',topic:'인공관절과 다른 점',k:'인공관절 차이 다른점 비교 치환',
 q:'"인공관절이랑 뭐가 달라요?"',
 script:`가장 큰 차이는 <b>내 관절을 보존하느냐</b>입니다. 카티스템은 <b>남아 있는 연골을 살려 재생을 유도</b>하는 치료이고, 인공관절은 손상이 심해진 관절을 <b>인공 관절로 바꾸는 수술</b>입니다. 적용되는 단계가 다르며, 어떤 치료가 맞는지는 검사 후 의사 선생님이 판단하십니다.`,
 follow:[['어느 게 더 좋아요?','더 좋고 나쁨이 아니라 <b>단계와 상태에 맞는 치료가 다른 것</b>입니다.']],
 no:`"인공관절보다 무조건 좋다" · 인공관절 폄하`,
 esc:`본인에게 어느 쪽이 맞는지 → <b>의료진</b>`,
 deep:`카티스템은 경증~중등증 '관절 보존' 단계, 인공관절(TKA)은 말기 '관절 치환' 단계 — 경쟁이 아니라 단계별 선택지. 이 프레임이 비방 리스크를 피하는 핵심.`},

{id:'A-4-2',mod:'a',topic:'인공관절과 다른 점',k:'인공관절 안하고 버틸 미룰 피할',
 q:'"인공관절 안 하고 이걸로 버틸 수 있어요?"',
 script:`카티스템은 자기 관절을 보존하며 증상 개선을 기대하는 치료지만, <b>'인공관절을 영구히 피한다'고 단정할 수는 없습니다.</b> 진행 정도에 따라 결과가 다르므로 장기 계획은 의사 선생님과 상의하시는 게 정확합니다.`,
 no:`"인공관절 안 해도 된다" · "평생 보장"`,
 esc:`예후·장기 전망 → <b>의료진</b>`,
 deep:`'인공관절 지연/회피 기대'는 치료 동기가 될 수 있으나 보장이 아님 — 환자 기대치 관리가 분쟁 예방의 핵심.`},

/* ===== 경쟁품 ===== */
{id:'A-5-1',mod:'a',topic:'경쟁품과 다른 점',k:'카티라이프 차이 비교 경쟁 자가',
 q:'"카티라이프랑 뭐가 달라요?"',
 script:`두 치료 모두 무릎 연골 재생이 목표지만 원리가 다릅니다. 카티스템은 <b>다른 사람의 제대혈 줄기세포(동종)를 한 번에 시술</b>하고, 카티라이프는 <b>환자 본인의 연골 세포를 채취·배양해 다시 이식(자가)</b>하는 방식이라 시술 횟수·과정이 다릅니다. 적합 여부는 의사 선생님 판단입니다.`,
 follow:[['뭐가 더 좋아요?','우열이 아니라 <b>방식과 적용 기준이 다른 치료</b>입니다.']],
 no:`"○○보다 우수/빠름" · 타사 단점 부각`,
 esc:`본인에게 어느 게 맞는지 → <b>의료진</b>`,
 deep:`카티스템=동종 제대혈 MSC, 1회 시술 / 카티라이프(바이오솔루션)=자가 늑연골세포 배양·이식, 2회 시술, 재활 약 6주. '횟수·세포 출처'가 가장 명확한 사실 차이. 그 외 메가카티(동종 늑골연골 과립, 신의료기술) 등도 존재.`},

{id:'A-5-2',mod:'a',topic:'경쟁품과 다른 점',k:'주사 골수 줄기세포 주사 차이 BMAC',
 q:'"주사로 하는 줄기세포(골수주사 등)랑 차이는?"',
 script:`흔히 말하는 자가골수 줄기세포 '주사'는 수술 없이 주입해 통증·염증 개선을 기대하는 시술로 간편하지만 원리가 다릅니다. 카티스템은 <b>연골결손 부위에 직접 적용하는 시술적 치료</b>입니다. 적합한 방법은 손상 정도에 따라 의사 선생님이 판단합니다.`,
 no:`타 시술 폄하 · "주사는 효과 없다"`,
 esc:`시술 선택 상담 → <b>의료진</b>`,
 deep:`골수흡인농축물(BMAC) 주사는 '환경 개선·통증 완화' 성격, 카티스템은 '연골결손 부위 재생 유도' 성격 — 목적·침습도가 다른 별개 옵션.`},

/* ===== 재활 ===== */
{id:'A-6-1',mod:'a',topic:'재활',k:'입원 얼마나 언제 걸어 재활 회복 체중',
 q:'"수술하고 얼마나 입원해요? 언제 걸어요?"',
 script:`카티스템은 시술 후 <b>재활이 중요한 치료</b>입니다. 입원 기간과 체중부하(걷기) 시작 시점은 환자 상태와 병원 프로토콜에 따라 단계적으로 정해지므로, 정확한 일정은 본원 기준으로 안내드리겠습니다. <span style="color:#c87214">[본원 재활 프로토콜 확인]</span>`,
 follow:[['바로 걸을 수 있어요?','이식한 세포가 자리 잡는 동안 <b>단계적으로 체중을 늘려가는 보호 기간</b>이 필요합니다. 무리하면 결과에 영향을 줄 수 있어 의료진 안내를 따르셔야 합니다.']],
 no:`"바로 일상복귀" · "재활 필요 없음"`,
 esc:`개인별 재활 일정·보조기 → <b>물리치료실/의료진</b>`,
 deep:`재생치료 특성상 초기 '보호(비/부분 체중부하)' 기간이 결과를 좌우 → 재활 순응도가 효과의 일부. 구체 기간은 반드시 본원 프로토콜 인용.`},

{id:'A-6-2',mod:'a',topic:'재활',k:'재활 어떻게 운동 물리치료 단계',
 q:'"재활은 어떻게 하나요?"',
 script:`보통 보호 기간 → 관절 가동범위 회복 → 근력 강화의 단계로, 물리치료와 가정 운동을 병행합니다. 구체적 프로그램은 <b>개인 상태에 맞게 의료진/물리치료사가 처방</b>하므로 그 안내를 정확히 따르는 것이 결과에 도움이 됩니다. <span style="color:#c87214">[세부 단계 본원 확인]</span>`,
 no:`상담원이 표준 운동을 처방 · "이 운동 하세요"`,
 esc:`운동 방법·통증 시 대처 → <b>물리치료실/의료진</b>`,
 deep:`단계별 재활은 '연골 성숙' 시간표에 맞춰 진행. 상담원은 '단계 개요'까지만, 실제 운동 처방은 물리치료 영역.`},

{id:'A-6-3',mod:'a',topic:'재활',k:'운동 음주 술 생활 주의 일상 언제부터',
 q:'"시술 후 운동·음주·일상생활 주의사항은?"',
 script:`시술 후에는 무릎에 무리가 가는 활동을 단계적으로 조절해야 하고, 회복기 생활 수칙(체중부하·운동·음주·상처 관리 등)은 <b>개인 상태에 맞춰 의료진이 안내</b>합니다. 퇴원 시 받으신 주의사항을 지키시는 것이 회복에 중요합니다.`,
 follow:[['술 마셔도 돼요? 운동 언제부터?','회복 단계에 따라 다르므로 의료진 안내 기준을 따르셔야 합니다. 제가 임의로 시점을 말씀드리긴 어렵습니다.']],
 no:`음주·운동 재개 시점 임의 단정 · "괜찮아요" 식 안심`,
 esc:`생활 수칙 세부 → <b>의료진/물리치료실</b>`,
 deep:`초기 회복기 과부하·낙상은 결과를 해칠 수 있어 생활 수칙이 재활의 일부. 상담원은 "퇴원 안내문 준수 + 의료진 문의"로 일원화.`},

/* ===== 실손 문의 전 ===== */
{id:'B-1-1',mod:'b',topic:'실손 문의 전',k:'실손 되나요 보험 적용 보장',risk:'최고위험 질문',
 q:'"이거 실손 되나요?"',
 script:`카티스템은 <b>비급여 항목</b>이고, 실손보험 보장 여부는 <b>가입하신 상품·약관·가입시점</b>에 따라 달라집니다. 그래서 <b>가입 보험사에 직접 확인</b>하시는 게 가장 정확합니다. 저희는 청구에 필요한 서류 안내는 도와드릴 수 있습니다.`,
 follow:[['그래서 되는 거예요 안 되는 거예요?','단정해 드리면 오히려 잘못된 정보가 될 수 있어요. 약관마다 달라 가입 보험사 확인이 꼭 필요합니다.'],['다른 분은 받았다던데요?','같은 시술이라도 <b>가입 상품·시점이 다르면 결과가 다를 수 있어</b> 일반화가 어렵습니다.']],
 no:`"실손 다 됩니다" · "당연히 보장돼요" · "전액 받으세요" — 사후 분쟁·신뢰 훼손의 직접 원인`,
 esc:`약관 해석·보장 가능성 판단 → <b>실손 담당자/가입 보험사</b>`,
 deep:`실손은 세대(1~4세대)·특약·가입시점별로 비급여 보장이 크게 다름. 2017.4 이후 3·4세대는 별도 비급여 특약 가입 시에만 보상되는 구조. "본인 약관 확인"이 유일한 정답.`},

{id:'B-1-2',mod:'b',topic:'실손 문의 전',k:'얼마 환급 돌려받 금액 한도',
 q:'"얼마나 돌려받을 수 있어요?"',
 script:`환급 금액은 <b>자기부담금, 보장한도, 비급여 보장 조건</b> 등 가입 약관에 따라 달라 저희가 금액을 말씀드리긴 어렵습니다. 가입 보험사에 '비급여 줄기세포 치료/주사료 보장 여부와 한도'를 문의하시면 정확히 안내받으실 수 있습니다.`,
 no:`구체 환급액·비율 단정`,
 esc:`금액 산정 → <b>가입 보험사</b>`,
 deep:`같은 보장이라도 자기부담률·연간 한도·통원/입원 구분에 따라 실수령액이 달라짐 → 금액 질문은 100% 보험사 영역.`},

/* ===== 실손 청구 ===== */
{id:'B-2-1',mod:'b',topic:'실손 청구',k:'청구 서류 필요 준비 진단서 영수증',
 q:'"청구하려면 뭐가 필요해요?"',
 script:`일반적으로 <b>진료비 영수증, 진료비 세부내역서, 진단서/소견서, (필요 시) 시술기록</b> 등이 기본 서류입니다. 다만 보험사마다 요구 서류가 달라, <b>가입 보험사 요구 목록을 먼저 확인</b>하시는 게 좋습니다. 본원 발급 가능 서류는 원무과에서 도와드립니다. <span style="color:#c87214">[본원 발급 서류 목록 확인]</span>`,
 follow:[['진단서 꼭 필요해요?','보험사·청구 금액에 따라 다릅니다. 보험사 안내에 맞춰 발급해 드리겠습니다.']],
 no:`"이 서류만 내면 무조건 받아요"`,
 esc:`서류 발급 → 원무과 / 보장 가능성 → 보험사`,
 deep:`비급여 청구는 '세부내역서 + 의학적 필요성 입증(소견서)'이 핵심. 거절 시 보완 경로와 연결되므로 처음부터 소견서를 잘 챙기는 것이 분쟁 예방.`},

{id:'B-2-2',mod:'b',topic:'실손 청구',k:'진단명 코드 어떻게 적어 보험 되게',risk:'보험사기 리스크',
 q:'"어떤 진단명(코드)으로 써야 보험 돼요?"',
 script:`진단명·코드는 <b>실제 진료 내용에 따라 의사 선생님이 의학적으로 기재</b>하시는 부분이라, 보험 청구를 위해 임의로 정할 수 있는 것이 아닙니다. 작성된 서류 기준으로 보험사에 청구하시면 됩니다.`,
 no:`보장 유리한 진단명·코드 안내·암시 (→ 보험사기·문서 관련 법적 리스크). 어떤 경우에도 상담원이 코드 선택을 유도하지 않는다.`,
 esc:`진단·코드 일체 → <b>의사(상담원 개입 금지)</b>`,
 deep:`'보험 되게 코드 바꿔달라'는 요청은 환자·병원 모두를 보험사기 리스크에 노출. 상담원이 가장 단호해야 할 영역. 응대는 "진료 내용대로 의사 기재"로 고정.`},

/* ===== 실손 거절 6슬롯 ===== */
{id:'S1',mod:'b',topic:'실손 거절 대응 · 6슬롯',k:'거절 치료목적 필요성 적정성 미인정 꼭 필요',
 q:'S1 — 치료목적·의학적 필요성 미인정',
 reason:`"질병 치료를 직접 목적으로 하지 않음 / 의학적 필요성 미인정 / 중증도 기준 미충족"`,
 script:`보험사가 '치료 목적·필요성'을 다시 보겠다는 사유입니다. 이럴 땐 무릎 상태를 보여주는 <b>검사 결과와 의사 소견서</b>로 보완해 재검토를 요청할 수 있는 경우가 있습니다. 다만 결과를 약속드릴 수는 없고, 담당자가 보완 절차를 안내드리겠습니다.`,
 esc:`<b>실손 담당자 + 의료진(소견서)</b>`,
 deep:`<b>담당자용 반박:</b> 카티스템은 식약처 허가 적응증(퇴행성·외상성 골관절염 무릎 연골결손, ICRS grade IV)이 명확한 전문의약품 → 적응증 충족(MRI/관절경 소견, KL·ICRS 등급, 보존적 치료력) 입증 시 '치료목적' 방어 가능. 단 적응증 밖(너무 경미)이면 면책 정당. <b>근거:</b> 약관 '질병 치료를 직접 목적' 정의 + FSC 비급여 분쟁조정기준(치료목적 여부, 1~4세대 적용). [본원 약관 조항 확인] <b>보완:</b> ① 소견서(필요성·적응증) ② MRI/관절경 판독 ③ 보존치료력 기록 → 재심사 요청.`},

{id:'S2',mod:'b',topic:'실손 거절 대응 · 6슬롯',k:'거절 가입담보 특약 범위 밖 세대 면책 약관',risk:'보완 여지 거의 없음',
 q:'S2 — 가입담보·특약 범위 밖',
 reason:`"약관상 보장하지 않는 비급여 / 해당 특약 미가입 / 가입시점 담보 제외"`,
 script:`이 사유는 가입하신 보험 상품의 <b>담보 범위</b> 문제라, 안타깝지만 서류 보완으로 바꾸기 어려운 경우가 많습니다. 정확한 담보 내용은 가입 보험사에서 확인하셔야 하며, 담당자가 함께 확인 도와드리겠습니다.`,
 no:`"보완하면 받을 수 있어요" — 이행 불가 약속 금지. 헛된 희망을 주지 않는 것이 오히려 신뢰를 지킨다.`,
 esc:`<b>가입 보험사 + 담당자</b>`,
 deep:`<b>담당자용:</b> 2017.4 이후 가입 3·4세대 실손은 비급여 관련 별도 특약 가입 시에만 보상되는 구조(3세대 비급여주사료 특약, 4세대 3대 비급여 특약 등). 약관 자체 문제라 반박 여지 최소 → 환자 기대치 관리 + 가입담보 확인이 핵심. <b>근거:</b> 금감원 소비자 유의사항(3·4세대 특약 보상 한정), 본인 가입 약관·담보·증권.`},

{id:'S3',mod:'b',topic:'실손 거절 대응 · 6슬롯',k:'거절 입원 적정성 통원 재산정 필요',
 q:'S3 — 입원 적정성 불인정(통원 재산정)',
 reason:`"입원의 의학적 필요성 불인정 / 통원 기준 적용"`,
 script:`입원이 의학적으로 필요했는지를 보겠다는 사유입니다. 시술과 회복 과정상 입원 필요성을 보여주는 <b>의무기록</b>으로 보완할 수 있는 경우가 있습니다. 담당자가 안내드리겠습니다.`,
 esc:`<b>실손 담당자 + 의료진</b>`,
 deep:`<b>담당자용 반박:</b> 보험사들은 줄기세포 시술의 '일률적 입원 처리'를 강하게 심사. 카티스템은 절개/관절경 수술 + 회복기 관찰이 필요한 시술(단순 외래 주사와 다름)이므로, 수술 침습도·마취·회복 관찰 필요성을 의무기록으로 입증하는 것이 통원 재산정 방어 논리. <b>근거:</b> 약관 입원/통원 정의 + 입원 필요성에 관한 의학적 판단 법리. [관련 판례·약관 본원 확인] <b>보완:</b> 입원 경위·관찰 필요성 의무기록 + 수술기록 → 재심사.`},

{id:'S4',mod:'b',topic:'실손 거절 대응 · 6슬롯',k:'거절 비급여 항목 적정성 삭감 일부지급 주사료 재료',
 q:'S4 — 비급여 항목 적정성·금액 삭감(일부지급)',
 reason:`"비급여 진료비 적정성 미인정 / 일부 항목 삭감"`,
 script:`청구 금액 중 일부 항목의 적정성을 보겠다는 사유입니다. <b>항목별 산정 근거 자료</b>로 재검토를 요청할 수 있는 경우가 있습니다(결과 약속은 어렵습니다). 담당자가 항목 근거를 정리해 안내드리겠습니다.`,
 esc:`<b>실손 담당자 + 원무</b>`,
 deep:`<b>담당자용:</b> 카티스템은 고가 비급여로 약제비·치료재료비·수술료 적정성이 핵심 쟁점("카티스템 비급여주사료+적정성"이 실제 분쟁 키워드). 공시 비급여 가격·실제 사용 약제/재료 내역으로 항목별 근거 제시. 손해사정법인 위탁 조사 가능성도 안내. <b>근거:</b> 비급여 적정성 심사 + FSC 분쟁조정기준 + 손해사정 위탁(보험업법). <b>보완:</b> 비급여 세부산정내역서 + 약제·재료 사용내역 → 항목별 소명.`},

{id:'S5',mod:'b',topic:'실손 거절 대응 · 6슬롯',k:'거절 진단 청구 불일치 서류 안맞 코드',risk:'코드 변경 유도 금지',
 q:'S5 — 진단·청구내역 불일치',
 reason:`"진단·시술 내역과 청구 불일치 / 사실관계 확인 필요"`,
 script:`서류 내용을 다시 확인하겠다는 사유입니다. 진단·시술 기록은 의사 선생님이 <b>진료 내용 그대로 작성</b>하신 것이므로, 그 기준으로 재확인해 드리겠습니다.`,
 no:`보장에 유리하게 진단명·코드 변경 유도 (→ 보험사기방지특별법 리스크). 신입이 가장 단호해야 할 슬롯.`,
 esc:`<b>의사 + 담당자</b>`,
 deep:`<b>담당자용:</b> 불일치를 (a) 단순 기재오류(정정 가능) vs (b) 사실관계 쟁점(의무기록 일치 확인)으로 구분. 어느 경우든 의사 작성 원칙 고수. <b>근거:</b> 서류 진실성, 보험사기방지특별법(부당 변경 시). <b>보완:</b> 의무기록·시술기록 정합 확인(의료진).`},

{id:'S6',mod:'b',topic:'실손 거절 대응 · 6슬롯',k:'거절 서류 미비 누락 소멸시효 기간 지남',
 q:'S6 — 서류 미비·소멸시효',
 reason:`"구비서류 미비 / 청구권 소멸시효 경과"`,
 script:`서류 보완으로 해결되는 경우입니다. 어떤 서류가 필요한지 확인해 <b>원무과에서 발급</b> 도와드리겠습니다. 청구 기한 관련해서도 함께 안내드릴게요.`,
 esc:`<b>원무과 + 담당자</b>`,
 deep:`<b>담당자용:</b> 실손 청구권 소멸시효는 보험금 청구사유 발생일로부터 3년(상법 제662조) → 시효 임박 건 우선 처리. 서류 미비는 6슬롯 중 가장 해결이 쉬움. <b>보완:</b> 누락 서류(영수증·세부내역서·진단서·시술기록 등) 발급·제출.`},

/* ===== 감정 응대 ===== */
{id:'감정 ①',mod:'emo',topic:'환자 감정 응대',k:'불안 무서워 겁 걱정 잘못되면',
 q:'불안한 환자 — "수술 무서워요 / 잘못되면 어떡해요"',
 script:`걱정되시는 게 당연합니다. 그래서 시술 전에 의료진이 안전성과 주의사항을 충분히 설명드리고, 궁금한 점을 모두 여쭤보실 수 있게 진료를 잡아드립니다. 무엇이 가장 걱정되시는지 말씀해 주시면 진료 때 꼭 여쭤보실 수 있게 메모해 드릴게요.`,
 no:`"걱정 마세요, 안전해요" (부작용 부정) · 불안 반복 강화`,
 deep:`불안한 환자에겐 '안심시키기'보다 '함께 확인할 경로 제시'가 더 안전. 부작용을 부정하지 않는다.`},

{id:'감정 ②',mod:'emo',topic:'환자 감정 응대',k:'화난 분노 속상 항의 거절 거부',risk:'분쟁 고위험',
 q:'화난 환자 — "보험사가 거절했어요!" (실손/고비용)',
 script:`많이 속상하셨겠습니다. 충분히 그러실 수 있습니다. 제가 도와드릴 수 있는 부분을 정확히 확인해서 다음 단계를 안내드리겠습니다. 우선 거절 안내문의 <b>사유</b>부터 같이 확인해 볼까요?`,
 no:`맞받아 변명 · 보험사 비난 동조 · "무조건 받아드릴게요"(이행 불가 약속 → 분쟁 악화)`,
 esc:`진정되지 않거나 항의가 격해지면 → <b>실장/실손 담당자</b> · 사유 확인 후 6슬롯 트리 연결`,
 deep:`화난 환자는 '해결'보다 '인정'을 먼저 원함. <b>공감 → 사실 → 다음 단계</b> 순서가 핵심. 결과 약속은 절대 금지.`},

{id:'감정 ③',mod:'emo',topic:'환자 감정 응대',k:'의심 회의 진짜 효과 장사 믿음',
 q:'의심 많은 환자 — "진짜 효과 있어요? 장사 아니에요?"',
 script:`충분히 그런 의문 가지실 수 있습니다. 카티스템은 2012년 식약처 허가 후 장기 데이터가 쌓여온 치료제이지만, <b>효과엔 개인차가 있어</b> 제가 '무조건 좋아진다'고 말씀드리진 않습니다. 본인 상태에 맞는지 검사로 확인하시는 게 가장 정확합니다.`,
 no:`과장으로 설득 · 수치 단정 · "후회 안 하세요"`,
 deep:`회의적 환자에겐 '겸손한 정직'이 오히려 신뢰를 만든다. 단정하지 않는 태도 자체가 설득력.`},

{id:'감정 ④',mod:'emo',topic:'환자 감정 응대',k:'재촉 오늘 결정 지금 손해 늦어',
 q:'결정 재촉 상황 — "지금 안 하면 손해예요?"',
 script:`급하게 결정하실 필요는 없습니다. 검사와 진료로 충분히 확인하신 뒤 결정하셔도 됩니다.`,
 no:`"오늘 하면 할인" · "지금 안 하면 늦어요" (환자유인·공포 조장)`,
 deep:`재촉·공포 조장은 환자유인 리스크. 상담원은 오히려 '천천히 결정해도 된다'로 안전하게 응대.`},

/* ===== 거절 극복 (결심 갈림길 키메시지) ===== */
{id:'OBJ-01',mod:'obj',topic:'거절 극복',k:'비용 부담 비싸 가격 돈 경제적 헛돈',
 q:`"비용이 너무 부담돼요" (경제적)`,
 script:`비용이 부담되는 건 당연합니다. 그래서 두 가지를 같이 봅니다 — 하나는 환자분이 실제로 적응증에 맞는지 의료진이 확인하는 것, 다른 하나는 가입하신 실손으로 어디까지 청구가 가능한지 함께 점검하는 것입니다. 비용만 보고 포기하기 전에 이 두 가지부터 확인해 보시죠.`,
 follow:[['"그래도 너무 큰돈이라…"','카티스템은 1회 이식하는 치료제라 반복 시술과 비용 구조가 다릅니다. 환자분 상황에서 총비용과 청구 가능 범위를 정확히 계산해 알려드릴 수 있습니다.']],
 no:`"이거면 평생 무릎 걱정 끝" · "100% 보험 처리" · "여기가 제일 쌉니다"`,
 esc:`구체 비용·납부 방식 → 원무/상담실 안내, 적응증·효과 → 의사 진료 연결`,
 deep:`속마음은 '돈이 아깝다'가 아니라 '썼는데 효과 없으면 어쩌나(손실 회피)' + '보험으로 일부라도 받을 수 있나'. 카티스템 1회 이식 치료제(식약처 허가). 비용 부담 호소 시 거의 항상 실손(OBJ-05)과 연결해 안내.`},
{id:'OBJ-02',mod:'obj',topic:'거절 극복',k:'재활 부담 회복 목발 체중부하 일상복귀 입원',
 q:`"재활·회복 기간이 부담돼요"`,
 script:`회복 기간이 걱정되시는군요. 사실 그걸 미리 아시는 게 더 좋은 선택에 도움이 됩니다. 직업과 생활 패턴을 알려주시면, 재활이 실제로 어떻게 진행되는지 의료진과 함께 구체적으로 안내해 드리겠습니다.`,
 follow:[['"몇 주면 끝나요?"','개인차가 커서 \'몇 주면 끝난다\'고 단정하기보다, 환자분 상태에 맞춰 단계별로 어떻게 진행되는지 설명드리는 게 정확합니다.']],
 no:`"금방 나아요" · "재활 안 해도 됩니다" · "통증 전혀 없어요"`,
 esc:`구체 재활 일정·체중부하 시점 → 의료진/물리치료사 (상담원 임의 처방 금지)`,
 deep:`속마음은 '수술보다 그 뒤가 더 무섭다' + 혼자살이·생계중단 공포. 입원 통상 3일~1주, 체중부하·목발 기간은 절골술 병행·연골상태에 따라 개인차 큼. 반드시 '의료진 판단' 전제.`},
{id:'OBJ-03',mod:'obj',topic:'거절 극복',k:'효과 의구심 정말 재생 되나 의심 믿음',
 q:`"정말 연골이 재생되나요?" (효과 의구심)`,
 script:`당연히 의심이 드실 수 있습니다. 그래서 저는 '무조건 된다'고 말씀드리지 않습니다. 대신 임상시험에서 어떤 결과가 보고됐는지, 그리고 그게 환자분께 어떻게 적용될지는 의료진이 판단한다는 점을 정확히 말씀드립니다.`,
 follow:[['"임상 결과가 어떤데요?"','미세천공술과 비교한 개선율이 논문에 보고돼 있습니다. 다만 실제 결과는 개인차가 있어, 환자분 연골이 적응증에 맞는지부터 확인하는 게 순서입니다.']],
 no:`"100% 재생" · "완치됩니다" · "재발 없어요" · 환자 후기를 효과 보증처럼 인용`,
 esc:`근거 자료 상세·본인 적용 → 의사 진료에서 직접 설명`,
 deep:`속마음은 '광고는 다 좋다고 하지'(합리적 경계). 근거: Lim 2021 RCT(PMID 33490296) 48주 ICRS≥1등급 개선 보고, 3~5년 추적 유지 보고. 전부 '보고됐다'로 전달, 단정 금지. 겸손한 정직이 오히려 신뢰를 만든다.`},
{id:'OBJ-04',mod:'obj',topic:'거절 극복',k:'수술 무섭다 부담 마취 절개 두려움 공포',
 q:`"수술이 무서워요" (수술 부담감)`,
 script:`수술이 무섭다고 느끼시는 건 아주 자연스러운 일입니다. 그 마음을 무시하고 권해드리진 않겠습니다. 대신 시술이 실제로 어떻게 진행되고 어떤 점을 의료진이 관리하는지 정확히 아시면, 막연한 두려움은 줄어들 수 있습니다.`,
 follow:[['"어떤 게 제일 걱정되세요?"','마취인지, 절개인지, 회복인지에 따라 의료진이 설명드릴 내용이 다릅니다. 걱정되는 점을 메모해 오시면 진료 때 하나씩 짚어드립니다.']],
 no:`"부작용 없습니다" · "안전합니다(단정)" · "걱정 안 하셔도 돼요"`,
 esc:`마취·시술 과정·부작용 상세 → 의료진 (시판후조사 이상사례 발현율 등은 허가사항 기준)`,
 deep:`속마음은 통제감 상실·'잘못되면' 공포. 카티스템은 절개·천공 후 이식하는 외과적 시술용 약제. 부작용 가능성은 항상 있고 사전 검사·상담으로 의료진이 관리한다는 전제. 어디가 무서운지 먼저 물어 구체화.`},
{id:'OBJ-05',mod:'obj',topic:'거절 극복',k:'실손 보험사 줄기세포 안된다 거절 콜센터 안내 포기',
 q:`"보험사에서 '줄기세포는 안 된다'고 했어요" (실손) ★`,
 script:`보험사에 문의하셨을 때 그렇게 들으셨군요, 불안하셨겠습니다. 한 가지만 정확히 알고 가셨으면 합니다 — <b>콜센터 상담원의 구두 안내는 최종 지급 결정이 아닙니다.</b> 보험금은 약관과 제출 서류, 심사로 정해집니다. 구두 안내만 듣고 포기하기보다 약관을 직접 확인하고 정식으로 청구해 보시길 권합니다.`,
 follow:[['"그래도 안 될 것 같은데요…"','많은 분이 \'무릎 줄기세포 주사\'와 카티스템을 같은 것으로 안내받습니다. 그런데 카티스템은 신의료기술 \'주사\'가 아니라 식약처 허가 전문의약품입니다. 분류가 다르면 약관 적용도 달라질 수 있어, 청구 결과를 받아보기 전엔 단정할 수 없습니다.'],['"보장 확실히 되나요?"','무조건 된다고 말씀드리는 게 아닙니다. 가입 세대·약관에 따라 다릅니다. 다만 청구도 안 해보고 포기하는 것과, 서류 갖춰 정식 청구 후 심사 결과를 받는 것은 전혀 다릅니다.']],
 no:`"무조건 보장됩니다" · "100% 환급" · "보험사가 틀렸어요" · 특정 보험사 비방`,
 esc:`정식 청구 절차·손해사정사 무료 선임·금감원 분쟁조정 → 실손정보 탭 + 실손 담당자`,
 deep:`속마음은 '지급 주체가 안 된다는데…'(권위 신뢰)+헛돈 공포. 핵심: ①구두안내≠최종결정 ②카티스템=전문의약품(품목기준코드 201200401), 신의료기술 주사와 법적 지위 다름 ③1~4세대 약관·심사에 따라 다름 ④3세대 비급여주사료 250만원 한도엔 '항암제 등' 예외조항 → 주계약 입원의료비(연 5천만원) 적용 논리 가능(분쟁 소지 있음, 입원 전제) ⑤손해사정사 보험사 비용 무료 선임권(통보일로부터 3영업일 내). 단, 환자에게 '보장 확약' 금지. 상세는 실손정보 탭 12케이스.`},
{id:'OBJ-06',mod:'obj',topic:'거절 극복',k:'나이 많아서 젊어서 연령 고령 망설임',
 q:`"이 나이에 무릎에…" / "아직 젊은데 벌써?" (나이)`,
 script:`나이 때문에 망설이시는군요. 카티스템 허가 임상은 만 18세 이상을 대상으로 했고 연령 상한이 따로 없습니다. 다만 나이가 아니라 환자분 연골 상태와 적응증이 핵심이라, 그건 의료진이 검사로 판단합니다.`,
 follow:[['(젊은 환자) "벌써 이런 걸 해야 하나요?"','신중하신 좋은 자세입니다. 무릎 상태가 이 치료의 적응증에 맞는지부터 확인하고, 다른 선택지와 함께 비교해 결정하셔도 늦지 않습니다.']],
 no:`"나이 상관없이 누구나 효과" · "젊으면 무조건 잘 됩니다"`,
 esc:`본인 적합 여부 → 검사·의사 진료`,
 deep:`고령은 자기검열('이 나이에…'), 젊은층은 '벌써?' 거부감. 동종 제대혈 세포라 자가 줄기세포의 연령 한계를 보완. 허가 임상 평균 약 55.9세, 연령 상한 없음. 기준은 나이 아닌 연골상태.`},
{id:'OBJ-07',mod:'obj',topic:'거절 극복',k:'인공관절 비교 차라리 치환술 망설임',
 q:`"차라리 인공관절을 할까요?" (인공관절 비교)`,
 script:`인공관절과 비교하며 고민하시는군요. 두 가지는 적응증과 목적이 다른 치료라, 어느 게 무조건 낫다고 말씀드리긴 어렵습니다. 환자분 연골 상태가 어느 쪽 기준에 맞는지 의료진이 판단하는 게 우선입니다.`,
 follow:[['"뭘 기준으로 정해요?"','가장 중요하게 생각하시는 게 자기 관절 보존인지, 회복 기간인지 여쭤봐도 될까요? 그에 따라 의료진과 상의할 방향이 달라집니다.']],
 no:`"인공관절보다 무조건 좋아요" · "인공관절은 하면 안 됩니다" · 타 시술/타 병원 비방`,
 esc:`두 선택지 비교·본인 적합 → 의사 진료에서 직접 비교`,
 deep:`'차라리 확실한 인공관절을' 또는 '아직 이르다는데 뭘?' 양가감정. 카티스템은 자기 관절 보존·연골재생 유도로 치환술과 적응증·기전 다름. 우열 단정·비방 금지, 사실 차이만.`},
{id:'OBJ-08',mod:'obj',topic:'거절 극복',k:'가족 상의 반대 미룰게요 나중에 결정',
 q:`"가족과 상의 후에 결정할게요"`,
 script:`가족과 상의하시는 건 정말 현명한 일입니다. 그럼 가족분이 궁금해하실 내용을 환자분이 정확히 전달하실 수 있게 핵심 자료를 정리해 드릴까요? 원하시면 가족분이 함께 진료에 오셔서 의료진 설명을 같이 들으셔도 좋습니다.`,
 follow:[['"가족이 반대하면요?"','반대하시는 이유가 비용인지, 효과인지, 안전인지에 따라 설명이 다릅니다. 그 부분 자료를 같이 정리해 드리면 대화에 도움이 되실 겁니다.']],
 no:`"지금 안 하면 늦어요" · "가족 말 들을 필요 없어요" (공포 조장·강요)`,
 esc:`가족 동반 진료 예약 → 상담실`,

function cardHTML(c, compact){
  const risk = c.risk ? `<span class="risk">⚠ ${c.risk}</span>` : '';
  const reason = c.reason ? `<div class="reason"><b>거절 사유:</b> ${c.reason}</div>` : '';
  let body = '';
  if(c.script) body += `<div class="sig ok"><div class="slabel"><span class="dot">✅</span> 권장 응대 스크립트 · 30초</div><div class="script">${c.script}</div></div>`;
  if(c.follow && c.follow.length){
    let qa = c.follow.map(f=>`<p class="qa"><b>Q. ${f[0]}</b> → ${f[1]}</p>`).join('');
    body += `<div class="sig turn"><div class="slabel"><span class="dot">🔄</span> 후속 질문 대응</div>${qa}</div>`;
  }
  if(c.no) body += `<div class="sig no"><div class="slabel"><span class="dot">⛔</span> 금지 표현 · 사용 불가</div><div class="nolist">${c.no}</div></div>`;
  if(c.esc) body += `<div class="sig esc"><div class="slabel"><span class="dot">↗</span> 상위 인계 기준</div><div class="esctext">${c.esc}</div></div>`;
  if(c.note) body += `<div class="note"><div class="nl">🔒 내부 참고 · 환자 비공개</div><p>${c.note}</p></div>`;
  if(c.deep) body += `<div class="deep"><div class="dl">🔎 심층 해설</div><div class="mc">${c.deep}</div></div>`;
  const head = `<div class="crow"><span class="cid mono">${c.id}</span><span class="mtag ${c.mod}">${MLABEL[c.mod]}</span>${risk}</div>
    <div class="q"><span class="quote">💬</span> ${c.q}</div>`;
  if(compact){
    return `<article class="card ${c.mod}" data-mod="${c.mod}" data-k="${c.k}">
      <details class="cwrap"><summary class="chead csum">${head}<span class="car">›</span></summary>
      <div class="cbody">${reason}${body}</div></details></article>`;
  }
  return `<article class="card ${c.mod}" data-mod="${c.mod}" data-k="${c.k}">
    <div class="chead">${head}${reason}</div>
    <div class="cbody">${body}</div></article>`;
}

const FAQ = [{"n":1,"cat":"intro","hot":true,"q":"카티스템이 비싼 이유?","k":"비용 가격 천만원 돈 비싸","a":"<p>카티스템은 대량 생산하는 일반 약이 아니라, 기증받은 제대혈 중 일부만을 선별해 전문가가 직접 배양·관리해 만드는 <b>세포치료제</b>입니다. 까다로운 품질검사와 고가 장비, 살아있는 세포의 배양 공정이 필요해 비용이 높습니다.</p><p>단순한 통증 완화를 넘어 손상된 무릎 연골의 재생을 목표로 하는 전문의약품이라는 점이 비용에 반영됩니다.</p>"},{"n":2,"cat":"rehab","hot":true,"q":"수술 후 목발 언제까지? 일상생활 언제 가능?","k":"재활 목발 일상생활 출근 복귀 회복 걷기","a":"<p>입원 기간은 상태에 따라 다르나 일반적으로 최소 3일 이상입니다. 수술 다음 날부터 누운 자세에서 다리 근육 운동을 시작해 근육 소실을 예방하고, 목발 보행도 가능하지만 수술 부위에 체중을 실어서는 안 됩니다.</p><p>이후 상태에 맞춰 엄지발가락부터 단계적으로 체중부하를 늘립니다. 목발 사용 기간은 개인차가 있으나 일반적으로 약 6~12주 후 목발 없이 일상생활이 가능합니다. 회복 속도는 재활 순응도와 개인 상태에 따라 달라집니다.</p>","note":"기존 자료의 '히딩크 감독' 사례는 유명인 치료경험담(의료법 제56조②2호)이라 제외했습니다."},{"n":3,"cat":"rehab","hot":true,"q":"카티스템 수술 많이 아픈지?","k":"통증 아파 아픈 아픔","a":"<p>카티스템 단독 시술은 무릎 수술 중 통증이 비교적 적은 편입니다(다른 수술과 병행 시 일시적 통증이 동반될 수 있습니다). 통증 정도는 개인차가 있으며, 시술 전후 통증 관리는 의료진이 안내합니다.</p>"},{"n":4,"cat":"efficacy","q":"연골 재생 얼마 후 되나요? 어떻게 확인해요?","k":"연골 재생 시점 확인","a":"<p>시술 후 시간이 지나면서 재생된 연골이 영상검사에서 관찰될 수 있습니다. 임상에서는 대체로 수개월에서 1년에 걸쳐 연골 개선이 보고되고 있으나, 재생 정도와 시점에는 개인차가 있습니다. 실제 재생 여부는 MRI 등 영상·검사로 의료진이 확인합니다.</p>"},{"n":5,"cat":"insurance","hot":true,"q":"실손 보험을 받으려면 조건이 어떻게 돼?","k":"실손 실비 보험 청구 손해사정 적응증","a":"<p>카티스템은 비급여 전문의약품으로, 치료 목적으로 적응증에 맞게 사용된 경우 실손보험 청구를 할 수 있습니다. 다만 <b>보장 여부·범위는 가입하신 약관과 보험사 심사에 따라 달라지므로 반드시 보험사에 확인</b>하셔야 합니다. 심사는 진단명뿐 아니라 실제 진료행위·약제비·진료기록을 기준으로 이뤄집니다.</p>\n <p><b>■ 식약처 허가 적응증</b><br>· \"퇴행성관절염\" 또는 \"반복적 외상에 의한 골관절염\" 진단<br>· \"ICRS Grade 4\"(연골결손 정도: MRI·수술기록지)<br>· \"K-L Grade 1~3\" 진단<br>· 나이 제한 없음</p>\n <p><b>■ 보험사 상담 시 유의</b><br>· \"줄기세포\"라는 표현만으로 신의료기술 BMAC과 혼동하는 경우가 있으므로, <b>전문의약품 카티스템(제대혈유래 중간엽줄기세포 치료제)</b>임을 명확히 설명<br>· 일부 보험사가 단순 비급여 주사제(연 250만원 한도)로 오해할 수 있으나, 카티스템은 약제비 보장 항목과 계약 보장비율에 따라 보상될 수 있음<br>· 특별조건부 계약·고지의무·보장비율·단체보험 등은 개인별 증권 확인 필수</p>\n <p><b>■ \"250만원까지만 된다\"고 할 때</b><br>3세대 보험에서 카티스템을 일반 비급여 주사료(연 250만원 한도)로 보아 삭감하는 경우가 있습니다. 그러나 카티스템은 복지부 분류상 “조직세포성장인자 제제(439번)”로, 약관의 “항암제 등” 예외에 해당해 주계약 질병비급여(연 5,000만원 한도·3~4세대 70%)에서 보상 대상이 될 수 있습니다. 이때 <b>반드시 ‘입원 치료’로 진행·기록되어야</b> 주계약 한도가 적용됩니다(통원으로 처리되면 보상이 거의 어렵습니다). 적용 여부는 약관·심사에 따라 다르므로 보험사 확인이 필요합니다.</p>\n <p><b>■ 청구 후 유의 — 손해사정사 선임권</b><br>보험금 청구 후 \"회사가 정한 손해사정사 업체로 의뢰될 예정\"이라는 안내를 받으면, 환자(피보험자)는 <b>[손해사정사 선임권]</b>을 행사할 수 있습니다. 보험사 지정 업체는 객관성이 제한될 수 있으므로, 환자가 직접 지정한 손해사정사가 심사를 맡으면 객관성·공정성을 높일 수 있습니다. 이 선임권은 보험사가 비용을 부담(무료)하며, <b>안내받은 날로부터 3영업일 이내</b> 신청해야 합니다.</p>","note":"도입 문장을 \"청구가 가능합니다\" → \"청구할 수 있으나 보장은 약관·심사에 따라 다름\"으로 보수화. 손해사정사 선임권 안내는 그대로 보존(유용)."},{"n":6,"cat":"compare","q":"\"카티스템\"과 \"미세천공술+콜라겐\"의 차이점","k":"미세천공 콜라겐 차이 비교","a":"<p><b>퇴행성관절염</b>은 치료하지 않으면 연골 손상과 관절 환경 악화가 반복됩니다. 그래서 연골 재생과 함께 관절 환경 개선을 함께 고려하는 것이 중요합니다.</p>\n <p><b>카티스템(첨단바이오의약품)</b>은 식약처 허가 전문의약품으로, GMP 시설에서 품질관리를 거쳐 생산된 줄기세포가 치유 물질을 분비해 연골 재생을 돕고 염증을 억제하는 것을 목표로 합니다.</p>\n <p><b>미세천공술+콜라겐(의료기기)</b>은 뼈에 작은 구멍을 내 골수가 올라와 치유되는 원리이며, 콜라겐은 확산을 막아 재생을 돕는 덮개 역할을 합니다. 세포 성분이 포함되지 않는 시술로, 원리가 다릅니다.</p>","note":"기존의 \"치료 조절할 수 없습니다\"식 타 시술 폄하 표현을 \"원리가 다르다\"는 사실 비교로 보수화."},{"n":7,"cat":"compare","q":"BMAC과 카티스템 뭐가 달라요?","k":"bmac 골수 차이 비교","a":"<p>국내에서 식약처 품목허가를 받은 무릎 연골재생 줄기세포 치료제는 카티스템입니다. 흔히 'BMAC(비맥)'이라 불리는 시술은 줄기세포 치료제가 아니라 환자 본인의 골수를 농축해 통증을 줄이는 주사 치료로, 연골을 새로 만들어 주는 치료와는 성격이 다릅니다.</p>\n <p>과거 BMAC을 줄기세포 치료처럼 광고한 사례가 있었으나, 보건복지부가 \"줄기세포로 광고할 수 없다\"고 안내한 바 있습니다. 카티스템은 손상된 연골 재생을 목적으로 허가받은 줄기세포 치료제입니다.</p>\n <p>※ 참고: BMAC을 줄기세포 치료로 표현할 수 없음을 안내한 보건복지부 자료<br><span class=\"url\">https://drive.google.com/file/d/1MkHFyB4ZtK8dJWtJqYnM0shGTRvDr38A/view</span></p>"},{"n":8,"cat":"surgery","q":"수술 시간과 수술 방법","k":"수술 시간 방법 절개 관절경 영상","a":"<p>카티스템 단독 수술은 집도의에 따라 차이가 있으나 평균 30분~1시간 정도 소요됩니다. 관절 손상 범위와 개인별 특성을 고려해 절개법 또는 관절경 중 적합한 방식으로 시행됩니다.</p>\n <p>· 절개법 영상: <span class=\"url\">https://youtu.be/u3CQ2aBz2Rg</span><br>· 관절경 영상: <span class=\"url\">https://youtu.be/o8SssQPsQb0</span></p>"},{"n":9,"cat":"surgery","q":"주문은 왜 8일 전에 해요?","k":"주문 발주 배양 일정","a":"<p>카티스템은 살아 있는 제대혈 유래 줄기세포 치료제로, 제조 전 과정이 전문성과 시간을 요합니다.</p>\n <p>1) 살아 있는 세포라 미리 재고를 쌓아두지 않음<br>2) 수술 일정에 맞춰 새로 배양<br>3) -196℃ 보관 세포의 안전한 해동에 시간 필요<br>4) 전문가 수작업 배양·증식 + 엄격한 품질관리<br>5) 수술 당일 직배송되어 즉시 사용</p>\n <p><b>발주 가이드</b><br>· 화요일 주문 → 다음 주 화/수 수술 사용 가능<br>· 목요일 주문 → 다음 주 목/금 수술 사용 가능<br>(주문은 거래처 담당자에게 직접 연락)<br><span class=\"url\">https://drive.google.com/file/d/1NW2K-tpufk9G4okbIigMPcYgtoytdIiX/view</span></p>"},{"n":10,"cat":"efficacy","q":"논문이나 실제 임상사례 궁금해요","k":"논문 임상 데이터 근거 사례","a":"<p>임상 3상에서 연골 개선이 확인되었으며, 고령이거나 병변이 큰 경우에도 개선이 보고되었습니다. 구체적인 수치·그래프는 의료진 또는 임상 자료를 통해 확인하실 수 있습니다. 효과에는 개인차가 있습니다.</p>\n <p>· 임상 3상 결과 그래프: <span class=\"url\">https://drive.google.com/file/d/1yhQ-mNSSpFwnsriGHlfZiu05ZGC-3vLS/view</span></p>","note":"상담원 참고(환자 단정 금지): 기존 자료 \"임상3상 98% 개선, 60세 이상 100%, 6cm²↑ 93%\". 수치는 출처와 함께 의료진이 제시하되, 환자에게 '성공률/보장'처럼 전달 금지."},{"n":11,"cat":"intro","q":"카티스템을 이해하기 쉽게 짧게 설명해 주세요","k":"간단 설명 요약","a":"<p>카티스템은 국내에서 허가받은 줄기세포 연골재생 치료제로, 탯줄 혈액(제대혈) 유래 줄기세포로 무릎 연골 재생과 퇴행성관절염 치료를 목표로 하는 전문의약품입니다.</p>","note":"\"국내 유일한\" → \"국내에서 허가받은\"으로 보수화(절대표현 회피)."},{"n":12,"cat":"rehab","q":"부작용?","k":"부작용 안전 위험 후유증","a":"<p>카티스템의 주성분은 면역원성이 낮은 것으로 알려진 제대혈 유래 줄기세포이며, 임상시험을 통해 안전성이 확인된 전문의약품입니다.</p><p>다만 모든 시술이 그렇듯 부작용 가능성을 완전히 배제할 수는 없어, 시술 전 의료진이 금기·주의사항과 가능한 이상반응을 직접 안내합니다.</p>","note":"⚠ 기존 \"부작용 사례는 없었습니다\"는 의료법 제56조②7호(부작용 정보 누락) 직격이라 반드시 삭제·보수화함. 환자에게 '부작용 없음' 단정 금지."},{"n":13,"cat":"intro","q":"핵심 안내 멘트","k":"후킹 멘트 핵심 안내 소개","a":"<p>카티스템은 국가에서 허가받은 전문의약품으로, 손상된 무릎 연골의 재생을 목표로 <b>자기 관절을 보존</b>하는 치료입니다. 장기 추적에서 좋은 경과가 보고되고 있으나 효과에는 개인차가 있으며, 적합 여부는 검사 후 의사 선생님이 판단합니다.</p>","note":"기존 '후킹 멘트'의 \"평생\", \"재수술 0건\", \"1시간이면 간단\" 등은 과장(제56조②8호) 리스크라 제외하고 사실 중심으로 재작성."},{"n":14,"cat":"insurance","q":"사이즈(병변 크기) 제한이 있나요?","k":"사이즈 크기 병변 제한 실손","a":"<p>병변 크기에 대한 적합성 판단은 의료진의 영역입니다. 다만 최근 실손보험 심사 기준이 엄격해진 점을 고려하면, 보험 적용 측면에서는 약 <b>2~9㎠</b> 병변이 비교적 무난한 것으로 안내됩니다(보장 여부는 약관·심사에 따라 다름).</p>","note":"\"크기와 상관없이 우수한 치료 결과\" 효능 단정은 제거. 실손 심사 관련 실무 팁은 보존."},{"n":15,"cat":"intro","q":"어떤 원리로 연골재생·퇴행성관절염 치료가 되나요?","k":"원리 기전 작용","a":"<p>카티스템(제대혈 유래 중간엽줄기세포)이 치유 단백질을 분비하여 ① 연골 재생을 촉진하고 ② 연골 분해를 억제하며 ③ 염증을 억제하는 방식으로, 연골 재생과 퇴행성관절염 개선에 도움을 주는 것을 목표로 합니다.</p>"},{"n":16,"cat":"disease","q":"퇴행성관절염이 어떤 질병이에요?","k":"퇴행성 관절염 질병","a":"<p>퇴행성관절염은 연골이 닳아 염증이 생기고, 그 염증이 악순환되며 무릎 상태가 점점 나빠지는 질환입니다. 치료에는 연골 재생과 관절 환경 개선을 함께 고려하는 것이 중요합니다.</p>"},{"n":17,"cat":"efficacy","q":"수술 효과가 좋은 나이나 크기가 있나요?","k":"나이 크기 효과 연령","a":"<p>임상에서 고령이거나 병변이 큰 경우에도 개선이 보고되었습니다. 다만 효과에는 개인차가 있어, 본인에게 적합한지는 검사 후 의사 선생님이 판단합니다.</p>","note":"기존 \"98%/60세 이상 100%/크기 커도 좋은 결과\" 단정은 효능 보장 인상이라 보수화. 수치는 의료진이 출처와 함께 제시."},{"n":18,"cat":"efficacy","hot":true,"q":"성공률 / 완치율은 어떻게 되나요?","k":"성공률 성공율 완치 완치율","a":"<p>'성공률'이나 '완치율'을 수치로 단정해 말씀드리기는 어렵습니다. 임상 3상에서 무릎 연골 개선이 확인되었고 장기 추적에서도 좋은 경과가 보고되고 있으나, <b>효과에는 개인차</b>가 있습니다. 본인이 기대할 수 있는 결과는 검사 후 의사 선생님과 상담하시는 것이 정확합니다.</p>","note":"⚠ '성공률/완치율'은 효능 보장을 구하는 질문 → 가장 위험. 상담원 참고: 임상3상 연골개선 98%(43명 중 42명), 3~11년 추적 100명 인공관절 전환 보고 관련 — 이데일리 기사(https://www.edaily.co.kr/News/Read?newsId=01082406642040344). 단 '완치율/성공률/0건'으로 환자에게 단정 금지 + 100명·11년 추적 수치는 1차 출처 검증 권장."},{"n":19,"cat":"efficacy","hot":true,"q":"효과 어느정도 가나요? 인공관절 수술 안 해도 되나요?","k":"효과 지속 인공관절 tkr 몇년","a":"<p>장기 추적에서 좋은 경과가 보고되고 있으나, <b>'인공관절을 영구히 피한다'고 단정할 수는 없습니다.</b> 진행 정도에 따라 결과가 다르므로, 어떤 치료가 적합한지는 의사 선생님과 상의하시는 것이 정확합니다.</p>","note":"기존 \"인공관절보다 우선적으로 카티스템을 추천합니다\"는 치료 추천·비교 우위(제56조②4호)라 제거. 효과 지속은 단정 대신 '개인차' 프레임."},{"n":20,"cat":"compare","hot":true,"q":"카티스템 말고 다른 줄기세포 넣으면 안되나요?","k":"다른 줄기세포 bmac svf 차이","a":"<p>국내에서 허가받은 무릎 연골재생 줄기세포 치료제는 카티스템입니다. 흔히 줄기세포로 오인되는 BMAC(골수흡인농축액)·SVF(자가지방유래 기질혈관분획) 주사는 골수·지방을 농축한 시술로, 성격(예: 통증 완화 목적)과 원리가 다릅니다.</p>\n <p>어떤 치료가 본인에게 적합한지는 손상 정도와 상태에 따라 의사 선생님이 판단합니다.</p>","note":"\"카티스템이 유일\" \"근본적으로 치료할 주사는 없으며\" \"효과 차이가 큰\" 등 절대표현·타 시술 폄하(제56조②5호)를 제거하고 사실 차이 중심으로 보수화."},{"n":21,"cat":"insurance","hot":true,"q":"실손 청구가 거절(부지급)됐어요. 어떻게 하나요?","k":"실손 거절 부지급 삭감 이의신청 분쟁조정 손해사정","a":"<p>거절됐다고 끝이 아닙니다. 사유에 따라 다시 검토를 요청할 수 있는 경우가 많습니다. 다만 결과를 보장해 드릴 수는 없고, 절차를 함께 도와드리겠습니다.</p>\n <p><b>■ 순서</b><br>① <b>서면 거절 사유서</b>를 받아 정확한 조항·사유를 확인합니다.<br>② 병원에서 <b>수술기록지·MRI 소견서·진료비 세부내역서·담당의 소견서·식약처 허가사항</b>을 발급받습니다.<br>③ 사유에 맞는 근거로 <b>이의신청(내용증명)</b>을 제출합니다.<br>④ 해결되지 않으면 <b>금융감독원 분쟁조정</b>(무료)을 신청할 수 있습니다.</p>\n <p><b>■ 손해사정사 선임권</b><br>보험사가 \"지정 손해사정 업체로 의뢰하겠다\"고 하면, 환자가 직접 손해사정사를 선임할 수 있습니다(보험사 비용 부담·무료, 통보일로부터 3영업일 이내 신청).</p>\n <p>거절 사유별 구체적인 대응 방법은 병원 담당자가 함께 준비해 드립니다.</p>","note":"상담원용 상세 대응(거절 사유 12종·반박 논리·증거·법적 근거)은 [거절대응] 탭 참조. 환자에게는 절차 안내까지만, 보장·결과 단정 금지."},{"n":22,"cat":"disease","hot":true,"q":"무릎 말고 다른 관절(어깨·고관절·발목)에도 되나요?","k":"다른 관절 어깨 고관절 발목 무릎 전용 적응증","a":"<p>카티스템은 식약처 허가상 <b>무릎 연골결손</b> 치료에 사용하도록 허가된 치료제입니다. 따라서 어깨·고관절·발목 등 다른 관절은 허가 적응증이 아닙니다.</p>\n <p>다른 관절의 통증·손상에 대해서는 별도의 진료와 다른 치료 방법이 필요할 수 있으니, 해당 부위 상태는 진료를 통해 의료진과 상의하시기 바랍니다.</p>","note":"무릎 전용(허가 적응증). 타 관절 적용은 허가 외 → 권유 금지. 다른 관절은 진료 안내로 연결."},{"n":23,"cat":"surgery","q":"당뇨·고혈압 등 지병이 있어도 시술 가능한가요?","k":"당뇨 고혈압 지병 기저질환 복용약 동반질환 가능","a":"<p>지병이 있다고 해서 일률적으로 안 되는 것은 아닙니다. 다만 가능 여부와 주의사항은 <b>개인의 상태·복용 중인 약·기저질환에 따라 달라지므로, 검사 후 의료진이 판단</b>합니다.</p>\n <p>진료 시 현재 앓고 계신 질환과 복용 중인 약(특히 혈액 관련 약 등)을 빠짐없이 알려 주시면 안전하게 안내받으실 수 있습니다.</p>","note":"동반질환 가부는 의료진 판단. 상담원이 \"된다/안 된다\" 단정 금지. 복용약 고지 안내까지."},{"n":24,"cat":"rehab","hot":true,"q":"시술 후 샤워·운전·음주·직장 복귀는 언제부터 가능한가요?","k":"시술 후 샤워 목욕 운전 음주 술 흡연 담배 직장 복귀 출근 일상","a":"<p>일반적인 경과는 아래와 같으나, <b>구체적인 시점은 회복 상태에 따라 다르므로 의료진 안내를 따라 주세요.</b></p>\n <p><b>· 샤워/목욕</b> — 상처 부위 보호가 필요해, 봉합·상처 상태에 따라 시점이 정해집니다.<br><b>· 운전·직장 복귀</b> — 목발·체중부하 단계와 업무 강도에 따라 다르므로 의료진과 상의해 정합니다.<br><b>· 음주·흡연</b> — 회복과 연골 재생에 도움이 되지 않으므로 회복 기간에는 삼가시길 권합니다.</p>","note":"일반 경과까지만. 구체 일정은 본원 재활 프로토콜·의료진. 음주·흡연은 \"삼가 권장\" 톤(단정 금지)."},{"n":25,"cat":"surgery","q":"한 번 맞으면 끝인가요? 나중에 또 해야 하나요?","k":"재시술 한번 1회 또 다시 반복 유효기간 보관","a":"<p>카티스템은 <b>원칙적으로 1회 시술</b>로 진행됩니다. 세포는 시술 시점에 사용되며, 따로 보관해 두는 개념은 아닙니다.</p>\n <p>이후 경과나 추가 시술이 필요한지는 개인의 상태에 따라 다르며, 정기적인 추적 관찰을 통해 의료진이 판단합니다.</p>","note":"1회 시술 원칙. \"평생 효과/재시술 불필요\" 등 단정 금지. 추적·재시술 여부는 의료진."},{"n":26,"cat":"surgery","q":"임신 중이거나 임신 계획이 있는데 가능한가요?","k":"임신 수유 임산부 가임 출산 계획","a":"<p>임신 중이거나 수유 중, 또는 임신을 계획 중이신 경우에는 <b>반드시 사전에 의료진과 상의</b>하셔야 합니다. 해당 상황에서의 시술 여부는 안전을 우선해 의료진이 신중히 판단합니다.</p>\n <p>현재 임신 여부나 계획을 진료 시 꼭 알려 주세요.</p>","note":"임신·수유는 안전 우선·의료진 판단으로 강하게 연결. 상담원이 가부 단정 절대 금지."},{"n":27,"cat":"rehab","q":"흉터가 남나요?","k":"흉터 상처 흉 절개 관절경 자국","a":"<p>카티스템은 관절경을 이용한 작은 절개로 진행되어 흉터가 비교적 작은 편이나, <b>흉터 정도는 절개 방식·피부 상태·개인차</b>에 따라 달라집니다.</p>\n <p>구체적인 절개 부위와 흉터 관리는 시술 방법에 따라 다르므로 의료진에게 확인하시는 것이 정확합니다.</p>","note":"\"흉터 없음\" 단정 금지. \"비교적 작은 편 + 개인차 + 의료진 확인\"으로."},{"n":28,"cat":"surgery","hot":true,"q":"왜 월요일은 수술이 안 되나요? (수술 가능 요일)","k":"월요일 수술 요일 유효기간 48시간 생산 일정 화수 목금 발주","a":"<p>카티스템은 살아 있는 제대혈 유래 줄기세포 치료제로 <b>유효기간이 약 48시간</b>으로 짧습니다. 월요일 수술용 제품을 만들려면 주말에 생산·품질관리 라인이 가동되어야 하는데, 인력 운영상 현실적으로 어렵습니다.</p>\n <p>그래서 제품 생산·출하 일정에 맞춰 <b>수술은 화·수·목·금(4일)</b>에 가능합니다. (화요일 주문 → 화·수 수술, 목요일 주문 → 목·금 수술. 구체 일정은 생산·거래처 일정에 따라 달라질 수 있습니다.)</p>","note":"생산 일정 관련 실무 안내. 정확한 발주·수술일은 거래처 담당자·생산 일정으로 확인."}];

const KNOW = {"intro":"<b>핵심</b> 카티스템 = 메디포스트·2012년 식약처 허가, 세계 최초 <b>동종 제대혈 유래 중간엽줄기세포(MSC)</b> 치료제. 적응증 = 퇴행성·외상성 골관절염 무릎 연골결손(ICRS grade IV). “동종”=타인 제대혈(자가 아님), <b>1회 시술</b>. 줄기세포 종류 중 제대혈은 성체(중간엽)로 윤리 부담이 낮음. 비급여 + 살아있는 세포 수작업 배양이라 고가.<br><b>⚠ 가드레일</b> “최고·유일·완치” 단정 금지 → “국내 허가받은 줄기세포 치료제”까지만(절대표현 회피). 가격은 공시가 안내, 할인·흥정 금지(환자유인 제27조③).","disease":"<b>핵심</b> 퇴행성관절염 = 연골 마모 → 염증 악순환. 연골은 혈관이 없어 자연재생이 어려움(재생치료의 이유). 등급: <b>K&L</b>(X-ray 중증도)·<b>ICRS</b>(연골결손 정도), 주 타깃 K&L 2~3.<br><b>⚠ 가드레일</b> 상담원은 환자의 단계·적합성·나이 가부를 <b>판정하지 않는다</b>(무면허 의료행위 소지). 모든 적합성 질문은 “검사 후 의사 판단”으로 전환.","surgery":"<b>핵심</b> 절개법 또는 관절경으로 연골결손부 미세천공 후 도포, <b>1회·평균 30분~1시간</b>. 입원 최소 3일+(본원 기준). <b>발주 리드타임</b>: 살아있는 세포라 재고 없음 → 화요일 주문=다음 주 화/수, 목요일 주문=다음 주 목/금(거래처 담당자 발주).<br><b>⚠ 가드레일</b> 마취·양쪽 동시 시술·합병증은 의료진 판단. “간단·바로 일상복귀” 단정 금지.","efficacy":"<b>핵심</b> 임상 3상에서 연골 개선 확인(메디포스트 발표 98% = 43명 중 42명). 장기 추적 보고 존재(이데일리 기사).<br><b>⚠ 가드레일</b> “100명·11년·전환 0건” 수치는 <b>1차 출처 검증 필요</b> + 환자에게 ‘성공률·완치율·0건·평생’으로 단정 금지(제56조②8호). “인공관절 영구 회피” 단정·특정 치료 추천 금지(②4호). 효과·지속은 개인차, 수치는 의료진이 출처와 함께 제시.","rehab":"<b>핵심</b> 초기 보호(비/부분 체중부하) 기간이 결과를 좌우 → 재활 순응도가 효과의 일부. 목발 6~12주(개인차), 입원 3일+(본원 기준). 제대혈 MSC는 면역원성이 낮아 동종 사용, 임상에서 안전성 확인.<br><b>⚠ 가드레일</b> <b>“부작용 없음” 단정 절대 금지</b>(②7호) — 부작용 고지는 의료진(허가사항). 운동·음주·복귀 시점은 의료진/물리치료 처방, 상담원 임의 안내 금지.","compare":"<b>핵심</b> 카티스템(동종 제대혈 MSC·1회) / 카티라이프(자가 늑연골·2회·재활 ~6주) / BMAC·SVF(골수·지방 농축 주사·통증완화 성격) / 미세천공+콜라겐(의료기기·세포 없음). 국내 허가 줄기세포 연골재생 치료제는 카티스템(사실). BMAC을 줄기세포로 광고 불가(복지부 안내).<br><b>⚠ 가드레일</b> 비교는 “방식·허가 차이”의 사실까지만. “우수·빠름·유일·근본치료” 단정·타사 폄하 금지(②4호 비교·5호 비방). 적합성은 의사 판단.","insurance":"<b>핵심</b> 비급여. 보장 = 보험사·약관·가입시점·심사에 따라 다름(세대별 비급여: 1세대 ~100% / 2세대 80~90% / 3세대 80% / 4세대 70% / 5세대 비중증 50%·중증 강화). <b>전문의약품 카티스템 ≠ 신의료기술 BMAC·SVF 주사</b> — 모든 거절 대응의 출발점. <b>250만원 한도 함정</b>: 카티스템을 일반 비급여 주사료(연 250만원 한도)로 삭감하려 하면, 약관상 “항암제 등” 예외(복지부 분류 439번 조직세포성장인자 제제)를 근거로 주계약 질병비급여(연 5,000만원·3~4세대 70%)에서 보상 주장 가능. ★단 반드시 <b>입원 치료</b>로 진행·기록되어야 함(통원 처리 시 보상 거의 불가). 거절 시 핵심 무기 = 수술기록지·집도의 소견서·관절경 사진·식약처 허가서. <b>손해사정사 선임권</b>(보험사 지정 업체 통보 시 환자 직접 선임, 무료·3영업일 내).<br><b>⚠ 가드레일</b> 보장·금액 단정 금지. <b>진단명·코드 유도 절대 금지</b>(보험사기방지법). 거절 시 → 거절대응 탭(12개 거절 사유)에서 사유를 찾아 담당자에게 인계.","objection":"<b>핵심</b> 목표는 '설득'이 아니라 <b>환자의 자기결정 지원</b>. 4단계 흐름 = ① 공감(거절 감정 인정) → ② 사실(정확한 정보, \"보고됐다\"·\"개인차\") → ③ 자기결정 질문(무엇이 가장 걱정인지) → ④ 클로징(검사·진료로 부드럽게 연결). 환자가 \"검사 받아보겠다\"면 1차 성공. 비용 호소는 거의 항상 실손(OBJ-05)과 연결. <b>실손 거절은 콜센터 구두 안내 ≠ 최종 결정</b>임을 반드시 정정.<br><b>⚠ 가드레일</b> 효능·완치·100%·유일·평생 단정 금지, <b>공포·시급성 조장 금지</b>(“지금 안 하면 늦는다”·“오늘 하면 할인”=환자유인), 타 시술·타 병원 비방 금지, 보험 보장 단정 금지. 환자가 반복 거부하면 자기결정 존중하고 자료만 제공(강요 금지)."};
