<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c3a4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="카티스템 의료진">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230c3a4f'/><path d='M32 12v40M12 32h40' stroke='%237fd1e8' stroke-width='7' stroke-linecap='round'/></svg>">
<title>카티스템 의료진 레퍼런스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ffffff; --bg:#eef2f4; --ink:#142532; --sub:#566472; --faint:#8a96a2; --line:#e2e8ed;
    --a:#0d6e8c; --a-soft:#e6f3f7; --a-bar:#127a99;
    --b:#b46512; --b-soft:#fbf3e6; --b-bar:#d18020;
    --e:#5a4bd4; --e-soft:#ecebfb; --e-bar:#6f60e0;
    --ok:#138a55; --ok-soft:#e6f5ee;
    --no:#c93636; --no-soft:#fcebeb;
    --warn:#b5450e; --warn-soft:#fdecdd;
    --note:#946712; --note-soft:#fbf2dc;
    --radius:18px;
    --shadow:0 1px 2px rgba(12,40,60,.06),0 8px 24px rgba(12,40,60,.07);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'IBM Plex Sans KR',sans-serif;
    background:radial-gradient(circle at 10% -5%,#eef6f9 0%,transparent 45%),radial-gradient(circle at 100% 0%,#e7eef3 0%,transparent 42%),var(--bg);
    color:var(--ink); line-height:1.62; -webkit-font-smoothing:antialiased; padding:0 0 84px;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  .wrap{max-width:820px;margin:0 auto;}

  header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:14px 20px 11px;}
  .brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:11px;}
  .brand h1{font-size:17px;font-weight:700;letter-spacing:-.01em;}
  .brand .tag{font-size:11px;font-weight:600;color:#fff;background:var(--a);border-radius:999px;padding:3px 11px;}
  .brand .ver{font-size:11px;color:var(--faint);margin-left:auto;}
  .tools{display:flex;gap:6px;align-self:center;}
  .tbtn{font-family:inherit;font-size:12.5px;font-weight:500;border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:9px;padding:5px 9px;cursor:pointer;line-height:1;white-space:nowrap;text-decoration:none;display:inline-block;}
  .tbtn:hover{background:#f1f5f7;color:var(--ink);}
  .tbtn.alt{border-color:var(--a);color:var(--a);background:var(--a-soft);font-weight:600;}
  .search{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:11px 15px;transition:border-color .15s,box-shadow .15s;}
  .search:focus-within{border-color:var(--a);box-shadow:0 0 0 4px rgba(13,110,140,.12);}
  .search svg{flex:none;color:var(--faint);}
  .search input{border:0;outline:0;font:inherit;font-size:15px;width:100%;background:transparent;color:var(--ink);}
  .search input::placeholder{color:var(--faint);}
  .search .clr{cursor:pointer;color:var(--faint);font-size:18px;line-height:1;padding:0 2px;display:none;}

  #view{max-width:820px;margin:18px auto 0;padding:0 20px;}
  .panel{display:none;} .panel.active{display:block;}
  .modehint{font-size:12.5px;color:var(--sub);margin:0 0 16px;line-height:1.6;}
  .modehint b{color:var(--ink);}

  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));}
  .tabbar button{flex:1;border:0;background:transparent;padding:7px 2px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--faint);font:inherit;font-size:10.5px;font-weight:600;cursor:pointer;transition:color .15s;}
  .tabbar button .ic{font-size:18px;line-height:1;}
  .tabbar button .tsub{font-size:8px;font-weight:500;line-height:1;opacity:.8;}
  .tabbar button[data-active="true"]{color:var(--a);}
  @media(max-width:400px){.tabbar button{font-size:9.5px;} .tabbar button .ic{font-size:16px;} .tabbar button .tsub{display:none;}}

  .hero{color:#fff;border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow);}
  .hero.teal{background:linear-gradient(135deg,#0a2f40,#0e5670);}
  .hero.green{background:linear-gradient(135deg,#103a2c,#14784e);}
  .hero.amber{background:linear-gradient(135deg,#5a3a0f,#a8650f);}
  .hero.indigo{background:linear-gradient(135deg,#23215a,#4a3fae);}
  .hero.slate{background:linear-gradient(135deg,#1b2433,#33485c);}
  .hero .pb{display:inline-block;font-size:10.5px;font-weight:700;color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:3px 10px;margin-bottom:9px;}
  .hero h2{font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.35;}
  .hero p{font-size:12.5px;color:rgba(255,255,255,.82);margin-top:7px;line-height:1.6;}

  .facts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px;}
  @media(max-width:540px){.facts{grid-template-columns:1fr;}}
  .fact{background:#fff;border:1px solid var(--line);border-left:4px solid var(--a);border-radius:12px;padding:11px 13px;box-shadow:var(--shadow);}
  .fact .fl{font-size:10.5px;font-weight:700;color:var(--a);letter-spacing:.02em;}
  .fact .fv{font-size:13.5px;font-weight:500;color:var(--ink);margin-top:3px;line-height:1.5;}
  .fact .fv b{color:var(--a);font-weight:700;}

  .acc{background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden;}
  .acc>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 16px;font-size:14.5px;font-weight:700;}
  .acc>summary::-webkit-details-marker{display:none;}
  .acc>summary .pi{font-size:17px;}
  .acc>summary .ar{margin-left:auto;font-size:12px;color:var(--faint);transition:transform .2s;}
  .acc[open]>summary .ar{transform:rotate(90deg);}
  .acc .pin{padding:2px 16px 15px;}
  .acc .row{font-size:13px;color:#3a4651;line-height:1.62;padding:7px 0 7px 15px;position:relative;border-top:1px dashed #eef2f6;}
  .acc .row:first-child{border-top:0;}
  .acc .row::before{content:"";position:absolute;left:2px;top:13px;width:6px;height:6px;border-radius:50%;background:var(--a);}
  .acc .row b{color:var(--ink);font-weight:600;}
  .acc .row .k{display:inline-block;min-width:92px;color:var(--faint);font-weight:600;}

  .dosetbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px;}
  .dosetbl th{background:var(--a-soft);color:var(--a);font-weight:700;text-align:left;padding:7px 9px;font-size:11.5px;border-bottom:1px solid var(--line);}
  .dosetbl td{padding:7px 9px;border-bottom:1px solid var(--line);color:#3a4651;}
  .dosetbl tr:last-child td{border-bottom:0;}
  .dosetbl .v{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--a);}

  .sec{display:flex;align-items:center;gap:10px;margin:26px 0 13px;}
  .sec .bar{width:4px;height:18px;border-radius:3px;background:var(--a-bar);}
  .sec.g .bar{background:var(--ok);} .sec.r .bar{background:var(--no);} .sec.w .bar{background:var(--warn);} .sec.b .bar{background:var(--b-bar);}
  .sec h3{font-size:15px;font-weight:700;letter-spacing:-.01em;}

  .callout{border-radius:13px;padding:13px 15px;margin-bottom:14px;font-size:13px;line-height:1.62;border:1px solid var(--line);}
  .callout .ch{font-size:12px;font-weight:700;margin-bottom:5px;display:flex;align-items:center;gap:7px;}
  .callout.info{background:var(--a-soft);border-color:#cae6ee;color:#0c4456;} .callout.info .ch{color:var(--a);}
  .callout.ok{background:var(--ok-soft);border-color:#cce9da;color:#0f4631;} .callout.ok .ch{color:var(--ok);}
  .callout.warn{background:var(--warn-soft);border-color:#f6d3b3;color:#7a3a0e;} .callout.warn .ch{color:var(--warn);}
  .callout.no{background:var(--no-soft);border-color:#f3d2d2;color:#7c2a2a;} .callout.no .ch{color:var(--no);}
  .callout.note{background:var(--note-soft);border-color:#efe0b6;color:#6a4d12;} .callout.note .ch{color:var(--note);}
  .callout b{font-weight:700;}

  .duo{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:16px;}
  @media(max-width:520px){.duo{grid-template-columns:1fr;}}
  .duocard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 15px;box-shadow:var(--shadow);}
  .duocard.safe{border-top:4px solid var(--ok);} .duocard.risk{border-top:4px solid var(--no);}
  .duocard .dt{font-size:14px;font-weight:700;margin-bottom:5px;}
  .duocard.safe .dt{color:var(--ok);} .duocard.risk .dt{color:var(--no);}
  .duocard .dd{font-size:12.5px;color:#46535f;line-height:1.6;}

  .principles{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-bottom:16px;}
  @media(max-width:640px){.principles{grid-template-columns:repeat(2,1fr);}}
  .pr{background:#fff;border:1px solid var(--line);border-top:4px solid var(--a);border-radius:13px;padding:12px 11px;box-shadow:var(--shadow);}
  .pr .pn{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:11px;color:var(--a);}
  .pr .pt{font-size:13px;font-weight:700;margin:4px 0 5px;line-height:1.35;}
  .pr .pd{font-size:11.5px;color:var(--sub);line-height:1.5;}
  .pr.warnp{border-top-color:var(--no);} .pr.warnp .pn,.pr.warnp .pt{color:var(--no);}

  .ctbl{width:100%;border-collapse:collapse;margin-bottom:16px;font-size:12.5px;background:#fff;border-radius:12px;overflow:hidden;box-shadow:var(--shadow);}
  .ctbl th{background:#f2f6f8;color:var(--sub);font-weight:700;text-align:left;padding:9px 11px;font-size:11.5px;border-bottom:1px solid var(--line);}
  .ctbl th.hl{background:var(--a-soft);color:var(--a);}
  .ctbl td{padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:top;color:#3a4651;}
  .ctbl tr:last-child td{border-bottom:0;}
  .ctbl td.hl{background:#f4fafc;color:var(--ink);font-weight:600;}
  .ctbl .em{color:var(--no);font-weight:700;}

  .flags{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px;}
  @media(max-width:520px){.flags{grid-template-columns:1fr;}}
  .flag{display:flex;gap:10px;background:var(--no-soft);border:1px solid #f3d2d2;border-radius:12px;padding:11px 13px;}
  .flag .fi{font-size:18px;flex:none;}
  .flag .ft{font-size:12.5px;color:#7c2a2a;line-height:1.5;}
  .flag .ft b{color:#a02323;font-weight:700;}

  .phases{display:flex;flex-direction:column;gap:11px;margin-bottom:16px;}
  .phase{background:#fff;border:1px solid var(--line);border-left:5px solid var(--cc,var(--a));border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);}
  .phase .ph{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:6px;}
  .phase .pl{font-size:15px;font-weight:800;letter-spacing:-.01em;color:var(--cc,var(--a));}
  .phase .pp{font-size:11.5px;font-family:'IBM Plex Mono',monospace;color:var(--faint);}
  .phase .pb2{font-size:12.5px;color:#46535f;line-height:1.62;}
  .phase ul{list-style:none;margin-top:7px;display:grid;gap:5px;}
  .phase li{font-size:12.5px;color:#3a4651;padding-left:15px;position:relative;line-height:1.55;}
  .phase li::before{content:"\25B8";position:absolute;left:0;color:var(--cc,var(--a));}
  .phase li b{color:var(--ink);}

  .ladder{display:grid;gap:7px;margin:8px 0 0;}
  .lstep{display:flex;align-items:center;gap:11px;background:#f4fafc;border:1px solid #d8ecf2;border-radius:10px;padding:8px 12px;}
  .lstep .lw{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:11.5px;color:var(--a);flex:none;width:54px;}
  .lstep .ld{font-size:12.5px;color:#3a4651;}
  .lstep .ld b{color:var(--ink);}

  .triage{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
  @media(max-width:640px){.triage{grid-template-columns:1fr;}}
  .tcol{border-radius:13px;padding:12px 13px;border:1px solid var(--line);}
  .tcol.early{background:var(--ok-soft);border-color:#cce9da;}
  .tcol.delay{background:var(--note-soft);border-color:#efe0b6;}
  .tcol.avoid{background:var(--no-soft);border-color:#f3d2d2;}
  .tcol .tch{font-size:12.5px;font-weight:700;margin-bottom:8px;}
  .tcol.early .tch{color:var(--ok);} .tcol.delay .tch{color:var(--note);} .tcol.avoid .tch{color:var(--no);}
  .tcol .ti{background:#fff;border:1px solid rgba(0,0,0,.05);border-radius:9px;padding:8px 10px;margin-bottom:7px;font-size:12px;line-height:1.5;color:#3a4651;}
  .tcol .ti:last-child{margin-bottom:0;}
  .tcol .ti b{color:var(--ink);}

  .terms{display:flex;flex-direction:column;gap:8px;margin-bottom:8px;}
  .term{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 13px;box-shadow:var(--shadow);}
  .term .tt{font-size:13px;font-weight:700;color:var(--a);}
  .term .tt span{font-weight:500;color:var(--faint);font-size:11.5px;}
  .term .td{font-size:12.5px;color:var(--sub);line-height:1.56;margin-top:3px;}

  /* 재활 트랙 토글 */
  .rtrack{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  .rtile{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;cursor:pointer;box-shadow:var(--shadow);transition:all .18s;font-family:inherit;}
  .rtile .iti{font-size:20px;}
  .rtile .itt{font-size:14px;font-weight:700;color:var(--ink);}
  .rtile .its{font-size:11px;color:var(--faint);line-height:1.4;}
  .rtile.active{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 4px 14px -6px var(--ok);}
  .rtile.active .itt{color:var(--ok);}
  .rtile.mfc.active{border-color:var(--a);background:var(--a-soft);box-shadow:0 4px 14px -6px var(--a);}
  .rtile.mfc.active .itt{color:var(--a);}
  .rview{display:none;} .rview.active{display:block;animation:rise .35s cubic-bezier(.2,.7,.3,1) both;}
  @keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

  /* PDF 이미지 갤러리 */
  .pdfgal{display:grid;gap:12px;margin-bottom:14px;}
  .pdfslide{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;}
  .pdfslide img{width:100%;display:block;}
  .pdfslide .cap{font-size:11.5px;color:var(--faint);padding:8px 13px;border-top:1px solid var(--line);font-family:'IBM Plex Mono',monospace;}
  .lightnote{background:#f7f9fb;border:1px dashed var(--line);border-radius:12px;padding:14px 16px;font-size:13px;color:var(--sub);line-height:1.6;margin-bottom:14px;}
  .lightnote b{color:var(--ink);}

  /* 실손 세대/슬롯 */
  .genc{background:#fff;border:1px solid var(--line);border-left:5px solid var(--cc);border-radius:14px;padding:13px 15px;box-shadow:var(--shadow);margin-bottom:10px;}
  .genc .gh{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;}
  .genc .gg{font-size:16px;font-weight:800;letter-spacing:-.01em;}
  .genc .gp{font-size:11.5px;color:var(--faint);font-family:'IBM Plex Mono',monospace;}
  .genc .gn{font-size:12.5px;font-weight:600;color:var(--sub);margin:1px 0 8px;}
  .genc .grow{display:flex;gap:8px;font-size:12.5px;padding:4px 0;border-top:1px dashed #eef2f6;}
  .genc .gl{flex:none;width:80px;color:var(--faint);font-weight:600;}
  .genc .gv{flex:1;color:var(--ink);line-height:1.5;}

  .slot{background:#fff;border:1px solid var(--line);border-left:5px solid var(--b-bar);border-radius:15px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden;}
  .slot>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:flex-start;gap:10px;}
  .slot>summary::-webkit-details-marker{display:none;}
  .slot .sc{flex:1;min-width:0;}
  .slot .stag{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:12px;color:var(--b);}
  .slot .stitle{font-size:14.5px;font-weight:700;line-height:1.4;margin-top:3px;}
  .slot .ssub{font-size:12px;color:var(--sub);margin-top:4px;line-height:1.45;}
  .slot .car{flex:none;color:var(--faint);font-size:14px;margin-top:4px;transition:transform .2s;}
  .slot[open] .car{transform:rotate(90deg);}
  .slot .sbody{padding:2px 16px 16px;}
  .slot .reason{background:var(--no-soft);border:1px solid #f3d2d2;border-radius:10px;padding:10px 12px;margin:6px 0 10px;font-size:12.5px;color:#7c2a2a;line-height:1.55;}
  .slot .reason b{color:var(--no);}
  .slot .rebut{background:var(--a-soft);border:1px solid #cae6ee;border-radius:10px;padding:11px 13px;font-size:13px;color:#0c4456;line-height:1.64;}
  .slot .rebut b{color:var(--a);font-weight:700;}
  .slot .feas{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;margin-top:9px;}
  .slot .feas.hi{background:var(--ok-soft);color:var(--ok);}
  .slot .feas.mid{background:var(--note-soft);color:var(--note);}
  .slot .feas.lo{background:var(--no-soft);color:var(--no);}

  /* 논문 */
  .pfilter,.qfilter{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px;}
  .chip{font-size:12.5px;font-weight:600;cursor:pointer;border:1.5px solid var(--line);background:#fff;color:var(--sub);border-radius:999px;padding:6px 13px;transition:all .15s;user-select:none;}
  .chip:hover{border-color:#c4d2da;}
  .chip[data-active="true"]{background:var(--a);color:#fff;border-color:var(--a);}
  .paper{background:#fff;border:1px solid var(--line);border-left:5px solid var(--cc,var(--a));border-radius:14px;box-shadow:var(--shadow);margin-bottom:11px;overflow:hidden;}
  .paper>summary{list-style:none;cursor:pointer;padding:13px 15px;display:flex;gap:11px;align-items:flex-start;}
  .paper>summary::-webkit-details-marker{display:none;}
  .paper .pcat{flex:none;font-size:10px;font-weight:700;color:#fff;background:var(--cc,var(--a));border-radius:7px;padding:4px 7px;line-height:1.2;text-align:center;min-width:46px;margin-top:2px;}
  .paper .pmain{flex:1;min-width:0;}
  .paper .ptitle{font-size:14px;font-weight:600;line-height:1.42;letter-spacing:-.01em;}
  .paper .pmeta{font-size:11.5px;color:var(--faint);margin-top:5px;font-family:'IBM Plex Mono',monospace;display:flex;flex-wrap:wrap;gap:5px 10px;}
  .paper .pmeta b{color:var(--sub);}
  .paper .pmeta.au{text-transform:none;}
  .paper .car{flex:none;color:var(--faint);font-size:13px;margin-top:4px;transition:transform .2s;}
  .paper[open] .car{transform:rotate(90deg);}
  .paper .pbody{border-top:1px solid #eef2f7;padding:12px 15px 14px;}
  .paper .pkey{font-size:13px;color:#33424f;line-height:1.66;}
  .paper .pkey b{color:var(--ink);font-weight:600;}
  .paper .ptags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .paper .ptags span{font-size:11px;color:#46535f;background:#f2f6f8;border:1px solid var(--line);border-radius:8px;padding:3px 8px;}
  .paper .plink{display:inline-flex;align-items:center;gap:6px;margin-top:11px;margin-right:8px;font-size:12px;font-weight:600;color:var(--a);text-decoration:none;border:1px solid #cae6ee;background:var(--a-soft);border-radius:9px;padding:7px 12px;}

function ptmatGrid(){
  if(typeof PTMAT==='undefined'||!PTMAT.length){return '<div class="lightnote">시각자료를 불러올 수 없습니다.</div>';}
  return '<div class="pmgrid">'+PTMAT.map(function(m){
    var thumb=(MODE==='full'&&m.thumb)?'style="background-image:url('+m.thumb+')"':'';
    var note=(MODE==='full')?'':'<div class="pmdesc" style="color:var(--warn)">⚠ 시각 이미지는 Full 버전에서 표시됩니다.</div>';
    return '<a class="pmcard" href="'+m.file+'"><div class="pmthumb" '+thumb+'><span class="pmnum">'+m.num+'</span><span class="pmtag">'+m.tag+'</span></div>'+
      '<div class="pmbody"><div class="pmtitle">'+m.title+'<span class="arr">→</span></div>'+
      '<div class="pmdesc">'+m.desc+'</div>'+note+
      '<div class="pmmeta">'+m.meta.map(function(x){return '<span>'+x+'</span>';}).join('')+'</div></div></a>';
  }).join('')+'</div>';
}
function matHTML(m,i){
  return '<details class="mat"'+(i===0?' open':'')+'><summary><span class="mi">'+m.ic+'</span><div class="mm"><div class="mt">'+m.t+'</div><div class="ms">'+m.s+'</div></div><span class="car">▶</span></summary>'+
    '<div class="mbody">'+m.points.map(function(p){return '<div class="point">'+p+'</div>';}).join('')+
    '<button class="copy" data-copy="'+escAttr(m.copy)+'">📋 환자 설명 멘트 복사</button></div></details>';
}

function buildPapers(filter){
  var box=document.getElementById('panel-papers');
  if(!box.dataset.init){
    var hh=hero('slate','📚 카티스템 근거자료 라이브러리','동료심사 학술논문 '+PAPERS.length+'편 · 카테고리별',
      'RCT·BMAC 비교·HTO 병행·안전성·메타분석·술기·비용까지. 카드를 눌러 핵심 결과를 확인하고, PMID는 PubMed로, PubMed 미색인 논문은 PDF로 제공합니다.');
    var chips='<div class="pfilter" id="pfilter"><span class="chip" data-pf="all" data-active="true">전체 '+PAPERS.length+'</span>';
    Object.keys(PCAT).forEach(function(k){
      var n=PAPERS.filter(function(p){return p.cat===k;}).length;
      if(n)chips+='<span class="chip" data-pf="'+k+'">'+PCAT[k].label+' '+n+'</span>';
    });
    chips+='</div>';
    box.innerHTML=hh+chips+'<div id="plist"></div>';
    box.dataset.init='1';
  }
  var f=filter||'all';
  var list=PAPERS.filter(function(p){return f==='all'||p.cat===f;});
  document.getElementById('plist').innerHTML=list.map(paperHTML).join('');
}
function paperHTML(p){
  var c=PCAT[p.cat];
  var meta=['<b>'+p.journal+'</b>',p.year];
  if(p.ifv)meta.push('IF '+p.ifv);
  if(p.pmid)meta.push('PMID '+p.pmid);
  var links='';
  if(p.pmid)links+='<a class="plink" href="https://pubmed.ncbi.nlm.nih.gov/'+p.pmid+'/" target="_blank" rel="noopener">🔗 PubMed (PMID '+p.pmid+')</a>';
  if(p.pdf){
    if(MODE==='full'&&PAPER_PDF[p.pdf]){
      links+='<a class="plink pdf" href="'+PAPER_PDF[p.pdf]+'" download="'+p.pdf+'.pdf">⬇ PDF 다운로드</a>';
    }else{
      links+='<span class="plink pdf">📄 PDF는 Full 버전에서 제공</span>';
    }
  }
  return '<details class="paper" style="--cc:'+c.color+'"><summary><span class="pcat" style="background:'+c.color+'">'+c.label+'</span>'+
    '<div class="pmain"><div class="ptitle">'+p.title+'</div><div class="pmeta">'+meta.join(' · ')+'</div>'+
    (p.authors?'<div class="pmeta au">'+p.authors+'</div>':'')+'</div><span class="car">▶</span></summary>'+
    '<div class="pbody"><div class="pkey">'+p.key+'</div>'+
    '<div class="ptags">'+p.tags.map(function(t){return '<span>'+t+'</span>';}).join('')+'</div>'+links+'</div></details>';
}

function buildQna(filter){
  var box=document.getElementById('panel-qna');
  if(!box.dataset.init){
    var hh=hero('teal','💬 환자 Q&A 모음','자주 묻는 질문 + 의학적으로 정확한 답변',
      '환자가 흔히 묻는 질문과, 의료진이 줄 수 있는 정확한 답변입니다. 각 항목의 <b>임상 메모</b>는 의사용 근거·주의점입니다.');
    var chips='<div class="qfilter" id="qfilter"><span class="chip" data-qf="all" data-active="true">전체 '+QNA.length+'</span>';
    Object.keys(QCAT).forEach(function(k){
      var n=QNA.filter(function(p){return p.cat===k;}).length;
      if(n)chips+='<span class="chip" data-qf="'+k+'">'+QCAT[k]+' '+n+'</span>';
    });
    chips+='</div>';
    box.innerHTML=hh+chips+'<div id="qlist"></div>';
    box.dataset.init='1';
  }
  var f=filter||'all';
  var list=QNA.map(function(q,i){return {q:q,i:i};}).filter(function(o){return f==='all'||o.q.cat===f;});
  document.getElementById('qlist').innerHTML=list.map(function(o){return qnaHTML(o.q,o.i);}).join('');
}
function qnaHTML(q,i){
  return '<details class="faq"><summary><span class="num">'+(i+1)+'</span><div class="qt"><span class="ctag">'+QCAT[q.cat]+'</span><div class="qx">'+q.q+'</div></div><span class="car">▶</span></summary>'+
    '<div class="ans">'+q.a+'</div>'+
    '<div class="clin"><div class="cl">🩺 임상 메모 (의료진용)</div><p>'+q.clin+'</p></div></details>';
}

function secHead(cls,t){return '<div class="sec '+cls+'"><span class="bar"></span><h3>'+t+'</h3></div>';}

var BUILT={};
function ensureBuilt(name){
  if(BUILT[name])return;
  if(name==='product')buildProduct();
  else if(name==='rehab')buildRehab();
  else if(name==='insurance')buildInsurance();
  else if(name==='consult')buildConsult();
  else if(name==='papers')buildPapers();
  else if(name==='qna')buildQna();
  BUILT[name]=1;
}
function showTab(name){
  ensureBuilt(name);
  document.querySelectorAll('.panel').forEach(function(p){p.classList.toggle('active',p.id==='panel-'+name);});
  document.querySelectorAll('.tabbar button').forEach(function(b){b.setAttribute('data-active', b.dataset.tab===name?'true':'false');});
  try{history.replaceState(null,'','#'+name);}catch(e){}
  window.scrollTo(0,0);
}
document.querySelectorAll('.tabbar button').forEach(function(b){b.addEventListener('click',function(){var g=document.getElementById('gsearch');g.value='';document.getElementById('gclr').style.display='none';showTab(this.dataset.tab);});});

/* ---------- 클릭 위임 (필터·복사·재활트랙·검색결과) ---------- */
document.addEventListener('click',function(e){
  var pf=e.target.closest&&e.target.closest('#pfilter .chip');
  if(pf){document.querySelectorAll('#pfilter .chip').forEach(function(c){c.setAttribute('data-active',c===pf?'true':'false');});buildPapers(pf.dataset.pf);return;}
  var qf=e.target.closest&&e.target.closest('#qfilter .chip');
  if(qf){document.querySelectorAll('#qfilter .chip').forEach(function(c){c.setAttribute('data-active',c===qf?'true':'false');});buildQna(qf.dataset.qf);return;}
  var rt=e.target.closest&&e.target.closest('.rtile');
  if(rt){var v=rt.dataset.rt;
    document.querySelectorAll('.rtile').forEach(function(t){t.classList.toggle('active',t.dataset.rt===v);});
    document.querySelectorAll('.rview').forEach(function(p){p.classList.toggle('active',p.id==='rv-'+v);});
    window.scrollTo(0,0);return;}
  var cp=e.target.closest&&e.target.closest('.copy');
  if(cp){copyText(cp.getAttribute('data-copy'));return;}
  var r=e.target.closest&&e.target.closest('.searchres');
  if(r){showTab(r.dataset.tab);return;}
});

/* ---------- 복사 / 토스트 ---------- */
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},1700);}
function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast('복사되었습니다.');},function(){fbcopy(t);});}
  else fbcopy(t);
}
function fbcopy(t){var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('복사되었습니다.');}catch(e){toast('복사 실패');}document.body.removeChild(ta);}

  QNA.forEach(function(q){idx.push({type:'환자 Q&A',tab:'qna',title:q.q,sub:QCAT[q.cat]+' · 임상 메모 포함',hay:(q.q+' '+stripHTML(q.a)+' '+q.clin+' '+QCAT[q.cat]).toLowerCase()});});

  MATERIALS.forEach(function(m){idx.push({type:'상담자료',tab:'consult',title:m.t,sub:m.s,hay:(m.t+' '+m.s+' '+m.points.map(stripHTML).join(' ')+' '+m.copy).toLowerCase()});});

function renderSearch(term){
  var box=document.getElementById('panel-search');
  var raw=(term||'').trim().toLowerCase();
  if(!raw){box.innerHTML='<p class="modehint">논문 제목·저자·PMID, 환자 Q&amp;A, 재활 키워드(신전지연·OKC·MFC), 실손 슬롯, 제품정보를 한 번에 검색합니다.</p>';return;}
  if(!SEARCH_IDX)SEARCH_IDX=buildSearchIndex();
  var toks=raw.split(/\s+/).filter(Boolean);
  var hits=SEARCH_IDX.map(function(it){var s=0;toks.forEach(function(t){if(it.hay.indexOf(t)>-1)s++;});return {it:it,s:s};}).filter(function(o){return o.s>0;});
  hits.sort(function(a,b){return b.s-a.s;});
  if(!hits.length){box.innerHTML='<div class="empty">"'+term+'" 검색 결과가 없습니다.<br><span style="font-size:12px">다른 키워드 (예: HTO, BMAC, 신전지연, 소멸시효)</span></div>';return;}
  var by={};hits.forEach(function(o){(by[o.it.type]=by[o.it.type]||[]).push(o.it);});
  var html='<p class="modehint">"'+term+'" 검색 결과 <b>'+hits.length+'</b>건 — 항목을 누르면 해당 탭으로 이동합니다.</p>';
  Object.keys(by).forEach(function(type){
    html+=secHead('','<span style="font-size:13px">'+type+' <span class="mono" style="color:var(--faint);font-size:11px">'+by[type].length+'</span></span>');
    html+=by[type].map(function(it){
      return '<button class="searchres" data-tab="'+it.tab+'"><div class="srt">'+it.title+'</div><div class="srs">'+it.sub+' &nbsp;›&nbsp; '+it.tab+' 탭에서 보기</div></button>';
    }).join('');
  });
  box.innerHTML=html;
}
function runSearch(){
  var g=document.getElementById('gsearch');var v=g.value;
  document.getElementById('gclr').style.display=v?'block':'none';
  if(!v.trim()){var cur=(location.hash||'#product').slice(1);if(cur==='search')cur='product';showTab(cur);return;}
  renderSearch(v);
  document.querySelectorAll('.panel').forEach(function(p){p.classList.toggle('active',p.id==='panel-search');});
  document.querySelectorAll('.tabbar button').forEach(function(b){b.setAttribute('data-active','false');});
}
var gs=document.getElementById('gsearch');
['input','compositionend','keyup','change'].forEach(function(ev){gs.addEventListener(ev,runSearch);});
