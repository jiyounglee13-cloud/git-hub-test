<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>카티스템 상담 페르소나 브리핑 v1.1</title>
<style>
/* ===== BASE TOKENS ===== */
:root {
  --clr-primary: #1a5276;
  --clr-primary-light: #2980b9;
  --clr-primary-bg: #eaf3fb;
  --clr-accent: #1e8449;
  --clr-accent-bg: #eafaf1;
  --clr-warn: #b7770d;
  --clr-warn-bg: #fef9e7;
  --clr-danger: #922b21;
  --clr-danger-bg: #fdedec;
  --clr-neutral-50: #f8f9fa;
  --clr-neutral-100: #e9ecef;
  --clr-neutral-200: #dee2e6;
  --clr-neutral-400: #868e96;
  --clr-neutral-600: #495057;
  --clr-neutral-800: #212529;
  --clr-A1: #c0392b; --clr-A1-bg: #fdecea;
  --clr-A2: #1a7abf; --clr-A2-bg: #e8f4fd;
  --clr-A3: #7d6608; --clr-A3-bg: #fef9e7;
  --clr-A4: #6c3483; --clr-A4-bg: #f5eef8;
  --clr-B1: #1e8449; --clr-B1-bg: #eafaf1;
  --clr-B2: #b7770d; --clr-B2-bg: #fef9e7;
  --clr-B3: #1a5276; --clr-B3-bg: #eaf3fb;
  --clr-B4: #4a235a; --clr-B4-bg: #f5eef8;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --shadow-card: 0 2px 12px rgba(0,0,0,0.10);
  --shadow-hover: 0 4px 20px rgba(0,0,0,0.15);
  --font-base: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', '맑은 고딕', sans-serif;
  --touch-min: 44px;
  --transition: 0.2s ease;
}

/* ===== RESET ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font-base);
  background: #f0f4f8;
  color: var(--clr-neutral-800);
  min-height: 100vh;
  line-height: 1.6;
}
button, select, input { font-family: inherit; }
button { cursor: pointer; border: none; background: none; }
ul, ol { list-style: none; }

/* ===== LAYOUT ===== */
.app-wrap {
  max-width: 960px;
  margin: 0 auto;
  padding: 16px;
}
@media (min-width: 768px) {
  .app-wrap { padding: 24px 32px; }
}

/* ===== HEADER ===== */
.app-header {
  background: var(--clr-primary);
  color: #fff;
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  padding: 20px 24px 16px;
  position: relative;
}
.app-header h1 {
  font-size: 1.25rem;
  font-weight: 700;
  letter-spacing: -0.02em;
}
.app-header .subtitle {
  font-size: 0.8rem;
  opacity: 0.85;
  margin-top: 4px;
}
.privacy-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 20px;
  padding: 3px 10px;
  font-size: 0.72rem;
  margin-top: 10px;
  color: #fff;
}
.privacy-badge::before { content: '🔒'; font-size: 0.8em; }

/* ===== FORM SECTION ===== */
.form-section {
  background: #fff;
  padding: 24px;
  border-radius: 0 0 var(--radius-lg) var(--radius-lg);
  box-shadow: var(--shadow-card);
}
.progress-bar-wrap {
  margin-bottom: 24px;
}
.progress-label {
  display: flex;
  justify-content: space-between;
  font-size: 0.78rem;
  color: var(--clr-neutral-400);
  margin-bottom: 6px;
}
.progress-bar {
  height: 6px;
  background: var(--clr-neutral-100);
  border-radius: 3px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--clr-primary-light);
  border-radius: 3px;
  transition: width 0.4s ease;
  width: 0%;
}
.form-grid {
  display: grid;
  gap: 20px;
}
@media (min-width: 768px) {
  .form-grid { grid-template-columns: 1fr 1fr; }
  .form-grid .span2 { grid-column: 1 / -1; }
}
.field-group { display: flex; flex-direction: column; gap: 8px; }
.field-label {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--clr-neutral-600);
  display: flex;
  align-items: center;
  gap: 6px;
}
.field-label .req { color: var(--clr-primary-light); font-size: 0.75rem; }
.field-label .hint { font-weight: 400; color: var(--clr-neutral-400); font-size: 0.75rem; }

/* CHIP SELECT (단일 선택) */
.chip-group {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.chip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: var(--touch-min);
  padding: 8px 14px;
  border: 1.5px solid var(--clr-neutral-200);
  border-radius: 22px;
  font-size: 0.82rem;
  color: var(--clr-neutral-600);
  background: #fff;
  transition: all var(--transition);
  user-select: none;
  -webkit-user-select: none;
  cursor: pointer;
  text-align: center;
  line-height: 1.3;
}
.chip:hover { border-color: var(--clr-primary-light); color: var(--clr-primary); }
.chip.selected {
  background: var(--clr-primary);
  border-color: var(--clr-primary);
  color: #fff;
  font-weight: 600;
}
.chip.multi-chip.selected {
  background: var(--clr-accent);
  border-color: var(--clr-accent);
}

/* ===== SUBMIT BUTTON ===== */
.submit-wrap {
  margin-top: 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
.btn-submit {
  width: 100%;
  max-width: 400px;
  min-height: var(--touch-min);
  background: var(--clr-primary);
  color: #fff;
  border-radius: var(--radius-md);
  font-size: 1rem;
  font-weight: 700;
  padding: 14px 24px;
  transition: background var(--transition), transform 0.1s;
  box-shadow: 0 2px 8px rgba(26,82,118,0.3);
}
.btn-submit:hover { background: var(--clr-primary-light); }
.btn-submit:active { transform: scale(0.98); }
.btn-submit:disabled { background: var(--clr-neutral-400); cursor: not-allowed; box-shadow: none; }
.validation-msg {
  font-size: 0.78rem;
  color: var(--clr-danger);
  text-align: center;
  min-height: 1.2em;
}

/* ===== RESULT SECTION ===== */
.result-section { display: none; margin-top: 24px; }
.result-section.visible { display: block; }

/* AXIS CHIP BAR */
.axis-bar {
  background: #fff;
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  padding: 16px 20px 0;
  box-shadow: var(--shadow-card);
}
.axis-bar-title {
  font-size: 0.72rem;
  color: var(--clr-neutral-400);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin-bottom: 10px;
}
.axis-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--clr-neutral-100);
}
.axis-row + .axis-row { border-bottom: none; padding-top: 10px; }
.axis-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 12px;
  border-radius: 16px;
  font-size: 0.78rem;
  font-weight: 500;
  border: 1.5px solid transparent;
  cursor: pointer;
  transition: all var(--transition);
  min-height: 36px;
}
.axis-chip.A1 { color: var(--clr-A1); background: var(--clr-A1-bg); border-color: var(--clr-A1); }
.axis-chip.A2 { color: var(--clr-A2); background: var(--clr-A2-bg); border-color: var(--clr-A2); }
.axis-chip.A3 { color: var(--clr-A3); background: var(--clr-A3-bg); border-color: var(--clr-A3); }
.axis-chip.A4 { color: var(--clr-A4); background: var(--clr-A4-bg); border-color: var(--clr-A4); }
.axis-chip.B1 { color: var(--clr-B1); background: var(--clr-B1-bg); border-color: var(--clr-B1); }
.axis-chip.B2 { color: var(--clr-B2); background: var(--clr-B2-bg); border-color: var(--clr-B2); }
.axis-chip.B3 { color: var(--clr-B3); background: var(--clr-B3-bg); border-color: var(--clr-B3); }
.axis-chip.B4 { color: var(--clr-B4); background: var(--clr-B4-bg); border-color: var(--clr-B4); }
.axis-chip.active { box-shadow: 0 0 0 2px currentColor; font-weight: 700; }
.axis-chip.mixed-badge::after {
  content: '혼합';
  font-size: 0.65rem;
  background: currentColor;
  color: #fff;
  border-radius: 8px;
  padding: 1px 5px;
  margin-left: 3px;
}
.axis-chip.secondary-highlight { opacity: 0.75; border-style: dashed; }

/* BRIEF CARD */
.brief-card {
  background: #fff;
  border-radius: 0 0 var(--radius-lg) var(--radius-lg);
  box-shadow: var(--shadow-card);
  overflow: hidden;
}
.card-header {
  padding: 20px 24px 16px;
  border-bottom: 2px solid var(--clr-neutral-100);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.card-combo-title {
  font-size: 1.05rem;
  font-weight: 700;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  line-height: 1.4;
}
.combo-a-tag, .combo-b-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 12px;
  border-radius: 14px;
  font-size: 0.85rem;
  font-weight: 700;
}
.combo-x { color: var(--clr-neutral-400); font-weight: 400; font-size: 0.9rem; }
.variant-tag {
  font-size: 0.78rem;
  background: var(--clr-neutral-100);
  color: var(--clr-neutral-600);
  padding: 3px 10px;
  border-radius: 12px;
  font-weight: 500;
}
.match-quality {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.match-badge {
  font-size: 0.72rem;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 600;
}
.match-high { background: var(--clr-accent-bg); color: var(--clr-accent); }
.match-mid  { background: var(--clr-warn-bg); color: var(--clr-warn); }

/* CARD SECTIONS */
.card-body { padding: 20px 24px; display: flex; flex-direction: column; gap: 20px; }
.card-section {
  border-radius: var(--radius-md);
  padding: 16px 18px;
  background: var(--clr-neutral-50);
}
.card-section.story-section { background: var(--clr-primary-bg); }
.card-section.driver-section { background: var(--clr-accent-bg); }
.card-section.warn-section { background: var(--clr-warn-bg); border-left: 4px solid var(--clr-warn); }
.card-section.danger-section { background: var(--clr-danger-bg); border-left: 4px solid var(--clr-danger); }
.card-section.check-section { background: #fff; border: 1.5px dashed var(--clr-neutral-200); }
.section-head {
  font-size: 0.8rem;
  font-weight: 700;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  color: var(--clr-neutral-400);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.section-body { font-size: 0.88rem; line-height: 1.7; color: var(--clr-neutral-800); }
.section-body p + p { margin-top: 8px; }
.section-body .intro-cue {
  font-style: italic;
  color: var(--clr-primary);
  border-left: 3px solid var(--clr-primary-light);
  padding-left: 10px;
  margin-top: 8px;
}

/* QUESTION LIST */
.q-list { display: flex; flex-direction: column; gap: 10px; }
.q-item {
  background: #fff;
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  border: 1px solid var(--clr-neutral-100);
}
.q-item .q-text {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--clr-neutral-800);
  display: flex;
  align-items: flex-start;
  gap: 6px;
}
.q-item .q-text::before {
  content: 'Q';
  font-size: 0.7rem;
  font-weight: 700;
  background: var(--clr-primary-light);
  color: #fff;
  border-radius: 4px;
  padding: 1px 5px;
  flex-shrink: 0;
  margin-top: 2px;
}
.q-item .q-guide {
  font-size: 0.78rem;
  color: var(--clr-neutral-400);
  margin-top: 4px;
  padding-left: 24px;
}

/* STRATEGY SECTION */
.strategy-grid {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.strategy-item {
  display: flex;
  gap: 10px;
  align-items: flex-start;
}
.strategy-label {
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--clr-primary);
  background: var(--clr-primary-bg);
  border-radius: 6px;
  padding: 3px 8px;
  white-space: nowrap;
  min-width: 52px;
  text-align: center;
  flex-shrink: 0;
}
.strategy-text { font-size: 0.85rem; line-height: 1.6; color: var(--clr-neutral-800); }
.avoid-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.avoid-tag {
  font-size: 0.78rem;
  background: var(--clr-danger-bg);
  color: var(--clr-danger);
  border: 1px solid #f5b7b1;
  border-radius: 12px;
  padding: 3px 10px;
}

/* COMPLIANCE SECTION */
.compliance-list { display: flex; flex-direction: column; gap: 8px; }
.compliance-item {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  font-size: 0.82rem;
}
.compliance-item::before {
  content: '⚠';
  font-size: 0.9em;
  flex-shrink: 0;
  margin-top: 1px;
}

/* HOSPITAL CHECK */
.check-list { display: flex; flex-direction: column; gap: 8px; }
.check-item {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 0.83rem;
  padding: 8px 10px;
  background: var(--clr-neutral-50);
  border-radius: var(--radius-sm);
  border: 1px solid var(--clr-neutral-100);
}
.check-box {
  width: 20px; height: 20px;
  border: 1.5px solid var(--clr-neutral-200);
  border-radius: 4px;
  flex-shrink: 0;
}
.check-empty { font-size: 0.75rem; color: var(--clr-neutral-400); font-style: italic; }

/* SIGNAL SECTION */
.signal-list { display: flex; flex-direction: column; gap: 8px; }
.signal-item {
  font-size: 0.82rem;
  background: #fff;
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  border-left: 3px solid var(--clr-warn);
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.signal-trigger { font-weight: 600; color: var(--clr-neutral-800); }
.signal-action { color: var(--clr-warn); font-size: 0.78rem; }

/* DISCLAIMER */
.disclaimer {
  background: var(--clr-neutral-50);
  border-top: 1px solid var(--clr-neutral-100);
  padding: 14px 20px;
  border-radius: 0 0 var(--radius-lg) var(--radius-lg);
}
.disclaimer p {
  font-size: 0.72rem;
  color: var(--clr-neutral-400);
  line-height: 1.6;
}
.disclaimer .no-store {
  font-weight: 700;
  color: var(--clr-accent);
  display: flex;
  align-items: center;
  gap: 4px;
  margin-bottom: 6px;
  font-size: 0.75rem;
}

/* RESET BUTTON */
.reset-wrap { margin-top: 20px; text-align: center; }
.btn-reset {
  padding: 10px 24px;
  border: 1.5px solid var(--clr-neutral-200);
  border-radius: var(--radius-md);
  font-size: 0.85rem;
  color: var(--clr-neutral-600);
  background: #fff;
  transition: all var(--transition);
  min-height: var(--touch-min);
}
.btn-reset:hover { border-color: var(--clr-primary); color: var(--clr-primary); }

/* SECTION DIVIDER */
.section-divider {
  text-align: center;
  font-size: 0.75rem;
  color: var(--clr-neutral-400);
  margin: 4px 0;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

/* Scrollable card body on mobile */
@media (max-width: 767px) {
  .card-body { padding: 16px; }
  .card-header { padding: 16px; }
  .axis-bar { padding: 14px 16px 0; }
}
</style>
</head>
<body>
<div class="app-wrap">

  <!-- HEADER -->
  <header class="app-header">
    <h1>카티스템 상담 페르소나 브리핑</h1>
    <div class="subtitle">v1.1 · 2축 복합 페르소나 시스템 (손상 서사 × 의사결정 동인)</div>
    <div class="privacy-badge">본 도구는 어떤 정보도 저장하지 않습니다</div>
  </header>

  <!-- FORM SECTION -->
  <section class="form-section" id="formSection">
    <div class="progress-bar-wrap">
      <div class="progress-label">
        <span>입력 진행률</span>
        <span id="progressText">0 / 11</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <form id="consultForm" autocomplete="off">
      <div class="form-grid">

        <!-- 1. 연령대 -->
        <div class="field-group">
          <label class="field-label">
            <span>연령대</span>
            <span class="req">필수</span>
          </label>
          <div class="chip-group" data-field="ageGroup" data-type="single">
            <button type="button" class="chip" data-value="30s_under">30대 이하</button>
            <button type="button" class="chip" data-value="40s">40대</button>
            <button type="button" class="chip" data-value="50s">50대</button>
            <button type="button" class="chip" data-value="60s">60대</button>
            <button type="button" class="chip" data-value="70s_plus">70대 이상</button>
          </div>
        </div>

        <!-- 2. 성별 -->
        <div class="field-group">
          <label class="field-label">
            <span>성별</span>
            <span class="req">필수</span>
          </label>
          <div class="chip-group" data-field="gender" data-type="single">
            <button type="button" class="chip" data-value="male">남</button>
            <button type="button" class="chip" data-value="female">여</button>
            <button type="button" class="chip" data-value="na">미응답</button>
          </div>
        </div>

        <!-- 3. 손상 경위 -->
        <div class="field-group span2">
          <label class="field-label">
            <span>손상 경위</span>
            <span class="req">필수</span>
          </label>
          <div class="chip-group" data-field="injuryType" data-type="single">
            <button type="button" class="chip" data-value="acute_trauma">갑작스러운 부상 (운동·사고)</button>
            <button type="button" class="chip" data-value="sports_degenerate">운동을 즐겨왔는데 점차 악화</button>
            <button type="button" class="chip" data-value="labor_overuse">일·가사로 무릎을 많이 써서</button>
            <button type="button" class="chip" data-value="age_natural">특별한 계기 없이 나이 들며 서서히</button>
            <button type="button" class="chip" data-value="unknown">모름</button>
          </div>
        </div>

        <!-- 4. 통증 기간 -->
        <div class="field-group">
          <label class="field-label">
            <span>통증 기간</span>
            <span class="req">필수</span>
          </label>
          <div class="chip-group" data-field="painDuration" data-type="single">
            <button type="button" class="chip" data-value="under6m">6개월 미만</button>
            <button type="button" class="chip" data-value="6m_2y">6개월 ~ 2년</button>
            <button type="button" class="chip" data-value="over2y">2년 이상</button>
          </div>
        </div>

        <!-- 5. 활동 이력 -->
        <div class="field-group">
          <label class="field-label">
            <span>활동 이력</span>
            <span class="req">필수</span>
          </label>
          <div class="chip-group" data-field="activityHistory" data-type="single">
            <button type="button" class="chip" data-value="sedentary">평생 좌식 위주</button>
            <button type="button" class="chip" data-value="daily_activity">일상 활동 수준</button>
            <button type="button" class="chip" data-value="past_active">과거엔 활동적·지금은 제한</button>
            <button type="button" class="chip" data-value="current_regular">현재도 규칙적 운동</button>
            <button type="button" class="chip" data-value="high_sports">고강도 스포츠</button>
          </div>
        </div>

        <!-- 6. 치료 목표 (복수) -->
        <div class="field-group span2">
          <label class="field-label">
            <span>치료 목표</span>
            <span class="req">필수</span>
            <span class="hint">복수 선택 가능</span>
          </label>

/* ===== MATCHING ENGINE ===== */

function scoreNarratives(inputs) {
  const scores = { A1: 0, A2: 0, A3: 0, A4: 0 };

  // 손상 경위 ×4
  const injuryMap = {
    acute_trauma: { A1: 4 },
    sports_degenerate: { A2: 4 },
    labor_overuse: { A3: 4 },
    age_natural: { A4: 4 },
    unknown: { A4: 1 },
  };
  const ij = injuryMap[inputs.injuryType] || {};
  Object.entries(ij).forEach(([k, v]) => { scores[k] += v; });

  // 활동 이력 ×2
  const activityMap = {
    high_sports: { A1: 2, A2: 1 },
    current_regular: { A2: 2, A1: 1 },
    past_active: { A2: 2, A1: 1 },
    daily_activity: { A3: 1, A4: 1 },
    sedentary: { A3: 1, A4: 2 },
  };
  const am = activityMap[inputs.activityHistory] || {};
  Object.entries(am).forEach(([k, v]) => { scores[k] += v; });

  // 통증 기간 ×1
  const painMap = {
    under6m: { A1: 1 },
    '6m_2y': { A2: 1, A3: 1 },
    over2y: { A4: 1, A3: 1 },
  };
  const pm = painMap[inputs.painDuration] || {};
  Object.entries(pm).forEach(([k, v]) => { scores[k] += v; });

  // 연령대 ×1
  const ageMap = {
    '30s_under': { A1: 1 },
    '40s': { A1: 1, A2: 1 },
    '50s': { A2: 1, A3: 1 },
    '60s': { A3: 1, A4: 1 },
    '70s_plus': { A4: 1 },
  };
  const agm = ageMap[inputs.ageGroup] || {};
  Object.entries(agm).forEach(([k, v]) => { scores[k] += v; });

  return scores;
}

function scoreDrivers(inputs) {
  const scores = { B1: 0, B2: 0, B3: 0, B4: 0 };

  // 주요 우려 ×3
  const concernMap = {
    cost: { B2: 3 },
    insurance_coverage: { B2: 3 },
    surgery_safety: { B3: 3 },
    recovery_period: { B3: 2, B1: 1 },
    effect_duration: { B1: 3 },
    vs_other_treatment: { B4: 3 },
  };
  (inputs.mainConcern || []).forEach(c => {
    const cm = concernMap[c] || {};
    Object.entries(cm).forEach(([k, v]) => { scores[k] += v; });
  });

  // 치료 목표 ×3
  const goalMap = {
    pain_relief: { B3: 1, B2: 1 },
    sports_return: { B1: 3 },
    avoid_arthroplasty: { B1: 3 },
    work_return: { B2: 2, B3: 1 },
    daily_independence: { B3: 2, B4: 1 },
  };
  (inputs.treatmentGoal || []).forEach(g => {
    const gm = goalMap[g] || {};
    Object.entries(gm).forEach(([k, v]) => { scores[k] += v; });
  });

  // 의사결정 단계 ×2
  const stageMap = {
    first_explore: { B3: 2, B4: 1 },
    comparing: { B4: 2, B1: 1 },
    near_decided: { B2: 2, B1: 1 },
  };
  const sm = stageMap[inputs.decisionStage] || {};
  Object.entries(sm).forEach(([k, v]) => { scores[k] += v; });

  // 사전 정보 수준 ×2
  const infoMap = {
    know_little: { B3: 2 },
    researched: { B4: 2 },
    other_hospital: { B4: 2, B1: 1 },
  };
  const im = infoMap[inputs.infoLevel] || {};
  Object.entries(im).forEach(([k, v]) => { scores[k] += v; });

  // 실손 세대 ×1
  if (inputs.insurance && inputs.insurance !== 'none_unknown') {
    scores['B2'] += 1;
  }

  // 동반자 ×1
  const companionMap = {
    alone: { B4: 1 },
    spouse: { B3: 1 },
    child: { B3: 1 },
    other: {},
  };
  const coMap = companionMap[inputs.companion] || {};
  Object.entries(coMap).forEach(([k, v]) => { scores[k] += v; });

  return scores;
}

function getTopTwo(scores) {
  const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
  const first = sorted[0];
  const second = sorted[1];
  const gap = first[1] > 0 ? (first[1] - second[1]) / first[1] : 1;
  const isMixed = gap <= 0.15;
  return { first: first[0], second: second[0], isMixed, scores };
}

function resolveVariant(narrativeId, inputs) {
  const persona = NARRATIVE_PERSONAS[narrativeId];
  const g = inputs.gender;
  const a = inputs.ageGroup;
  const companion = inputs.companion;

  // Build ordered variant keys to check
  const keysToCheck = [];
  if (g === 'male' && (a === '50s')) keysToCheck.push('male_50s');
  if (g === 'male' && (a === '60s')) keysToCheck.push('male_60s');
  if (g === 'female' && (a === '50s')) keysToCheck.push('female_50s');
  if (g === 'female' && (a === '50s' || a === '60s')) keysToCheck.push('female_50s_plus');
  if (g === 'male') keysToCheck.push('male');
  if (g === 'female') keysToCheck.push('female');
  if (a === '70s_plus') keysToCheck.push('age_70s_plus');
  if (companion === 'child') keysToCheck.push('with_child_companion');
  if (companion === 'spouse') keysToCheck.push('with_spouse_companion');

  const appliedVariants = keysToCheck
    .filter(k => persona.variants && persona.variants[k])
    .map(k => persona.variants[k]);

  return appliedVariants;
}

function resolveDriverVariant(driverId, inputs) {
  const persona = DRIVER_PERSONAS[driverId];
  const g = inputs.gender;
  const keysToCheck = [];
  if (g === 'male') keysToCheck.push('male');
  if (g === 'female') keysToCheck.push('female');

  const appliedVariants = keysToCheck
    .filter(k => persona.variants && persona.variants[k])
    .map(k => persona.variants[k]);

  return appliedVariants;
}

function matchPersona(inputs) {
  const narrativeScores = scoreNarratives(inputs);
  const driverScores = scoreDrivers(inputs);
  const narrativeResult = getTopTwo(narrativeScores);
  const driverResult = getTopTwo(driverScores);

  const narrative = NARRATIVE_PERSONAS[narrativeResult.first];
  const driver = DRIVER_PERSONAS[driverResult.first];
  const narrativeSecond = NARRATIVE_PERSONAS[narrativeResult.second];
  const driverSecond = DRIVER_PERSONAS[driverResult.second];

  const narrativeVariants = resolveVariant(narrativeResult.first, inputs);
  const driverVariants = resolveDriverVariant(driverResult.first, inputs);

  return {
    narrative, driver,
    narrativeSecond, driverSecond,
    narrativeResult, driverResult,
    narrativeVariants, driverVariants,
    inputs,
  };
}

/* ===== RENDERING ===== */

function getMatchLabel(scores, id) {
  const vals = Object.values(scores);
  const max = Math.max(...vals);
  const total = vals.reduce((a, b) => a + b, 0);
  if (total === 0) return 'mid';
  const ratio = scores[id] / total;
  return ratio >= 0.40 ? 'high' : 'mid';
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function labelForAge(a) {
  const map = { '30s_under':'30대 이하', '40s':'40대', '50s':'50대', '60s':'60대', '70s_plus':'70대 이상' };
  return map[a] || '';
}

function labelForGender(g) {
  const map = { male:'남성', female:'여성', na:'미응답' };
  return map[g] || '';
}

function buildVariantLabel(inputs) {
  const parts = [];
  const gl = labelForGender(inputs.gender);
  const al = labelForAge(inputs.ageGroup);
  if (gl && gl !== '미응답') parts.push(gl);
  if (al) parts.push(al);
  return parts.length ? parts.join(' · ') + ' 변형' : '';
}

function renderQList(questions, colorClass) {
  return questions.map(item => `
    <div class="q-item">
      <div class="q-text">${escapeHtml(item.q)}</div>
      <div class="q-guide">${escapeHtml(item.guide)}</div>
    </div>`).join('');
}

function renderAvoidTags(avoidArr) {
  return `<div class="avoid-list">${avoidArr.map(s => `<span class="avoid-tag">🚫 ${escapeHtml(s)}</span>`).join('')}</div>`;
}

function collectVariantAppend(variants) {
  return variants.map(v => v.summaryAppend).filter(Boolean);
}

function collectVariantQuestions(variants) {
  const qs = [];
  variants.forEach(v => { if (v.questionOverrides) qs.push(...v.questionOverrides); });
  return qs;
}

}

function renderAxisBar(result) {
  const { narrative, driver, narrativeSecond, driverSecond, narrativeResult, driverResult } = result;
  const allA = Object.values(NARRATIVE_PERSONAS);
  const allB = Object.values(DRIVER_PERSONAS);

  const aChips = allA.map(p => {
    const isActive = p.id === narrative.id;
    const isSecond = p.id === narrativeSecond.id && narrativeResult.isMixed;
    let cls = `axis-chip ${p.color}`;
    if (isActive) cls += ' active';
    if (narrativeResult.isMixed && isActive) cls += ' mixed-badge';
    if (isSecond) cls += ' secondary-highlight';
    return `<button type="button" class="${cls}" data-switch-a="${p.id}" title="이 서사 유형으로 전환">${p.emoji} ${p.name}</button>`;
  }).join('');

  const bChips = allB.map(p => {
    const isActive = p.id === driver.id;
    const isSecond = p.id === driverSecond.id && driverResult.isMixed;
    let cls = `axis-chip ${p.color}`;
    if (isActive) cls += ' active';
    if (driverResult.isMixed && isActive) cls += ' mixed-badge';
    if (isSecond) cls += ' secondary-highlight';
    return `<button type="button" class="${cls}" data-switch-b="${p.id}" title="이 동인 유형으로 전환">${p.emoji} ${p.name}</button>`;
  }).join('');

  return `
    <div class="axis-bar-title">A축 — 손상 서사 (상담 도입 기준)</div>
    <div class="axis-row">${aChips}</div>
    <div class="axis-bar-title" style="margin-top:10px;">B축 — 의사결정 동인 (설명 순서 기준)</div>
    <div class="axis-row">${bChips}</div>
  `;
}

const state = {
  selections: {},
  lastResult: null,
  currentNarrative: null,
  currentDriver: null,
};

function getFieldValues() {
  const values = {};
  document.querySelectorAll('[data-field]').forEach(group => {
    const field = group.dataset.field;
    const type = group.dataset.type;
    if (type === 'single') {
      const selected = group.querySelector('.chip.selected');
      values[field] = selected ? selected.dataset.value : null;
    } else {
      const selected = group.querySelectorAll('.chip.selected');
      values[field] = Array.from(selected).map(c => c.dataset.value);
    }
  });
  return values;
}

function countFilled(values) {
  let n = 0;
  Object.entries(values).forEach(([k, v]) => {
    if (Array.isArray(v) ? v.length > 0 : v != null) n++;
  });
  return n;
}

function updateProgress() {
  const vals = getFieldValues();
  const filled = countFilled(vals);
  const total = 11;
  document.getElementById('progressText').textContent = `${filled} / ${total}`;
  document.getElementById('progressFill').style.width = `${Math.round(filled / total * 100)}%`;
}

function validateForm(values) {
  const required = ['ageGroup','gender','injuryType','painDuration','activityHistory','treatmentGoal','insurance','decisionStage','companion','infoLevel','mainConcern'];
  const missing = required.filter(f => {
    const v = values[f];
    return Array.isArray(v) ? v.length === 0 : !v;
  });
  return missing;
}

// Chip click handler
document.querySelectorAll('[data-field]').forEach(group => {
  const type = group.dataset.type;
  const maxSel = group.dataset.max ? parseInt(group.dataset.max) : Infinity;

  group.addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (!chip) return;

    if (type === 'single') {
      group.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
      chip.classList.add('selected');
    } else {
      if (chip.classList.contains('selected')) {
        chip.classList.remove('selected');
      } else {
        const current = group.querySelectorAll('.chip.selected').length;
        if (current < maxSel) chip.classList.add('selected');
      }
    }
    updateProgress();
  });
});

// Form submit
document.getElementById('consultForm').addEventListener('submit', e => {
  e.preventDefault();
  const values = getFieldValues();
  const missing = validateForm(values);
  const msgEl = document.getElementById('validationMsg');

  if (missing.length > 0) {
    msgEl.textContent = `아직 선택하지 않은 항목이 ${missing.length}개 있습니다. 모두 선택 후 생성해 주세요.`;
    return;
  }
  msgEl.textContent = '';

  const result = matchPersona(values);
  state.lastResult = result;
  state.currentNarrative = result.narrative.id;
  state.currentDriver = result.driver.id;

  document.getElementById('axisBar').innerHTML = renderAxisBar(result);
  document.getElementById('briefCard').innerHTML = renderCard(result);
  document.getElementById('resultSection').classList.add('visible');
  document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth', block: 'start' });

  // Axis chip switch listeners
  attachAxisSwitchListeners();
});

function attachAxisSwitchListeners() {
  document.querySelectorAll('[data-switch-a]').forEach(btn => {
    btn.addEventListener('click', () => {
      const newAId = btn.dataset.switchA;
      state.currentNarrative = newAId;
      rerenderWithOverride();
    });
  });
  document.querySelectorAll('[data-switch-b]').forEach(btn => {
    btn.addEventListener('click', () => {
      const newBId = btn.dataset.switchB;
      state.currentDriver = newBId;
      rerenderWithOverride();
    });
  });
}

function rerenderWithOverride() {
  const result = state.lastResult;
  const overrideNarrative = NARRATIVE_PERSONAS[state.currentNarrative];
  const overrideDriver = DRIVER_PERSONAS[state.currentDriver];
  const inputs = result.inputs;

  const narrativeVariants = resolveVariant(state.currentNarrative, inputs);
  const driverVariants = resolveDriverVariant(state.currentDriver, inputs);

  const overrideResult = {
    ...result,
    narrative: overrideNarrative,
    driver: overrideDriver,
    narrativeVariants,
    driverVariants,
  };

  document.getElementById('axisBar').innerHTML = renderAxisBar({
    ...overrideResult,
    narrative: overrideNarrative,
    driver: overrideDriver,
  });
  document.getElementById('briefCard').innerHTML = renderCard(overrideResult);
  attachAxisSwitchListeners();
}

// Reset
document.getElementById('resetBtn').addEventListener('click', () => {
  document.querySelectorAll('.chip.selected').forEach(c => c.classList.remove('selected'));
  updateProgress();
  document.getElementById('resultSection').classList.remove('visible');
  document.getElementById('briefCard').innerHTML = '';
  document.getElementById('axisBar').innerHTML = '';
  state.lastResult = null;
  state.currentNarrative = null;
  state.currentDriver = null;
  document.getElementById('formSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
});

// Initial progress render
updateProgress();

// TODO(법무검토 후): logging
</script>
</body>
</html>
